<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" id="themeColorMeta" content="#f5f5f7" />
  <title>PopBoard</title>
  <link rel="icon" type="image/png" sizes="any" href="/popboard-logo.png" />
  <link rel="shortcut icon" type="image/png" href="/popboard-logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/popboard-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Login Section -->
<div id="login">
  <div class="login-logo">
    <img src="/popboard-logo.png" alt="PopBoard Logo" id="login-logo-img" />
  </div>
  <h2>Join PopBoard</h2>
  <input id="usernameInput" placeholder="Your name" />
  <input id="boardNameInput" placeholder="PopBoard name" />
  <input id="studentPasswordInput" type="password" placeholder="Password (protects your account)" autocapitalize="none" autocorrect="off" spellcheck="false" />
  <div class="login-buttons">
    <button id="joinBtn">Join</button>
  </div>
  <p style="text-align:center;margin-top:16px;font-size:0.85rem;opacity:0.6;">
    <a id="teacherLoginBtn" href="#" style="color:inherit;text-decoration:underline;cursor:pointer;">Teacher? Sign in here</a>
  </p>
</div>

<!-- Teacher Login -->
<div id="teacherLogin" class="hidden">
  <div class="login-logo">
    <img src="/popboard-logo.png" alt="PopBoard Logo" id="teacher-logo-img" />
  </div>
  <h2>Teacher Login</h2>
  <input id="teacherNameInput" placeholder="Teacher name" />
  <input id="teacherPasswordInput" type="password" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false" />
  <div class="login-buttons">
    <button id="teacherSignInBtn">Sign In</button>
    <button id="backToMainLoginBtn" class="secondary-btn">Back</button>
  </div>
</div>

<!-- PopBoards Portal (Teacher) -->
<div id="boardsPortal" class="hidden">
  <header>
    <div id="logo">
      <img src="/popboard-logo.png" alt="PopBoard Logo" id="logo-img" loading="lazy" />
    </div>
    <div class="header-right">
      <button id="studyBtn" class="hidden">📚 Study</button>
      <button id="logoutBtnPortal">Logout</button>
      <button id="themeTogglePortal">🌙 Dark Mode</button>
    </div>
  </header>
  <div class="portal-container">
    <h2>Your PopBoards</h2>
    <div class="create-board-section">
      <input id="newBoardNameInput" placeholder="New PopBoard name" />
      <button id="createBoardBtn">Create PopBoard</button>
    </div>
    <div id="boardsList"></div>
  </div>
</div>

<!-- Students Portal (Teacher) -->
<div id="studentsPortal" class="hidden">
  <header>
    <div id="logo">
      <img src="/popboard-logo.png" alt="PopBoard Logo" id="logo-img" loading="lazy" />
    </div>
    <div class="header-right">
      <button id="backToBoardFromStudents">Back to Board</button>
      <button id="logoutBtnStudents">Logout</button>
      <button id="themeToggleStudents">🌙 Dark Mode</button>
    </div>
  </header>
  <div class="portal-container">
    <h2>Students</h2>
    <div style="text-align:center;margin-bottom:16px;">
      <button id="dailyDataToggleBtn" class="teacher-control">👁️‍🗨️ Daily Data Hidden</button>
    </div>
    <div id="studentsList"></div>
  </div>
</div>

<!-- Seating Map (Teacher) -->
<div id="seatingMap" class="hidden">
  <header>
    <div id="logo">
      <img src="/popboard-logo.png" alt="PopBoard Logo" id="logo-img" loading="lazy" />
    </div>
    <div class="header-right">
      <button id="backToBoardFromSeats">Back to Board</button>
      <button id="logoutBtnSeats">Logout</button>
      <button id="themeToggleSeats">🌙 Dark Mode</button>
    </div>
  </header>
  <div class="portal-container">
    <h2>Seating Map</h2>
    <div style="text-align:center;margin-bottom:16px;">
      <button id="addSeatBtn" class="teacher-control">+ Add Seat</button>
    </div>
    <div id="seatCanvas"></div>
  </div>
</div>

<!-- Student Dashboard -->
<div id="studentDashboard" class="hidden">
  <header>
    <div id="logo">
      <img src="/popboard-logo.png" alt="PopBoard Logo" id="logo-img" loading="lazy" />
    </div>
    <div class="header-right">
      <button id="backToStudentsFromDashboard">Back to Students</button>
      <button id="logoutBtnDashboard">Logout</button>
      <button id="themeToggleDashboard">🌙 Dark Mode</button>
    </div>
  </header>
  <div class="portal-container">
    <div id="dashboardContent"></div>
  </div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <header>
    <div id="logo">
      <img src="/popboard-logo.png" alt="PopBoard Logo" id="logo-img" loading="lazy" />
    </div>
    <div class="header-right">
      <div class="header-top-row">
        <button id="backToPortalBtn" class="hidden">Back to Boards</button>
        <button id="studentsBtn" class="hidden">Students</button>
        <button id="seatsBtn" class="hidden">🪑 Seats</button>
        <button id="teacherBtn" class="hidden">Poll</button>
      </div>
      <div class="header-bottom-row">
        <button id="logoutBtnApp">Logout</button>
        <button id="themeToggle">🌙 Dark Mode</button>
      </div>
    </div>
  </header>

  <!-- Teacher Poll Creation (top, above everything) -->
  <section id="pollCreation" class="hidden"></section>

  <!-- Teacher: Leaderboard visibility toggle -->
  <div id="leaderboardToggleContainer" class="hidden" style="text-align:center; margin-bottom:12px;">
    <button id="leaderboardVisibilityBtn" class="teacher-control">👁️ Leaderboard Shown</button>
  </div>

  <!-- Teacher: Class Live/Paused session toggle -->
  <div id="classSessionToggleContainer" class="hidden" style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:12px;">
    <span id="classSessionTimestampStart" class="state-pill-meta"></span>
    <button id="classSessionToggleBtn" type="button" class="state-pill is-paused">🔘 Class Paused</button>
    <span id="classSessionTimestampEnd" class="state-pill-meta"></span>
  </div>

  <!-- Leaderboard -->
  <section id="leaderboardSection"></section>

  <!-- Poll Section -->
  <section id="pollSection"></section>

  <!-- Teacher Panel -->
  <section id="teacherPanel" class="hidden">
    <div id="upvote-history-container" class="teacher-panel">
      <h3>Upvote History</h3>
      <div id="upvote-history-log" class="history-log"></div>
    </div>
  </section>

  <!-- Daily Dashboard (teacher only) -->
  <section id="dailyDashboard" class="hidden">
    <div class="daily-dashboard-card">
      <div id="dailyEngagementDisplay" class="daily-engagement-big"></div>
      <div id="dailySeatMapWidget" class="daily-seat-map-widget"><div id="dailySeatMapCanvas"></div></div>
      <div id="dailyMetricsText" class="daily-metrics-text"></div>
      <div id="classConfusionTimeline" class="class-confusion-timeline"></div>
    </div>
  </section>

  <!-- Confusion indicator (students only) -->
  <div id="confusionIndicator" class="hidden">
    <span class="confusion-label">How's it going?</span>
    <div class="confusion-buttons">
      <button type="button" id="confusionGreenBtn" class="confusion-btn" data-state="green" title="I've got it"><span class="confusion-dot confusion-dot-green"></span></button>
      <button type="button" id="confusionOrangeBtn" class="confusion-btn" data-state="orange" title="Somewhat confused"><span class="confusion-dot confusion-dot-orange"></span></button>
      <button type="button" id="confusionRedBtn" class="confusion-btn" data-state="red" title="I'm confused"><span class="confusion-dot confusion-dot-red"></span></button>
    </div>
    <div id="confusionSparkline" class="confusion-sparkline"></div>
  </div>

  <!-- "Are you still confused?" auto-check-in prompt (students only) -->
  <div id="confusionPrompt" class="hidden state-pill-prompt">
    <span id="confusionPromptText" class="state-pill-prompt-text"></span>
    <div class="state-pill-prompt-buttons">
      <button type="button" id="confusionPromptYesBtn" class="state-pill state-pill-lg state-pill-yes">Yes</button>
      <button type="button" id="confusionPromptNoBtn" class="state-pill state-pill-lg state-pill-no">No</button>
    </div>
  </div>

  <!-- New Post Section (sticky bottom) -->
  <section id="newPost" class="comment-collapsed">
    <textarea id="postInput" placeholder="Write a comment..."></textarea>
    <div class="post-options-row">
      <div class="post-options-left">
        <input type="checkbox" id="anonymousToggle" />
        <label for="anonymousToggle">🥷🏼 Anonymous</label>
        <input type="file" id="postImageInput" accept="image/*" style="display:none;" />
        <button id="postImageBtn" class="secondary-btn" style="padding: 8px 16px; font-size: 0.85rem;">📷 Add Image</button>
      </div>
      <div class="post-options-right comment-bar-actions">
        <button id="cancelPostBtn">Cancel</button>
        <button id="postBtn">Post</button>
      </div>
    </div>
    <div id="postImagePreview" class="image-preview"></div>
  </section>

  <!-- Sorting -->
  <section id="sortSection">
    <select id="sortSelect">
      <option value="new">Newest</option>
      <option value="top">Top</option>
    </select>
  </section>

  <!-- Posts -->
  <section id="posts"></section>

  <!-- Archived Comments (hidden primary comments, teacher only) -->
  <section id="archivedComments"></section>

  <!-- Archived Polls (hidden + interacted, teacher only) -->
  <section id="archivedPolls"></section>

</div>

<!-- Floating "edit my identity" popup, opened by clicking your own row in
     the leaderboard (both expanded and collapsed) -- same content that used
     to live in a permanently-visible block above the posts. -->
<div id="identityPopup" class="hidden identity-popup">
  <div class="leaderboard-identity-group">
    <div id="emojiCircle" title="Click to choose your emoji">
      <span id="emojiDisplay">Choose Emoji</span>
    </div>
    <div id="nicknameInputContainer"></div>
  </div>
  <input id="emojiInput" maxlength="2" placeholder="" />
</div>

<script src="https://cdn.jsdelivr.net/npm/compromise@14/builds/compromise.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
