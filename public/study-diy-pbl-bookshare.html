<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dimitry's DIY Project Based Learning for Math and Science Bookshare // PopBoard</title>
<link rel="icon" type="image/png" href="popboard-logo.png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="friction-lesson/fl.css">
<link rel="stylesheet" href="diy-pbl-bookshare/bs.css">
</head>
<body>
<button class="bs-bar-toggle pencil-btn" id="bsBarToggle" type="button" aria-expanded="false" aria-controls="flBar" hidden>Controls</button>
<header class="fl-bar" id="flBar">
  <a id="studyBackBtn" class="pencil-btn" data-study-back href="study.html" aria-label="Back to Study library">‹ Library</a>
  <h1 id="flTitle">Dimitry's DIY Project Based Learning for Math and Science Bookshare</h1>
  <button class="pencil-btn" id="prevBtn" type="button" aria-label="Previous page">‹</button>
  <span class="fl-count" id="flCount" aria-live="polite">Page 1 of 20</span>
  <button class="pencil-btn" id="nextBtn" type="button" aria-label="Next page">›</button>
  <button class="pencil-btn" id="playBtn" type="button" aria-pressed="true" aria-label="Pause">❚❚ Pause</button>
  <button class="pencil-btn" id="replayBtn" type="button" aria-label="Replay page">↺ Replay</button>
  <button class="pencil-btn" id="autoBtn" type="button" aria-pressed="false" title="Advance 4 s after each page finishes">Auto-advance</button>
  <button class="pencil-btn" id="textBtn" type="button" aria-pressed="false" title="Hide the side text (script + bullets). Full screen also hides all text.">Hide text</button>
  <button class="pencil-btn" id="fsBtn" type="button" aria-pressed="false">⛶ Full screen (hide text)</button>
  <button class="pencil-btn" id="themeBtn" type="button" aria-label="Switch light or dark">☾ Dark</button>
</header>
<div class="bs-rotate-note" id="bsRotateNote" aria-live="polite">
  <img class="bs-rotate-paper" src="diy-pbl-bookshare/art/paper/sticky_note.webp" alt="" aria-hidden="true">
  <img class="bs-rotate-tape" src="diy-pbl-bookshare/art/paper/tape_a.webp" alt="" aria-hidden="true">
  <span class="bs-rotate-text">Turn your phone sideways</span>
</div>
<div class="fl-progress" aria-hidden="true"><i id="flProg"></i></div>
<main class="fl-viewport">
  <div class="fl-frame" id="flFrame">
    <section class="fl-art" aria-label="Storyboard"><div class="fl-scene" id="flScene" aria-live="polite"></div></section>
    <aside class="fl-side" id="flSide" aria-label="Script and page text"></aside>
    <div class="fl-guide" id="flGuide" aria-live="polite"></div>
    <div class="fl-cap" id="flCap"><span class="cap-q"><b id="flCapT"></b><span id="flCapQ"></span></span></div>
  </div>
</main>
<script>
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-study-back]");
    if (!b) return;
    e.preventDefault();
    location.href = "study.html" + location.search;
  });
</script>
<script type="module" src="diy-pbl-bookshare/bs-app.js"></script>
</body>
</html>
