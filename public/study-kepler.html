<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="shared/layout/layout.css">
<script type="module" src="shared/layout/layout.js"></script>
<title>Kepler's Laws Sandbox // PopBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Paper theme (the app's "light" theme) applies here too, before first paint.
  try { if (localStorage.getItem("theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<style>
:root{
  --bg:#05060a;
  --panel:#171C22;
  --panel-2:#1E252D;
  --panel-3:#252E38;
  --border:#2C3742;
  --border-lit:#3A4854;
  --amber:#FFB300;
  --amber-dim:#8a640f;
  --cyan:#5FD3C4;
  --violet:#B07CFF;
  --violet-dim:#6b4a99;
  --text:#E9E6DE;
  --text-dim:#93A0AC;
  --text-dimmer:#5C6874;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);height:100%;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;touch-action:none;}
h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
button,input{font-family:inherit;}
#stage{display:block;width:100vw;height:100vh;height:100dvh;background:var(--bg);touch-action:none;}

/* ---------- top / bottom bars ---------- */
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;pointer-events:none;z-index:50;}
.bar-top{top:0;}
.bar-bottom{bottom:0;}
.bar button{pointer-events:auto;background:none;border:none;color:#0A84FF;font-size:15px;cursor:pointer;padding:4px 2px;}
.bar button:active{opacity:0.6;}
.bar-left{display:flex;align-items:center;gap:18px;}
.bar button.study-back-btn{display:inline-flex;align-items:center;gap:2px;}
/* Phones: chevron only, so the left buttons never run into the centered one. */
@media (max-width:400px){.bar-left{gap:12px;}.bar button.study-back-btn .back-label{display:none;}.bar button.study-back-btn svg{width:20px;height:20px;}}
.bar-top .bar-center, .bar-bottom .bar-center{position:absolute;left:50%;transform:translateX(-50%);}

/* ---------- law switcher ---------- */
#lawSwitcher{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:46;display:flex;gap:6px;
  background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-lit);border-radius:14px;padding:6px;pointer-events:auto;}
#lawSwitcher .law-btn{padding:7px 12px;border-radius:9px;border:none;background:transparent;color:var(--text-dim);
  font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;}
#lawSwitcher .law-btn.active{background:var(--amber-dim);color:#fff;}
#lawSwitcher .law-btn:active{opacity:0.7;}

/* ---------- status banner ---------- */
#statusBanner{
  position:fixed;top:104px;left:50%;transform:translateX(-50%);z-index:45;
  background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-lit);border-radius:14px;padding:10px 22px;text-align:center;
  max-width:min(92vw,620px);pointer-events:none;transition:border-color 0.3s ease, box-shadow 0.3s ease;
}
#statusBanner .status-type{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text);}
#statusBanner .status-reason{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-family:'JetBrains Mono',monospace;}
#statusBanner.escape{border-color:var(--amber-dim);box-shadow:0 0 24px rgba(255,179,0,0.18);}
#statusBanner.escape .status-type{color:var(--amber);}
#statusBanner.crashed{border-color:#8a2f2f;box-shadow:0 0 24px rgba(255,80,80,0.18);}
#statusBanner.crashed .status-type{color:#ff6b6b;}

/* ---------- big digital readout HUD ---------- */
#keplerHud{position:fixed;top:168px;left:50%;transform:translateX(-50%);z-index:44;display:flex;gap:10px;pointer-events:none;}
.hud-tile{background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-lit);border-radius:14px;padding:8px 18px 10px;text-align:center;min-width:118px;}
.hud-tile .hud-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);}
.hud-tile .hud-value{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;line-height:1.15;color:var(--text);}
.hud-tile .hud-unit{font-size:12px;color:var(--text-dim);margin-left:3px;}

/* ---------- floating panels ---------- */
.panel{
  position:fixed;z-index:60;width:320px;max-width:calc(100vw - 32px);
  background:rgba(22,24,28,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;
  box-shadow:0 12px 32px rgba(0,0,0,0.5);
  max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);overflow-y:auto;
}
.panel.wide{width:380px;}
.panel.hidden{display:none;}
.panel h3{margin:0 0 14px 0;text-align:center;font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#fff;}
.panel-row{margin-bottom:14px;}
.panel-row:last-child{margin-bottom:0;}
.panel-label{font-size:13px;color:#e5e5e7;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.panel-hint{font-size:11.5px;color:#8e8e93;line-height:1.5;margin-top:10px;}
.panel-link{display:block;text-align:center;color:#0A84FF;font-size:13px;margin-top:12px;cursor:pointer;background:none;border:none;width:100%;padding:4px;}
.panel-link:active{opacity:0.6;}
.panel-link[disabled]{opacity:0.4;cursor:default;}
.panel-section-title{text-align:center;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6e6e73;margin:16px 0 8px;}

input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:#48484a;outline:none;margin:0;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none;cursor:pointer;}

/* ---------- segmented control / toggles ---------- */
.seg-row{display:flex;gap:6px;margin-bottom:16px;}
.seg-btn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border-lit);background:var(--panel-2);
  color:var(--text-dim);font-size:11.5px;text-align:center;cursor:pointer;}
.seg-btn.active{background:var(--amber-dim);color:#fff;border-color:var(--amber);}
.seg-btn:active{opacity:0.7;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px;color:#e5e5e7;}
.toggle-switch{width:40px;height:24px;border-radius:12px;background:#3a3a3c;position:relative;cursor:pointer;flex-shrink:0;}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.15s ease;}
.toggle-switch.on{background:var(--violet-dim);}
.toggle-switch.on .knob{left:18px;}

/* ---------- zoom / mode buttons ---------- */
#stageControls{position:fixed;right:18px;bottom:64px;z-index:55;display:flex;flex-direction:column;gap:8px;}
.round-btn{
  width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,0.8);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.round-btn:active{opacity:0.6;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-card{
  background:rgba(22,24,28,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px;
  max-width:480px;width:100%;max-height:80vh;overflow-y:auto;
}
.modal-card h2{margin:0 0 14px 0;font-size:17px;text-align:center;}
.modal-card p{font-size:13.5px;line-height:1.6;color:#d1d1d6;margin:0 0 10px 0;}
.modal-card .close-link{display:block;text-align:center;color:#0A84FF;margin-top:16px;cursor:pointer;background:none;border:none;font-size:14px;width:100%;padding:6px;}

/* ---------- lab table / graphs (Law 3) ---------- */
#keplerLabTable{width:100%;border-collapse:collapse;font-size:10.5px;font-family:'JetBrains Mono',monospace;}
#keplerLabTable th,#keplerLabTable td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
#keplerLabTable th{color:var(--text-dim);font-weight:500;font-size:9px;text-transform:uppercase;letter-spacing:0.03em;}
#keplerLabTable td{color:var(--text);}
#keplerLabTable tr:last-child td{border-bottom:none;}
#keplerLabTable tr.stale td{color:var(--text-dimmer);}
.lab-empty{text-align:center;color:var(--text-dimmer);font-size:12px;padding:14px 0;}
.lab-row-del{color:#ff6b6b;cursor:pointer;}

/* ---------- Paper theme ---------- */
:root[data-theme="light"]{
  --bg:#f4efe4; --panel:#fbf8f1; --panel-2:#efe8da; --panel-3:#e6dccb; --border:#d6cbb6; --border-lit:#c4b69c;
  --amber:#9a6200; --amber-dim:#b07500; --cyan:#0f766e; --violet:#6d3fc0; --violet-dim:#8e6ad6;
  --text:#1f1a14; --text-dim:#5b5144; --text-dimmer:#6f6556;
}
:root[data-theme="light"] .bar button,:root[data-theme="light"] .panel-link,:root[data-theme="light"] .modal-card .close-link{color:#0a58b8;}
:root[data-theme="light"] #lawSwitcher,:root[data-theme="light"] #statusBanner,:root[data-theme="light"] .hud-tile{background:rgba(251,248,241,0.9);}
:root[data-theme="light"] .panel,:root[data-theme="light"] .modal-card{background:rgba(251,248,241,0.96);border-color:var(--border);color:var(--text);box-shadow:0 12px 32px rgba(60,45,20,0.18);}
:root[data-theme="light"] .panel h3,:root[data-theme="light"] .panel-label,:root[data-theme="light"] .toggle-row,:root[data-theme="light"] .modal-card p{color:var(--text);}
:root[data-theme="light"] .panel-hint,:root[data-theme="light"] .panel-section-title{color:var(--text-dim);}
:root[data-theme="light"] .round-btn{background:rgba(251,248,241,0.9);border-color:var(--border-lit);color:var(--text);}
:root[data-theme="light"] input[type="range"]{background:#cfc4ae;}
:root[data-theme="light"] input[type="range"]::-webkit-slider-thumb{background:#1f1a14;}
:root[data-theme="light"] .toggle-switch{background:#cfc4ae;}
:root[data-theme="light"] canvas.lab-graph{background:rgba(60,45,20,0.06);}

/* ---------- phones: law pills, subtitle, then the e/a/T card and the readouts stacked below ---------- */
#lawSub{display:none;}
@media (max-width:600px){
  #lawSwitcher{flex-wrap:wrap;justify-content:center;width:calc(100vw - 24px);max-width:420px;top:calc(50px + env(safe-area-inset-top));}
  #lawSwitcher .law-btn{flex:1 1 0;border-radius:999px;font-size:13px;}
  #lawSwitcher .law-btn .law-sub{display:none;}
  #lawSub{display:block;flex-basis:100%;text-align:center;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);padding:2px 0 0;}
  #statusBanner{width:calc(100vw - 24px);max-width:420px;padding:8px 12px;}
  #keplerHud{width:calc(100vw - 24px);max-width:420px;gap:8px;}
  .hud-tile{flex:1 1 0;min-width:0;padding:6px 8px 8px;}
  .hud-tile .hud-value{font-size:24px;}
}
canvas.lab-graph{width:100%;height:140px;display:block;border-radius:10px;background:rgba(0,0,0,0.25);margin-top:8px;}
</style>

<script type="module">
"use strict";
/* ============================================================
   KEPLER'S LAWS SANDBOX -- a real Newtonian orbital-mechanics simulator
   (hand-rolled 2D canvas). Original implementation; no shared code with
   the other study modules or app.js (each module in the library is fully
   self-contained).
   ============================================================ */

/* ============================================================
   Pure physics -- no DOM/canvas references, so it can be (and was)
   unit tested in isolation before any rendering code was written
   (see scratchpad/verify_kepler_physics.js). Kept verbatim from that
   validated scratchpad copy.

   Units: AU (distance), years (time), solar masses M_sun (star mass).
   mu = G*M_star = 4*pi^2*M_star in these units -- the standard
   astronomy-teaching convenience constant, so a 1-solar-mass star gives
   T^2 = a^3 exactly with no unit-conversion clutter. The star is always
   fixed at the world origin (a deliberate simplification, explained in
   the Tutorial): every (x,y)/(vx,vy) below is therefore already
   star-centered, and planets do NOT gravitationally interact with each
   other (no N-body perturbation) -- the standard, textbook-correct
   idealization for teaching Kepler's Laws.
   ============================================================ */
var TWO_PI = Math.PI * 2;

function muOf(starMassSolar) { return 4 * Math.PI * Math.PI * starMassSolar; }

var MIN_R3_EPS = 1e-12;
function gravityAccel(muStar, x, y) {
  var r2 = x * x + y * y;
  var r = Math.sqrt(r2);
  var r3 = r2 * r;
  if (r3 < MIN_R3_EPS) { return { ax: 0, ay: 0 }; }
  var f = -muStar / r3;
  return { ax: f * x, ay: f * y };
}

/* Classical 4th-order Runge-Kutta, not semi-implicit Euler (Space
   Sandbox's pattern) -- symplectic Euler's good long-run energy behavior
   depends on a FIXED step size, and this module needs the step size to
   adapt every frame to the planet's current angular rate (see
   computeAdaptiveSubstepPlan) so a highly eccentric orbit stays accurate
   at periapsis without wasting steps at apoapsis. Empirically, feeding a
   varying step size into symplectic Euler breaks its symplecticity and
   produces a genuine secular energy drift (a slowly decaying orbit);
   RK4 does not rely on symplecticity for its accuracy and tolerates a
   varying step size with no such drift (confirmed in the scratchpad
   suite: <0.0001% drift over 5 orbits with the adaptive plan that made
   symplectic Euler decay by several percent per orbit). */
function derivative(state, muStar) {
  var acc = gravityAccel(muStar, state.x, state.y);
  return { x: state.vx, y: state.vy, vx: acc.ax, vy: acc.ay };
}
function addScaled(state, d, dt) {
  return { x: state.x + d.x * dt, y: state.y + d.y * dt, vx: state.vx + d.vx * dt, vy: state.vy + d.vy * dt };
}
function stepPlanetState(state, muStar, dt) {
  var k1 = derivative(state, muStar);
  var k2 = derivative(addScaled(state, k1, dt / 2), muStar);
  var k3 = derivative(addScaled(state, k2, dt / 2), muStar);
  var k4 = derivative(addScaled(state, k3, dt), muStar);
  return {
    x: state.x + (dt / 6) * (k1.x + 2 * k2.x + 2 * k3.x + k4.x),
    y: state.y + (dt / 6) * (k1.y + 2 * k2.y + 2 * k3.y + k4.y),
    vx: state.vx + (dt / 6) * (k1.vx + 2 * k2.vx + 2 * k3.vx + k4.vx),
    vy: state.vy + (dt / 6) * (k1.vy + 2 * k2.vy + 2 * k3.vy + k4.vy)
  };
}

var MAX_ANGLE_PER_SUBSTEP = 0.05;
var MAX_SUBSTEPS_PER_FRAME = 2000;
var MIN_R2_EPS = 1e-9;
function computeAdaptiveSubstepPlan(planets, muStar, frameSimDt) {
  if (frameSimDt <= 0) { return { steps: 1, subDt: 0 }; }
  var dtBound = Infinity;
  for (var i = 0; i < planets.length; i++) {
    var p = planets[i];
    if (p.crashed) { continue; }
    var r2 = p.x * p.x + p.y * p.y;
    var h = p.x * p.vy - p.y * p.vx;
    var omega = Math.abs(h) / Math.max(r2, MIN_R2_EPS);
    if (omega > 1e-9) { dtBound = Math.min(dtBound, MAX_ANGLE_PER_SUBSTEP / omega); }
  }
  if (!isFinite(dtBound)) { dtBound = frameSimDt; }
  var steps = Math.max(1, Math.min(MAX_SUBSTEPS_PER_FRAME, Math.ceil(frameSimDt / dtBound)));
  return { steps: steps, subDt: frameSimDt / steps };
}

function isStarCollision(x, y, collisionRadius) {
  return (x * x + y * y) < collisionRadius * collisionRadius;
}

function stepPlanets(planets, muStar, frameSimDt, collisionRadius) {
  if (frameSimDt <= 0 || planets.length === 0) { return; }
  var plan = computeAdaptiveSubstepPlan(planets, muStar, frameSimDt);
  for (var s = 0; s < plan.steps; s++) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      if (p.crashed) { continue; }
      var next = stepPlanetState(p, muStar, plan.subDt);
      p.x = next.x; p.y = next.y; p.vx = next.vx; p.vy = next.vy;
      if (collisionRadius && isStarCollision(p.x, p.y, collisionRadius)) { p.crashed = true; }
    }
  }
}

var ENERGY_ESCAPE_EPS = 1e-6;
var ECC_CIRCULAR_EPS = 1e-6;
function orbitalElementsFromState(x, y, vx, vy, muStar, lastPeriapsisDir) {
  var r = Math.sqrt(x * x + y * y);
  var v2 = vx * vx + vy * vy;
  var v = Math.sqrt(v2);
  var energy = v2 / 2 - muStar / r;
  var h = x * vy - y * vx;
  var rdotv = x * vx + y * vy;
  var exFactor = (v2 - muStar / r) / muStar;
  var ex = exFactor * x - (rdotv / muStar) * vx;
  var ey = exFactor * y - (rdotv / muStar) * vy;
  var e = Math.sqrt(ex * ex + ey * ey);

  var periapsisDir;
  if (e > ECC_CIRCULAR_EPS) {
    periapsisDir = { x: ex / e, y: ey / e };
  } else if (lastPeriapsisDir) {
    periapsisDir = lastPeriapsisDir;
  } else {
    periapsisDir = r > 1e-9 ? { x: x / r, y: y / r } : { x: 1, y: 0 };
  }

  var isEscape = energy > -ENERGY_ESCAPE_EPS || e >= 1 - 1e-9;
  var periapsisDistance = (h * h / muStar) / (1 + e);

  var a = -muStar / (2 * energy);
  var apoapsisDistance = null, period = null, center = null, focus2 = null, semiMinorAxis = null;
  if (!isEscape) {
    apoapsisDistance = a * (1 + e);
    period = TWO_PI * Math.sqrt((a * a * a) / muStar);
    semiMinorAxis = a * Math.sqrt(Math.max(0, 1 - e * e));
    center = { x: -a * e * periapsisDir.x, y: -a * e * periapsisDir.y };
    focus2 = { x: -2 * a * e * periapsisDir.x, y: -2 * a * e * periapsisDir.y };
  }

  return {
    r: r, v: v, energy: energy, h: h, e: e, eVec: { x: ex, y: ey },
    a: a, periapsisDistance: periapsisDistance, apoapsisDistance: apoapsisDistance,

function sampleEllipsePoints(elements, segments) {

  var dirx = Math.cos(la) * tangential.x + Math.sin(la) * radial.x;
  var diry = Math.cos(la) * tangential.y + Math.sin(la) * radial.y;

    total += points[i].x * points[i + 1].y - points[i + 1].x * points[i].y;
  }

}

/* ============================================================
   Scene / rendering state
   ============================================================ */
var canvas = document.getElementById("stage");
var ctx = canvas.getContext("2d");
var dpr = Math.max(1, window.devicePixelRatio || 1);
var canvasW = 0, canvasH = 0; // CSS pixels -- all world<->screen math works in these

function resizeCanvas() {
  canvasW = window.innerWidth;
  canvasH = window.innerHeight;
  canvas.width = Math.round(canvasW * dpr);
  canvas.height = Math.round(canvasH * dpr);
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

var ZOOM_MIN = 10, ZOOM_MAX = 2000; // screen px per AU
var camera = { x: 0, y: 0, zoom: 140, rotation: 0 };

function worldToScreen(camera, cw, ch, wx, wy) {

}
function screenToWorld(camera, cw, ch, sx, sy) {

/* ---------- starfield (ported from Space Sandbox's seeded-grid approach,
   re-tuned for an AU-scale world instead of Sandbox's arbitrary units)
   ---------- */
var STAR_TARGET_SCREEN_PX = 180;
var STAR_CELL_UNIT = 2; // AU
var STARS_PER_CELL = 10;
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  var raw = STAR_TARGET_SCREEN_PX / Math.max(1e-6, zoom);

  }

}

  var minX = Math.min(topLeft.x, bottomRight.x), maxX = Math.max(topLeft.x, bottomRight.x);
  var minY = Math.min(topLeft.y, bottomRight.y), maxY = Math.max(topLeft.y, bottomRight.y);

}
function drawStarfield() {

    for (var cy = range.cy0; cy <= range.cy1; cy++) {
      var stars = cellStars(cx, cy, cellSize);
      for (var i = 0; i < stars.length; i++) {

        if (s.x < -4 || s.x > canvasW + 4 || s.y < -4 || s.y > canvasH + 4) { continue; }
        ctx.beginPath();

/* ---------- star + planet rendering ---------- */
var STAR_RENDER_RADIUS_PX = 16; // fixed screen size regardless of zoom, like a glowing point source
var STAR_COLLISION_RADIUS_AU = 0.06;
var PAPER = document.documentElement.getAttribute("data-theme") === "light";

function drawStar() {
  var s = worldToScreen(camera, canvasW, canvasH, 0, 0);
  var halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, STAR_RENDER_RADIUS_PX * 3);
  halo.addColorStop(0, "rgba(255,200,80,0.55)");
  halo.addColorStop(1, "rgba(255,200,80,0)");

  ctx.beginPath(); ctx.arc(s.x, s.y, STAR_RENDER_RADIUS_PX * 3, 0, Math.PI * 2); ctx.fill();

  var body = ctx.createRadialGradient(s.x - 4, s.y - 4, 0, s.x, s.y, STAR_RENDER_RADIUS_PX);
  body.addColorStop(0, "#fff6d8");
  body.addColorStop(1, "#ffb300");

  if (pts.length < 2) { return; }
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var s = worldToScreen(camera, canvasW, canvasH, pts[i].x, pts[i].y);
    if (i === 0) { ctx.moveTo(s.x, s.y); } else { ctx.lineTo(s.x, s.y); }
  }

}

function drawFociAndApsides(elements, color) {
  var starScreen = worldToScreen(camera, canvasW, canvasH, 0, 0);
  // occupied focus (the star itself) gets a small ring; the empty focus a hollow marker
  if (elements.focus2) {
    var f2 = worldToScreen(camera, canvasW, canvasH, elements.focus2.x, elements.focus2.y);
    ctx.beginPath(); ctx.arc(f2.x, f2.y, 4, 0, Math.PI * 2);
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();

  var r = planetRenderRadiusPx(p.massEarth);

  }
}

function colorForIndex(idx) { return PLANET_COLORS[idx % PLANET_COLORS.length]; }
function colorForPlanet(p) { return colorForIndex(planets.indexOf(p)); }

var TRAIL_MAX_POINTS = 240;
function drawTrail(p, color) {
  if (!p.trail || p.trail.length < 2) { return; }
  ctx.beginPath();
  for (var i = 0; i < p.trail.length; i++) {
    var s = worldToScreen(camera, canvasW, canvasH, p.trail[i].x, p.trail[i].y);
    if (i === 0) { ctx.moveTo(s.x, s.y); } else { ctx.lineTo(s.x, s.y); }
  }

/* ============================================================
   System state: a near-circular starter planet and a moderately
   eccentric one (so there's something interesting to look at
   immediately, matching the "space sandbox game" feel), plus whatever
   the student places afterward. The star is always fixed at the world
   origin (see the physics header comment).
   ============================================================ */
var starMassSolar = 1.0;
var nextPlanetId = 3;
var selectedId = 2;
var paused = false;
var simTimeScale = 0.5; // simulated years per real second
var lastFrameTime = null;
var lastPeriapsisDirById = {};
var extras = { trails: true, orbitPaths: true, fociApsides: true, velocityVectors: true };

function makePlanet(id, state, massEarth, label) {
  return { id: id, x: state.x, y: state.y, vx: state.vx, vy: state.vy, massEarth: massEarth, crashed: false, label: label, trail: [] };
}
function defaultPlanets() {
  var mu = muOf(starMassSolar);
  var s1 = stateFromOrbitalControls(1.0, 20, circularVelocity(mu, 1.0), 0);
  var a2 = 2.2, e2 = 0.55;
  var rp2 = a2 * (1 - e2);
  var v2 = Math.sqrt(mu * (2 / rp2 - 1 / a2));
  var s2 = stateFromOrbitalControls(rp2, 160, v2, 0);
  return [makePlanet(1, s1, 1, "Planet 1"), makePlanet(2, s2, 4, "Planet 2")];
}
var planets = defaultPlanets();

function clearSystem() {
  planets = [];
  selectedId = null;
  nextPlanetId = 3;
  lastPeriapsisDirById = {};
}

/* ============================================================
   Placement/launch + pan/zoom gestures (ported from Space Sandbox's
   Pointer Events state machine): press-and-hold to place a new planet
   at that world point, drag before releasing to fling it (velocity =
   drag distance in world AU * LAUNCH_SPEED_SCALE); release immediately
   with no drag places it at rest. Tapping an existing planet selects it
   instead of placing a new one. Two fingers pan/pinch-zoom the camera.
   ============================================================ */
var LAUNCH_SPEED_SCALE = 3;
var PINCH_DETECT_DELAY_MS = 130;
var MIN_HIT_RADIUS_PX = 14;
var nextPlanetMassEarth = 1;

var activePointers = new Map();
var pendingPlacement = null;
var placeGesture = null;
var panZoomGesture = null;

function hitTestPlanet(screenX, screenY) {
  for (var i = planets.length - 1; i >= 0; i--) {
    var p = planets[i];
    var s = worldToScreen(camera, canvasW, canvasH, p.x, p.y);
    var hitR = Math.max(MIN_HIT_RADIUS_PX, planetRenderRadiusPx(p.massEarth));
    var dx = screenX - s.x, dy = screenY - s.y;

}

  pendingPlacement = null;
  if (!pending) { return; }
  clearTimeout(pending.timer);
  var state = { x: pending.startWorld.x, y: pending.startWorld.y, vx: 0, vy: 0 };
  var p = makePlanet(nextPlanetId++, state, nextPlanetMassEarth, "Planet " + (nextPlanetId - 1));
  planets.push(p);
  selectedId = p.id;
  refreshSelectionDependentPanels();
  var moved = pending.lastWorld.x !== pending.startWorld.x || pending.lastWorld.y !== pending.startWorld.y;
  if (fromRelease) {
    if (moved) {
      p.vx = (pending.lastWorld.x - pending.startWorld.x) * LAUNCH_SPEED_SCALE;
      p.vy = (pending.lastWorld.y - pending.startWorld.y) * LAUNCH_SPEED_SCALE;

  }

}

// Refreshes whichever panels are currently open and depend on the
// selection/system state (Properties always; the Law panel only if it's
// open, since Law 1/3 content both read the selected planet).
function refreshSelectionDependentPanels() {

canvas.addEventListener("pointerdown", function (e) {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 1) {
    var world = screenToWorld(camera, canvasW, canvasH, e.clientX, e.clientY);
    var hit = hitTestPlanet(e.clientX, e.clientY);
    if (hit) {
      selectedId = hit.id;
      refreshSelectionDependentPanels();
      placeGesture = null;
    } else {
      pendingPlacement = {
        pointerId: e.pointerId, startWorld: world, lastWorld: world,
        timer: setTimeout(function () { finalizePendingPlacement(false); }, PINCH_DETECT_DELAY_MS)

  }

canvas.addEventListener("pointermove", function (e) {
  if (!activePointers.has(e.pointerId)) { return; }
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (panZoomGesture && activePointers.size === 2) {
    var pts = Array.from(activePointers.values());
    var dist = pointerDistance(pts[0], pts[1]);
    var mid = pointerMidpoint(pts[0], pts[1]);
    var zoomRatio = dist / Math.max(1, panZoomGesture.startDist);
    camera.zoom = clamp(panZoomGesture.startCamera.zoom * zoomRatio, ZOOM_MIN, ZOOM_MAX);
    var dxScreen = mid.x - panZoomGesture.startMid.x, dyScreen = mid.y - panZoomGesture.startMid.y;
    camera.x = panZoomGesture.startCamera.x - dxScreen / panZoomGesture.startCamera.zoom;
    camera.y = panZoomGesture.startCamera.y - dyScreen / panZoomGesture.startCamera.zoom;

  }

  var world = screenToWorld(camera, canvasW, canvasH, e.clientX, e.clientY);
  if (pendingPlacement && e.pointerId === pendingPlacement.pointerId) {
    pendingPlacement.lastWorld = world;
  } else if (placeGesture) {
    placeGesture.aimWorld = world;
    placeGesture.particle.vx = (world.x - placeGesture.startWorld.x) * LAUNCH_SPEED_SCALE;
    placeGesture.particle.vy = (world.y - placeGesture.startWorld.y) * LAUNCH_SPEED_SCALE;

document.getElementById("zoomInBtn").addEventListener("click", function () { camera.zoom = clamp(camera.zoom * 1.35, ZOOM_MIN, ZOOM_MAX); });
document.getElementById("zoomOutBtn").addEventListener("click", function () { camera.zoom = clamp(camera.zoom / 1.35, ZOOM_MIN, ZOOM_MAX); });

function drawAimLine() {
  if (!placeGesture || !placeGesture.aimWorld) { return; }
  var s0 = worldToScreen(camera, canvasW, canvasH, placeGesture.startWorld.x, placeGesture.startWorld.y);
  var s1 = worldToScreen(camera, canvasW, canvasH, placeGesture.aimWorld.x, placeGesture.aimWorld.y);

/* ============================================================
   Properties panel: star mass + the selected planet's direct orbital

   eccentricity slider, since a desired (a,e) has no unique state vector

function makeLinearSliderRow(labelFn, value, min, max, step, onInput) {

  slider.value = String(value);

}

  var label = document.createElement("div");
  label.className = "panel-label";
  label.textContent = labelFn(value);

  slider.value = String(valueToSlider(value, min, max));

var STAR_MASS_RANGE = { min: 0.1, max: 50 };

function fmtAU(v) { return v.toFixed(v < 1 ? 3 : 2) + " AU"; }

function fmtVel(v) { return v.toFixed(2) + " AU/yr"; }
function fmtDeg(v) { return v.toFixed(0) + "°"; }

function selectedPlanet() {
  if (selectedId === null) { return null; }
  for (var i = 0; i < planets.length; i++) { if (planets[i].id === selectedId && !planets[i].crashed) { return planets[i]; } }
  return null;
}

// Derives (r, thetaDeg, v, launchAngleDeg) from a planet's live state --
// used to seed the Properties sliders with its ACTUAL current orbit
// controls, not stale ones.
function orbitalControlsFromPlanet(p) {
  var r = Math.sqrt(p.x * p.x + p.y * p.y);
  var thetaRad = Math.atan2(p.y, p.x);
  var radial = { x: Math.cos(thetaRad), y: Math.sin(thetaRad) };
  var tangential = { x: -Math.sin(thetaRad), y: Math.cos(thetaRad) };
  var v = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  var laRad = Math.atan2(p.vx * radial.x + p.vy * radial.y, p.vx * tangential.x + p.vy * tangential.y);
  return { r: r, thetaDeg: thetaRad * 180 / Math.PI, v: v, launchAngleDeg: laRad * 180 / Math.PI };
}

function applyOrbitalControlsToPlanet(p, r, thetaDeg, v, launchAngleDeg) {
  var state = stateFromOrbitalControls(Math.max(0.01, r), thetaDeg, Math.max(0, v), launchAngleDeg);
  p.x = state.x; p.y = state.y; p.vx = state.vx; p.vy = state.vy;
  p.trail = [];
  delete lastPeriapsisDirById[p.id];
  refreshElementsReadout();
}

}

/* ============================================================
   HUD (live distance/speed) + status banner (orbit health). Orbital
   elements (a/e/T/periapsis/apoapsis) are conserved quantities for an
   unperturbed Kepler orbit, so the Properties panel's readout only needs
   to refresh on edits; r and v genuinely change moment to moment as the
   planet moves along its orbit, so the HUD updates every frame.
   ============================================================ */
var statusTypeEl = document.getElementById("statusType");
var statusReasonEl = document.getElementById("statusReason");
var statusBannerEl = document.getElementById("statusBanner");
var hudDistanceEl = document.getElementById("hudDistance");
var hudSpeedEl = document.getElementById("hudSpeed");

function updateHud() {
  var p = selectedPlanet();
  var crashedSelected = selectedId !== null && !p && planets.some(function (q) { return q.id === selectedId && q.crashed; });
  if (!p) {
    hudDistanceEl.textContent = "—"; hudSpeedEl.textContent = "—";
    statusBannerEl.classList.remove("escape", "crashed");
    if (crashedSelected) {
      statusBannerEl.classList.add("crashed");
      statusTypeEl.textContent = "Crashed Into Star";
      statusReasonEl.textContent = "This planet's orbit decayed past the star's surface.";
    } else {
      statusTypeEl.textContent = "No Planet Selected";
      statusReasonEl.textContent = "Tap a planet, or place a new one, to see its live numbers.";
    }
    return;
  }
  var r = Math.sqrt(p.x * p.x + p.y * p.y);
  var v = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  hudDistanceEl.textContent = r.toFixed(2);
  hudSpeedEl.textContent = v.toFixed(2);

  var el = orbitalElementsFromState(p.x, p.y, p.vx, p.vy, muOf(starMassSolar), lastPeriapsisDirById[p.id]);
  statusBannerEl.classList.toggle("escape", el.isEscape);
  statusBannerEl.classList.remove("crashed");
  if (el.isEscape) {
    statusTypeEl.textContent = "Escape Trajectory";
    statusReasonEl.textContent = "e = " + el.e.toFixed(3) + " -- this planet will never return.";
  } else {
    statusTypeEl.textContent = "Stable Orbit";
    statusReasonEl.textContent = "e = " + el.e.toFixed(3) + " · a = " + fmtAU(el.a) + " · T = " + fmtYr(el.period);
  }
}

// Drawn in fixed screen-px length per unit speed (independent of zoom) so
// the arrow stays legible at any zoom level, rather than world-scaling it.
// worldToScreen here has no y-flip (ported from Space Sandbox), so a
// world +y velocity component maps directly to +y on screen.
function drawVelocityVector(p, color) {
  var s = worldToScreen(camera, canvasW, canvasH, p.x, p.y);
  var dx = p.vx, dy = p.vy;
  var mag = Math.hypot(dx, dy) || 1;
  var pxLen = 24 + Math.min(70, mag * 9);
  var ex = s.x + (dx / mag) * pxLen, ey = s.y + (dy / mag) * pxLen;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(ex, ey); ctx.stroke();
  var ang = Math.atan2(ey - s.y, ex - s.x);
  ctx.translate(ex, ey); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, 4); ctx.lineTo(-4, -4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- Law 1: ellipse geometry overlay (major/minor axes) ---------- */
var showAxesLaw1 = true;
function drawAxesOverlay(elements, color) {
  if (elements.isEscape || !elements.center) { return; }
  var peri = { x: elements.periapsisDir.x * elements.periapsisDistance, y: elements.periapsisDir.y * elements.periapsisDistance };
  var apo = { x: -elements.periapsisDir.x * elements.apoapsisDistance, y: -elements.periapsisDir.y * elements.apoapsisDistance };
  var periS = worldToScreen(camera, canvasW, canvasH, peri.x, peri.y);
  var apoS = worldToScreen(camera, canvasW, canvasH, apo.x, apo.y);
  var centerS = worldToScreen(camera, canvasW, canvasH, elements.center.x, elements.center.y);
  var minorDir = { x: -elements.periapsisDir.y, y: elements.periapsisDir.x };
  var minorA = worldToScreen(camera, canvasW, canvasH, elements.center.x + minorDir.x * elements.semiMinorAxis, elements.center.y + minorDir.y * elements.semiMinorAxis);
  var minorB = worldToScreen(camera, canvasW, canvasH, elements.center.x - minorDir.x * elements.semiMinorAxis, elements.center.y - minorDir.y * elements.semiMinorAxis);

  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(periS.x, periS.y); ctx.lineTo(apoS.x, apoS.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(minorA.x, minorA.y); ctx.lineTo(minorB.x, minorB.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(centerS.x, centerS.y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

/* ---------- Law 3: compare planets (period^2 vs semi-major-axis^3) ---------- */
var labTrials = []; // {id, label, aAU, TYears, eccentricity, starMassAtRecording}
var nextTrialId = 1;

function recordLawThreeTrial() {
  var p = selectedPlanet();
  if (!p) { return; }
  var el = orbitalElementsFromState(p.x, p.y, p.vx, p.vy, muOf(starMassSolar), lastPeriapsisDirById[p.id]);
  if (el.isEscape) { return; }
  labTrials.push({ id: nextTrialId++, label: p.label, aAU: el.a, TYears: el.period, eccentricity: el.e, starMassAtRecording: starMassSolar });
  refreshLawPanel();
}

function fitSlopeThroughOrigin(points) {
  var sumXY = 0, sumXX = 0;
  for (var i = 0; i < points.length; i++) { sumXY += points[i].x * points[i].y; sumXX += points[i].x * points[i].x; }
  if (sumXX === 0) { return null; }
  return sumXY / sumXX;
}

function graphAxes(gctx, w, h, pad, yMin, yMax, yLabelFn) {
  gctx.clearRect(0, 0, w, h);
  gctx.strokeStyle = ink(0.12);
  gctx.lineWidth = 1;
  gctx.font = "10px 'JetBrains Mono', monospace";
  gctx.fillStyle = ink(0.35);
  gctx.textAlign = "right";
  var gridLines = 4;
  for (var i = 0; i <= gridLines; i++) {
    var y = pad + (h - 2 * pad) * (i / gridLines);
    gctx.beginPath(); gctx.moveTo(pad, y); gctx.lineTo(w - pad, y); gctx.stroke();
    var val = yMax - (yMax - yMin) * (i / gridLines);
    gctx.fillText(yLabelFn(val), pad - 6, y + 3);
  }
}

function downloadKeplerCSV() {
  var header = ["Label", "SemiMajorAxisAU", "PeriodYears", "Eccentricity", "StarMassAtRecordingMsun", "CurrentStarMassMsun"];
  var lines = [header.join(",")];
  labTrials.forEach(function (t) {
    lines.push([t.label, t.aAU.toFixed(4), t.TYears.toFixed(4), t.eccentricity.toFixed(4), t.starMassAtRecording.toFixed(3), starMassSolar.toFixed(3)].join(","));
  });
  var blob = new Blob([lines.join("\n")], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "kepler-law3-data.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Trials recorded at a star mass that no longer matches the live star
// mass would make the theoretical-slope comparison misleading, so they're
// shown but excluded from the fit.
function drawPeriodAxisGraph(gctx, w, h) {
  var pad = 36;
  var matching = labTrials.filter(function (t) { return Math.abs(t.starMassAtRecording - starMassSolar) < 1e-6; });
  var pts = matching.map(function (t) { return { x: t.aAU * t.aAU * t.aAU, y: t.TYears * t.TYears }; });
  var maxX = 1, maxY = 1;
  pts.forEach(function (p) { maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
  maxX *= 1.15; maxY *= 1.15;

  graphAxes(gctx, w, h, pad, 0, maxY, function (v) { return v.toFixed(1); });
  function X(x) { return pad + (w - 2 * pad) * (x / maxX); }
  function Y(y) { return pad + (h - 2 * pad) * (1 - y / maxY); }

  pts.forEach(function (p) {
    gctx.beginPath(); gctx.arc(X(p.x), Y(p.y), 4, 0, Math.PI * 2);
    gctx.fillStyle = "#5FD3C4"; gctx.fill();
  });
  var slope = fitSlopeThroughOrigin(pts);
  if (slope !== null) {
    gctx.beginPath(); gctx.moveTo(X(0), Y(0)); gctx.lineTo(X(maxX), Y(slope * maxX));
    gctx.strokeStyle = "#5FD3C4"; gctx.lineWidth = 1.5; gctx.setLineDash([5, 4]); gctx.stroke(); gctx.setLineDash([]);
  }
  var theoretical = 1 / starMassSolar;
  gctx.textAlign = "left"; gctx.font = "10px 'JetBrains Mono', monospace";
  gctx.fillStyle = "#5FD3C4";
  gctx.fillText("• measured slope ≈ " + (slope !== null ? slope.toFixed(3) : "—") + " (T² vs a³)", pad, h - 22);
  gctx.fillStyle = ink(0.55);
  gctx.fillText("theoretical 1/M_star = " + theoretical.toFixed(3) + " at " + fmtSolar(starMassSolar), pad, h - 8);
}

function refreshLawPanel() {

    panel.appendChild(hint1);

    var graphTitle = document.createElement("div");

    graphCanvas.className = "lab-graph";

    exportBtn.disabled = labTrials.length === 0;
    if (exportBtn.disabled) { exportBtn.style.opacity = "0.4"; }
    exportBtn.addEventListener("click", function (e) { e.stopPropagation(); if (labTrials.length > 0) { downloadKeplerCSV(); } });
    panel.appendChild(exportBtn);
  }
}

function makeToggleRow(labelText, isOn, onToggle) {
  var row = document.createElement("div");
  row.className = "toggle-row";
  var label = document.createElement("span");
  label.textContent = labelText;
  var sw = document.createElement("div");
  sw.className = "toggle-switch" + (isOn ? " on" : "");
  var knob = document.createElement("div");
  knob.className = "knob";
  sw.appendChild(knob);
  sw.addEventListener("click", function (e) {
    e.stopPropagation();
    var next = !sw.classList.contains("on");
    sw.classList.toggle("on", next);
    onToggle(next);
  });
  row.appendChild(label); row.appendChild(sw);
  return row;
}

/* ============================================================
   Law 2: the equal-areas "sweep stopwatch". dA/dt = h/2 is exactly
   constant for a real Keplerian orbit (that constancy IS the Second
   Law), so swept area has an exact closed form -- rather than
   re-sampling the analytic ellipse, the recorder accrues
   0.5*|h|*simDt every simulated frame using the planet's actual h, and
   records its actual position each frame, so the shaded wedge is the
   literal path the planet flew, not a derived approximation.
   State machine: idle -> timing (Start) -> comparing (Stop,
   auto-starts a second sweep from wherever the planet now is) -> idle
   (once the comparison's elapsed time matches the student sweep's
   duration). Both finalized wedges stay drawn -- regardless of which
   Law tab is active, since the sweep is driven by the physics loop, not
   the UI tab -- until Reset or a new Start.
   ============================================================ */
var MIN_SWEEP_ELAPSED = 0.02; // years -- guards against a degenerate instant double-tap
var sweepRecorder = null; // {phase:"timing"|"comparing", planetId, points, areaAccum, elapsed, targetDt?}
var lastStudentSweep = null;
var lastComparisonSweep = null;

function startSweep() {
  var p = selectedPlanet();
  if (!p) { return; }
  sweepRecorder = { phase: "timing", planetId: p.id, points: [{ x: p.x, y: p.y }], areaAccum: 0, elapsed: 0 };
  lastStudentSweep = null;
  lastComparisonSweep = null;
}
function stopSweep() {
  if (!sweepRecorder || sweepRecorder.phase !== "timing" || sweepRecorder.elapsed < MIN_SWEEP_ELAPSED) { return; }
  lastStudentSweep = sweepRecorder;
  var p = planets.find(function (q) { return q.id === lastStudentSweep.planetId; });
  sweepRecorder = p ? { phase: "comparing", planetId: p.id, points: [{ x: p.x, y: p.y }], areaAccum: 0, elapsed: 0, targetDt: lastStudentSweep.elapsed } : null;
}
function resetSweep() {
  sweepRecorder = null; lastStudentSweep = null; lastComparisonSweep = null;
}
function updateSweepRecorder(simDt) {
  if (!sweepRecorder || simDt <= 0) { return; }
  var p = planets.find(function (q) { return q.id === sweepRecorder.planetId && !q.crashed; });
  if (!p) { sweepRecorder = null; return; } // auto-cancel if the bound planet was removed or crashed
  var h = p.x * p.vy - p.y * p.vx;
  sweepRecorder.points.push({ x: p.x, y: p.y });
  sweepRecorder.areaAccum += 0.5 * Math.abs(h) * simDt;
  sweepRecorder.elapsed += simDt;
  if (sweepRecorder.phase === "comparing" && sweepRecorder.elapsed >= sweepRecorder.targetDt) {
    lastComparisonSweep = sweepRecorder;
    sweepRecorder = null;
  }
}

function drawSweepWedge(points, fillColor, strokeColor) {
  if (!points || points.length < 2) { return; }
  var star = worldToScreen(camera, canvasW, canvasH, 0, 0);
  ctx.beginPath();
  ctx.moveTo(star.x, star.y);
  for (var i = 0; i < points.length; i++) {
    var s = worldToScreen(camera, canvasW, canvasH, points[i].x, points[i].y);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 1;
  ctx.stroke();
}
function drawLawTwoOverlay() {
  if (sweepRecorder) {
    var liveColor = sweepRecorder.phase === "timing" ? "rgba(143,217,255,0.28)" : "rgba(255,210,122,0.28)";
    var liveStroke = sweepRecorder.phase === "timing" ? "rgba(143,217,255,0.8)" : "rgba(255,210,122,0.8)";
    drawSweepWedge(sweepRecorder.points, liveColor, liveStroke);
  }
  if (lastStudentSweep) { drawSweepWedge(lastStudentSweep.points, "rgba(143,217,255,0.22)", "rgba(143,217,255,0.7)"); }
  if (lastComparisonSweep) { drawSweepWedge(lastComparisonSweep.points, "rgba(255,210,122,0.22)", "rgba(255,210,122,0.7)"); }
}
function drawRadiusVector(p, color) {
  var star = worldToScreen(camera, canvasW, canvasH, 0, 0);
  var s = worldToScreen(camera, canvasW, canvasH, p.x, p.y);
  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(s.x, s.y); ctx.stroke();
  ctx.restore();
}

var sweepReadoutEl = null;
function refreshSweepReadout() {
  if (!sweepReadoutEl) { return; }
  if (sweepRecorder && sweepRecorder.phase === "timing") {
    sweepReadoutEl.innerHTML = "<strong>Timing…</strong> " + sweepRecorder.elapsed.toFixed(2) + " yr swept so far";
  } else if (sweepRecorder && sweepRecorder.phase === "comparing") {
    sweepReadoutEl.innerHTML = "<strong>Comparing…</strong> " + sweepRecorder.elapsed.toFixed(2) + " / " + sweepRecorder.targetDt.toFixed(2) + " yr";
  } else if (lastComparisonSweep && lastStudentSweep) {
    var diffPct = 100 * Math.abs(lastComparisonSweep.areaAccum - lastStudentSweep.areaAccum) / Math.max(1e-9, lastStudentSweep.areaAccum);
    sweepReadoutEl.innerHTML =
      "<span style='color:#8FD9FF'>■</span> Your sweep: " + lastStudentSweep.elapsed.toFixed(2) + " yr, area " + lastStudentSweep.areaAccum.toFixed(4) + " AU²<br>" +
      "<span style='color:#FFD27A'>■</span> Later sweep: " + lastComparisonSweep.elapsed.toFixed(2) + " yr, area " + lastComparisonSweep.areaAccum.toFixed(4) + " AU²<br>" +
      "Areas differ by " + diffPct.toFixed(2) + "% -- equal time, equal area.";
  } else {
    sweepReadoutEl.innerHTML = "Select a planet, then press Start to time a sweep.";
  }
}

function refreshLawTwoPanel(panel) {
  var hint = document.createElement("div");
  hint.className = "panel-hint";
  hint.style.marginTop = "0";
  hint.innerHTML = "The radius vector (star to planet) sweeps out <strong>equal areas in equal times</strong>. Start the stopwatch, let it run a while, Stop -- the sim then automatically times an equal-duration sweep later in the orbit so you can compare the two shaded regions.";
  panel.appendChild(hint);

  var readout = document.createElement("div");
  readout.className = "panel-row mono";
  readout.style.fontSize = "11.5px"; readout.style.color = PAPER ? "#5b5144" : "#cfd8df"; readout.style.marginTop = "12px";
  panel.appendChild(readout);
  sweepReadoutEl = readout;
  refreshSweepReadout();

  var btnRow = document.createElement("div");
  btnRow.className = "seg-row";
  var p2 = selectedPlanet();
  var startBtn = document.createElement("div");
  startBtn.className = "seg-btn" + (!sweepRecorder && p2 ? "" : " active");
  startBtn.textContent = "Start";
  var startDisabled = !p2 || !!sweepRecorder;
  if (startDisabled) { startBtn.style.opacity = "0.4"; }
  startBtn.addEventListener("click", function (e) { e.stopPropagation(); if (!startDisabled) { startSweep(); refreshLawPanel(); } });
  var stopBtn = document.createElement("div");
  stopBtn.className = "seg-btn";
  stopBtn.textContent = "Stop";
  var stopDisabled = !sweepRecorder || sweepRecorder.phase !== "timing";
  if (stopDisabled) { stopBtn.style.opacity = "0.4"; }
  stopBtn.addEventListener("click", function (e) { e.stopPropagation(); if (!stopDisabled) { stopSweep(); refreshLawPanel(); } });
  var resetBtn = document.createElement("div");
  resetBtn.className = "seg-btn";
  resetBtn.textContent = "Reset";
  var resetDisabled = !sweepRecorder && !lastStudentSweep;
  if (resetDisabled) { resetBtn.style.opacity = "0.4"; }
  resetBtn.addEventListener("click", function (e) { e.stopPropagation(); if (!resetDisabled) { resetSweep(); refreshLawPanel(); } });
  btnRow.appendChild(startBtn); btnRow.appendChild(stopBtn); btnRow.appendChild(resetBtn);
  panel.appendChild(btnRow);

  if (!p2) {
    var noSel = document.createElement("div");
    noSel.className = "panel-hint";
    noSel.textContent = "Tap a planet on the canvas to pick which one the stopwatch follows.";
    panel.appendChild(noSel);
  }
}

/* ============================================================
   Extras panel: display toggles + simulation speed.
   ============================================================ */
var SPEED_RANGE = { min: 0.02, max: 5 };
function refreshExtrasPanel() {
  var panel = document.getElementById("extrasPanel");
  panel.innerHTML = "";
  var h3 = document.createElement("h3");
  h3.textContent = "Extras";
  panel.appendChild(h3);

  panel.appendChild(makeExpSliderRow(function (v) { return "Simulation Speed: " + v.toFixed(2) + " yr/sec"; }, simTimeScale, SPEED_RANGE.min, SPEED_RANGE.max, function (v) { simTimeScale = v; }).row);

  var title = document.createElement("div");
  title.className = "panel-section-title";
  title.textContent = "Display";
  panel.appendChild(title);
  panel.appendChild(makeToggleRow("Orbit Paths", extras.orbitPaths, function (v) { extras.orbitPaths = v; }));
  panel.appendChild(makeToggleRow("Trails", extras.trails, function (v) { extras.trails = v; }));
  panel.appendChild(makeToggleRow("Foci & Apsides", extras.fociApsides, function (v) { extras.fociApsides = v; }));
  panel.appendChild(makeToggleRow("Velocity Vector", extras.velocityVectors, function (v) { extras.velocityVectors = v; }));

  var hint = document.createElement("div");
  hint.className = "panel-hint";
  hint.textContent = "These only change what's drawn -- the underlying physics (and any Law 3 recordings or Law 2 sweep) keep running exactly the same either way.";
  panel.appendChild(hint);
}
document.getElementById("extrasBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  var panel = document.getElementById("extrasPanel");
  var open = panel.classList.contains("hidden");
  panel.classList.toggle("hidden", !open);
  if (open) { refreshExtrasPanel(); }
});
document.addEventListener("click", function (e) {
  var panel = document.getElementById("extrasPanel");
  if (!panel.classList.contains("hidden") && !e.target.closest("#extrasPanel, #extrasBtn")) { panel.classList.add("hidden"); }
});

/* ============================================================
   Tutorial modal
   ============================================================ */
document.getElementById("tutorialBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  var modal = document.getElementById("tutorialModal");
  modal.innerHTML =
    '<div class="modal-card">' +
    "<h2>Kepler's Laws Sandbox</h2>" +
    "<p>Press and drag anywhere to place a planet and fling it -- its initial position and velocity are all that determine its orbit from then on, exactly like real spacecraft trajectories. Tap an existing planet to select it; open <strong>Properties</strong> to dial in its distance, speed, and launch angle precisely, or adjust the star's mass.</p>" +
    "<p><strong>Units:</strong> distances in AU, time in years, star mass in solar masses (M&#9737;). With a 1-solar-mass star, Kepler's Third Law comes out exactly T&sup2; = a&sup3; -- no unit conversion needed.</p>" +
    "<p><strong>A simplification, stated plainly:</strong> the star is fixed in place, and planets don't pull on each other, only on the star's gravity -- each one's orbit is independent. This is the standard way to teach Kepler's Laws (and how real mission-planning software treats a spacecraft around a star or planet): a planet's own mass is too small to matter next to the star's, so its path only depends on where and how fast it started, never on its own mass.</p>" +
    "<p><strong>Law 1 -- Orbits:</strong> every planet traces a closed ellipse with the star at one focus, not the center. Drag a planet's speed or launch angle in Properties and watch the ellipse (and its second, empty focus) reshape.</p>" +
    "<p><strong>Law 2 -- Areas:</strong> the line from the star to a planet sweeps equal areas in equal times. Select a planet, Start the stopwatch, let it run, Stop -- a second, equal-duration sweep is timed automatically later in the orbit so you can compare the two shaded regions directly.</p>" +
    "<p><strong>Law 3 -- Periods:</strong> record a few planets of different sizes and watch period&sup2; plotted against semi-major-axis&sup3; -- a straight line through the origin, whose slope is 1/M_star.</p>" +
    "<p>Switching between the three Law tabs never resets your system -- start a sweep, flip tabs to look at something else, flip back, it's still running.</p>" +
    '<button class="close-link">Got it</button></div>';
  modal.classList.remove("hidden");
  modal.querySelector(".close-link").addEventListener("click", function () { modal.classList.add("hidden"); });
  modal.addEventListener("click", function (ev) { if (ev.target === modal) { modal.classList.add("hidden"); } });
});

/* ============================================================
   Main loop
   ============================================================ */
function frame(now) {
  if (lastFrameTime === null) { lastFrameTime = now; }
  var dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  var mu = muOf(starMassSolar);
  if (!paused) {
    var simDt = dt * simTimeScale;
    stepPlanets(planets, mu, simDt, STAR_COLLISION_RADIUS_AU);
    planets.forEach(function (p) {
      if (p.crashed) { return; }
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > TRAIL_MAX_POINTS) { p.trail.shift(); }
    });
    updateSweepRecorder(simDt);
    if (lawPanelOpen && activeLaw === "law2") { refreshSweepReadout(); }
  }

  ctx.clearRect(0, 0, canvasW, canvasH);
  drawStarfield();

  planets.forEach(function (p, idx) {
    if (p.crashed) { return; }
    var color = colorForIndex(idx);
    var el = orbitalElementsFromState(p.x, p.y, p.vx, p.vy, mu, lastPeriapsisDirById[p.id]);
    lastPeriapsisDirById[p.id] = el.periapsisDir;
    if (extras.orbitPaths) { drawOrbitCurve(el, color); }
    if (extras.fociApsides) { drawFociAndApsides(el, color); }
    if (extras.trails) { drawTrail(p, color); }
  });

  drawLawTwoOverlay();
  drawStar();
  planets.forEach(function (p, idx) { if (!p.crashed) { drawPlanet(p, colorForIndex(idx)); } });
  var selP = selectedPlanet();
  if (selP) {
    var selColor = colorForIndex(planets.indexOf(selP));
    if (extras.velocityVectors) { drawVelocityVector(selP, selColor); }
    if (activeLaw === "law1" && showAxesLaw1) {
      var selEl = orbitalElementsFromState(selP.x, selP.y, selP.vx, selP.vy, mu, lastPeriapsisDirById[selP.id]);
      drawAxesOverlay(selEl, selColor);
    }
    if (activeLaw === "law2") { drawRadiusVector(selP, selColor); }
  }
  drawAimLine();
  updateHud();

  requestAnimationFrame(frame);
}

resizeCanvas();
requestAnimationFrame(frame);
</script>
