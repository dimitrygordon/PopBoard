<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="shared/layout/layout.css">
<script type="module" src="shared/layout/layout.js"></script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#20232e">
<title>Projectile Motion // PopBoard</title>
<link rel="icon" type="image/png" href="popboard-logo.png">
<script>
  // Theme before first paint: a saved choice wins, else the system setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem("popboard.projectile.theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="projectile/projectile-theme.css">
<link rel="stylesheet" href="astro-study.css?v=20261021k">
<link rel="stylesheet" href="shared/fun/fun.css?v=20261029a">
<script src="astro-study.js?v=20261021k"></script>
</head>
<body>
<h1 class="sr-only">Projectile Motion</h1>
<p class="sr-only">Set the launch angle, speed and height, fire a projectile and read its range, peak height and time of flight. Split the velocity into horizontal and vertical parts, compare air drag with the ideal path, hit a target, and launch on other worlds.</p>

<header class="hud">
  <button id="studyBackBtn" class="study-back-btn" type="button" data-study-back aria-label="Back to Study library">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="back-label">Back</span>
  </button>
  <p class="title">Projectile Motion</p>
  <button id="themeBtn" class="theme-btn" type="button" aria-pressed="false" aria-label="Dark mode">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span id="themeLabel">Dark</span>
  </button>
</header>

<main id="stage" class="stage">
  <div class="paper canvas-box">
    <canvas id="pjCanvas" role="img" aria-label="Launch scene: cannon, trajectory and targets. Art is not to scale."></canvas>
  </div>
  <div class="controls paper" id="controls">
    <button type="button" class="fun-handle" id="sheetHandle" aria-label="Controls sheet: tap or swipe to resize"></button>
    <section class="panel" id="panel">
      <div class="row" data-group="world" role="group" aria-label="World"></div>
      <div class="row" data-group="ball" role="group" aria-label="Projectile"></div>
      <div class="row" data-group="targetKind" role="group" aria-label="Target"></div>
      <div data-sliders class="panel"></div>
      <div class="row" data-group="site" role="group" aria-label="Launch from"></div>
      <div class="row" data-group="actions"></div>
      <div class="row toggles" data-group="toggles" role="group" aria-label="Show"></div>
      <p class="result" id="result" aria-live="polite"></p>
      <dl class="readout" id="readout"></dl>
      <p class="formula" id="formula"></p>
      <button type="button" class="fun-help" id="noteHelp" aria-expanded="false" aria-controls="note" aria-label="About the sandbox" hidden>?</button>
      <p class="caption" id="note"></p>
    </section>
  </div>
</main>

<div class="fun-sheet-fade" aria-hidden="true"></div>
<nav id="toolbar" class="toolbar" aria-label="Activities">
  <button type="button" class="tool" data-show="launch" aria-pressed="false">Launch</button>
  <button type="button" class="tool" data-show="components" aria-pressed="false">Components</button>
  <button type="button" class="tool" data-show="drag" aria-pressed="false">Air drag</button>
  <button type="button" class="tool" data-show="target" aria-pressed="false">Target</button>
  <button type="button" class="tool" data-show="planets" aria-pressed="false">Planets</button>
  <button type="button" class="tool" data-show="sandbox" aria-pressed="false">Sandbox</button>
</nav>

<script type="module" src="projectile/projectile-fun.js?v=20261029a"></script>
<script type="module" src="projectile/projectile-ui.js"></script>
</body>
</html>
