<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patoka Valley</title>
  <meta name="theme-color" content="#070B14">
  <link rel="stylesheet" href="world.css">
</head>
<body>
  <canvas id="world" aria-label="A drawn flyover of the Patoka River valley under a live sky"></canvas>
  <canvas id="wx" aria-hidden="true"></canvas>
  <div id="fallback" hidden>
    <img id="fallbackImg" src="fallback.jpg" alt="The Patoka River valley, engraved atlas view">
    <canvas id="still" width="1280" height="800" aria-hidden="true"></canvas>
    <p>This view needs WebGL. A still engraving of the valley is shown instead.</p>
  </div>
  <div id="caption">
    <span id="place">Patoka Valley</span>
    <span id="when"></span>
  </div>
  <div id="hud" hidden></div>
  <script type="module" src="world.js"></script>
</body>
</html>
