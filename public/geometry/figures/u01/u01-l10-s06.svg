    <path d="M22,342H378A8,8 0 0 1 386,350V384A8,8 0 0 1 378,392H22A8,8 0 0 1 14,384V350A8,8 0 0 1 22,342Z" stroke-width="2" class="draw" pathLength="1" style="--d:0.58s;--t:0.90s"/>
