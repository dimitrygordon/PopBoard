    <text fill="currentColor" stroke="none" x="32" y="266.36" font-size="26" class="fade" style="--d:1.35s"><tspan font-style="italic">u</tspan> + <tspan font-style="italic">v</tspan> = 2<tspan font-style="italic">a</tspan> + 2<tspan font-style="italic">b</tspan> + 2</text>
  </g>
