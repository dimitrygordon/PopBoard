[data-step].on .draw,[data-step].on .fade{animation-delay:var(--d,0s)}
@keyframes u01-draw{to{stroke-dashoffset:0}}
@keyframes u01-fade{to{opacity:1}}
}</style>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
  <g data-step="1" style="--sd:0.00s">
