<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 626" color="#111" role="img" aria-labelledby="u01-l10-s06-title" data-steps="5">
  <title id="u01-l10-s06-title">Direct proof that the sum of two odd numbers is even</title>
