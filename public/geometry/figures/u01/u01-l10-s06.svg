    <text fill="currentColor" stroke="none" x="60" y="541.36" font-size="26" class="fade" style="--d:0.46s">definition of even</text>
    <path d="M22,562H378A8,8 0 0 1 386,570V604A8,8 0 0 1 378,612H22A8,8 0 0 1 14,604V570A8,8 0 0 1 22,562Z" stroke-width="3" class="draw" pathLength="1" style="--d:0.58s;--t:0.90s"/>
    <text fill="currentColor" stroke="none" x="32" y="596.36" font-size="26" class="fade" style="--d:1.35s"><tspan font-style="italic">u</tspan> + <tspan font-style="italic">v</tspan> is even</text>
