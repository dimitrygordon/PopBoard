    <text fill="currentColor" stroke="none" x="32" y="156.36" font-size="26" class="fade" style="--d:1.35s"><tspan font-style="italic">u</tspan> = 2<tspan font-style="italic">a</tspan> + 1, <tspan font-style="italic">v</tspan> = 2<tspan font-style="italic">b</tspan> + 1</text>
  </g>
  <g data-step="2" style="--sd:2.65s">
    <path d="M40,176L40,228" stroke-width="2" class="draw" pathLength="1" style="--d:0.00s;--t:0.40s"/>
