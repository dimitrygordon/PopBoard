    <text fill="currentColor" stroke="none" x="18" y="97.36" font-size="26" class="fade" style="--d:0.00s"><tspan font-style="italic">m</tspan> = 4<tspan font-style="italic">r</tspan>, <tspan font-style="italic">n</tspan> = 4<tspan font-style="italic">s</tspan></text>
