    <text fill="currentColor" stroke="none" x="200" y="415.36" font-size="26" text-anchor="middle" class="fade" style="--d:0.00s">Every two points lie on</text>
    <text fill="currentColor" stroke="none" x="200" y="451.36" font-size="26" text-anchor="middle" class="fade" style="--d:0.12s">exactly one line: it holds.</text>
