{cat:"II",sub:"Thermodynamics",type:"single",q:"During an adiabatic process, a gas does work on its surroundings without any heat exchange (Q = 0). What happens to its internal energy?",ch:["It stays constant","It decreases, since ΔU = Q − W = 0 − W, a negative quantity when W is positive","It increases","It is undefined"],ans:[1],exp:"With Q = 0 in an adiabatic process, ΔU = −W. If the gas does positive work on its surroundings, its internal energy must decrease correspondingly."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"Which of the following best explains why atomic emission spectra consist of discrete lines rather than a continuous range of colors?",ch:["Electrons can only occupy specific, quantized energy levels, and photons are emitted only when electrons transition between these fixed levels","Atoms only emit light of one single frequency","Electrons move continuously and emit light at all frequencies","Emission spectra are caused entirely by classical wave interference"],ans:[0],exp:"Because electron energy levels in an atom are quantized (discrete), transitions between them release photons of only specific, discrete energies (and thus specific frequencies/colors), producing distinct spectral lines rather than a continuum."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Two blocks of the same material but different masses are heated with the same amount of energy. Which block will experience the smaller temperature increase?",ch:["The less massive block","The more massive block, since the same energy is spread across more mass","They will have identical temperature increases","Temperature change does not depend on mass"],ans:[1],exp:"Since Q = mcΔT, for the same heat input Q and same specific heat c, a larger mass m results in a smaller temperature change ΔT."},

{cat:"III",sub:"Newton's Laws",type:"single",q:"A swimmer pushes backward against the water with their hands and feet. According to Newton's third law, the water pushes:",ch:["The swimmer forward with an equal-magnitude force","The swimmer backward with a smaller force","Nothing, since water cannot exert force","The swimmer sideways only"],ans:[0],exp:"By Newton's third law, the water exerts a reaction force on the swimmer equal in magnitude and opposite in direction to the force the swimmer applies to the water, propelling the swimmer forward."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"A rifle recoils backward when a bullet is fired forward. This is best explained by:",ch:["Newton's first law","Newton's second law only","Newton's third law -- the rifle exerts a forward force on the bullet, and the bullet exerts an equal, opposite force on the rifle","Conservation of energy alone"],ans:[2],exp:"The recoil of the rifle is a direct demonstration of Newton's third law: the forward force on the bullet has an equal and opposite reaction force pushing the rifle backward."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"A book rests on a table. The upward normal force from the table on the book is the Newton's-third-law reaction pair to:",ch:["The downward force of gravity on the book","The downward force the book exerts on the table","The weight of the table","The friction force on the book"],ans:[1],exp:"Newton's third law pairs are equal, opposite forces acting on two different objects from the same interaction: the table pushes up on the book, and the book pushes down on the table with equal magnitude."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"A passenger in a car that suddenly brakes feels thrown forward, even though no forward force acts on them. This sensation is best explained by:",ch:["A real forward force generated by the seatbelt","Inertia -- the passenger's body tends to continue moving forward at its original velocity while the car decelerates","Newton's third law reaction to the brakes","An illusion with no physical basis"],ans:[1],exp:"By Newton's first law (inertia), the passenger's body tends to keep moving at its original velocity when the car suddenly decelerates, creating the sensation of being thrown forward relative to the car."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"In a rotating space station designed to simulate gravity, an astronaut standing on the inner hull feels pressed 'outward' against the floor. This apparent force is:",ch:["A real gravitational force from the station's mass","A fictitious (centrifugal) effect arising because the station is a rotating, non-inertial reference frame","Caused by air pressure only","Evidence that Newton's laws fail in space"],ans:[1],exp:"In the rotating, non-inertial frame of the station, objects appear to experience an outward 'centrifugal' force, though in the inertial frame this is simply the inertia of the astronaut resisting the station's centripetal (inward) force."},
{cat:"III",sub:"Gravitation",type:"single",q:"Two point masses exert gravitational force F on each other at separation r. If the separation between them is doubled, the new gravitational force is:",ch:["4F","2F","F/4","F/2"],ans:[2],exp:"Gravitational force follows an inverse-square law: F ∝ 1/r². If r is doubled, the new force is F/4."},
{cat:"III",sub:"Gravitation",type:"single",q:"Two point masses exert gravitational force F on each other at separation r. If the separation between them is tripled, the new gravitational force is:",ch:["F/3","9F","F/9","3F"],ans:[2],exp:"Gravitational force follows an inverse-square law: F ∝ 1/r². If r is tripled, the new force is F/9."},
{cat:"III",sub:"Gravitation",type:"single",q:"Two point masses exert gravitational force F on each other at separation r. If the separation between them is quadrupled, the new gravitational force is:",ch:["F/4","F/16","16F","4F"],ans:[1],exp:"Gravitational force follows an inverse-square law: F ∝ 1/r². If r is quadrupled, the new force is F/16."},
{cat:"III",sub:"Gravitation",type:"single",q:"Two point masses exert gravitational force F on each other at separation r. If the separation between them is halved, the new gravitational force is:",ch:["2F","F/2","F/4","4F"],ans:[3],exp:"Gravitational force follows an inverse-square law: F ∝ 1/r². If r is halved, the new force is 4F."},
{cat:"III",sub:"Gravitation",type:"single",q:"A satellite is moved into a higher orbit around Earth (larger orbital radius). Its orbital speed will:",ch:["Increase","Decrease","Stay exactly the same","Depend only on the satellite's mass"],ans:[1],exp:"Orbital speed v = √(GM/R) decreases as orbital radius R increases, since a larger orbit requires less speed to maintain centripetal balance with the weaker gravitational pull."},
{cat:"III",sub:"Gravitation",type:"single",q:"Comparing two satellites orbiting Earth, the one in the smaller-radius orbit will have:",ch:["A smaller orbital speed","A larger orbital speed","The same orbital speed regardless of radius","An orbital speed of zero"],ans:[1],exp:"Since v = √(GM/R), a smaller orbital radius corresponds to a larger required orbital speed to balance the stronger gravitational attraction at that distance."},
{cat:"III",sub:"Gravitation",type:"single",q:"Which statement correctly describes the relationship between a satellite's orbital period and its orbital radius, according to Kepler's third law?",ch:["Period is independent of radius","Larger orbital radius corresponds to a longer orbital period","Larger orbital radius always corresponds to a shorter orbital period","Period depends only on the satellite's mass"],ans:[1],exp:"Kepler's third law, T² ∝ R³, means larger orbital radii correspond to longer orbital periods."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 9 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["27 years","9 years","54 years","18 years"],ans:[0],exp:"By Kepler's third law, T² ∝ R³. With R = 9, R³ = 729, so T = √729 ≈ 27 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 16 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["16 years","32 years","64 years","128 years"],ans:[2],exp:"By Kepler's third law, T² ∝ R³. With R = 16, R³ = 4096, so T = √4096 ≈ 64 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 2 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["2.83 years","2 years","4 years","5.66 years"],ans:[0],exp:"By Kepler's third law, T² ∝ R³. With R = 2, R³ = 8, so T = √8 ≈ 2.83 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 8 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["8 years","45.2 years","22.6 years","16 years"],ans:[2],exp:"By Kepler's third law, T² ∝ R³. With R = 8, R³ = 512, so T = √512 ≈ 22.6 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 3 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["10.4 years","5.2 years","6 years","3 years"],ans:[1],exp:"By Kepler's third law, T² ∝ R³. With R = 3, R³ = 27, so T = √27 ≈ 5.2 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 25 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["25 years","125 years","250 years","50 years"],ans:[1],exp:"By Kepler's third law, T² ∝ R³. With R = 25, R³ = 15625, so T = √15625 ≈ 125 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 6 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["14.7 years","12 years","29.4 years","6 years"],ans:[0],exp:"By Kepler's third law, T² ∝ R³. With R = 6, R³ = 216, so T = √216 ≈ 14.7 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"An astronaut has a mass of 60 kg on Earth. On Mars, where gravity is about 0.38 of Earth's, the astronaut's mass is:",ch:["60 kg","22.8 kg","120 kg","0 kg, since mass is a form of weight"],ans:[0],exp:"Mass is an intrinsic property of matter and does not change with location; only weight (the gravitational force on that mass) changes with the local gravitational field."},

{cat:"III",sub:"Gravitation",type:"single",q:"An astronaut has a mass of 70 kg on Earth. On the Moon, where gravity is about 1/6 of Earth's, the astronaut's mass is:",ch:["70 kg","11.67 kg","140 kg","0 kg, since mass is a form of weight"],ans:[0],exp:"Mass is an intrinsic property of matter and does not change with location; only weight (the gravitational force on that mass) changes with the local gravitational field."},
{cat:"III",sub:"Gravitation",type:"single",q:"An astronaut has a mass of 100 kg on Earth. On Mars, where gravity is about 0.38 of Earth's, the astronaut's mass is:",ch:["100 kg","38 kg","200 kg","0 kg, since mass is a form of weight"],ans:[0],exp:"Mass is an intrinsic property of matter and does not change with location; only weight (the gravitational force on that mass) changes with the local gravitational field."},
{cat:"III",sub:"Gravitation",type:"single",q:"An astronaut has a mass of 50 kg on Earth. On Jupiter, where gravity is about 2.5 of Earth's, the astronaut's mass is:",ch:["50 kg","125 kg","100 kg","0 kg, since mass is a form of weight"],ans:[0],exp:"Mass is an intrinsic property of matter and does not change with location; only weight (the gravitational force on that mass) changes with the local gravitational field."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A ball on a string is swung in a horizontal circle at constant speed. The net force on the ball points:",ch:["Tangent to the circle, in the direction of motion","Toward the center of the circle","Away from the center of the circle","There is no net force since speed is constant"],ans:[1],exp:"Even at constant speed, the direction of velocity is continuously changing in circular motion, requiring a net centripetal force directed toward the center of the circle."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"If the string holding a ball in horizontal circular motion suddenly breaks, the ball will:",ch:["Continue moving in a circle briefly, then stop","Fly outward, directly away from the center","Move in a straight line tangent to the circle at the point of release (then fall under gravity)","Immediately stop in place"],ans:[2],exp:"With no more centripetal force, Newton's first law dictates the ball continues in a straight line along its instantaneous velocity direction -- tangent to the circle -- rather than flying radially outward."},

{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A 4 kg object moves in a circle of radius 2 m at a constant speed of 4 m/s. What is the magnitude of the centripetal force?",ch:["32 N","64 N","16 N","8 N"],ans:[0],exp:"F_c = mv²/r = (4 kg)(4 m/s)² / 2 m = 32 N."},

{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"On a mass-spring system undergoing simple harmonic motion, if the mass is doubled while the spring constant stays the same, the period changes by a factor of:",ch:["√2","1","2","1/2"],ans:[0],exp:"T = 2π√(m/k). If mass changes by a factor of 2, the period changes by a factor of √2 = √2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"On a mass-spring system undergoing simple harmonic motion, if the mass is quadrupled while the spring constant stays the same, the period changes by a factor of:",ch:["2","1","4","1/2"],ans:[0],exp:"T = 2π√(m/k). If mass changes by a factor of 4, the period changes by a factor of √4 = 2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"On a mass-spring system undergoing simple harmonic motion, if the mass is increased ninefold while the spring constant stays the same, the period changes by a factor of:",ch:["3","1","2","1/2"],ans:[0],exp:"T = 2π√(m/k). If mass changes by a factor of 9, the period changes by a factor of √9 = 3."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"On a mass-spring system undergoing simple harmonic motion, if the mass is reduced to one-fourth while the spring constant stays the same, the period changes by a factor of:",ch:["1/2","1","2","1/4"],ans:[0],exp:"T = 2π√(m/k). If mass changes by a factor of 0.25, the period changes by a factor of √0.25 = 1/2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A simple pendulum's length is changed by a factor of 4. By what factor does its period change? (Assume small-angle oscillations.)",ch:["2","1","4","1/4"],ans:[0],exp:"For a simple pendulum, T = 2π√(L/g), so the period is proportional to √L. A length factor of 4 changes the period by a factor of √4 = 2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A simple pendulum's length is changed by a factor of 9. By what factor does its period change? (Assume small-angle oscillations.)",ch:["3","1","9","1/9"],ans:[0],exp:"For a simple pendulum, T = 2π√(L/g), so the period is proportional to √L. A length factor of 9 changes the period by a factor of √9 = 3."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A simple pendulum's length is changed by a factor of 0.25. By what factor does its period change? (Assume small-angle oscillations.)",ch:["1/2","1","0.25","1/0.25"],ans:[0],exp:"For a simple pendulum, T = 2π√(L/g), so the period is proportional to √L. A length factor of 0.25 changes the period by a factor of √0.25 = 1/2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A simple pendulum's length is changed by a factor of 2. By what factor does its period change? (Assume small-angle oscillations.)",ch:["√2","1","2","1/2"],ans:[0],exp:"For a simple pendulum, T = 2π√(L/g), so the period is proportional to √L. A length factor of 2 changes the period by a factor of √2 = √2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"At the highest point of a pendulum's swing (maximum displacement), the pendulum bob's speed is:",ch:["At its maximum","Zero, momentarily, before swinging back","Constant throughout the swing","Undefined"],ans:[1],exp:"At the extreme points of a pendulum's swing, all kinetic energy has converted to potential energy, so the bob's speed is momentarily zero before it swings back."},

{cat:"III",sub:"Momentum",type:"single",q:"For an isolated system experiencing an internal explosion (such as a firework bursting), the total momentum of all the fragments immediately after the explosion:",ch:["Is zero if the system started at rest, since momentum is conserved","Always increases due to the energy released","Always decreases","Cannot be determined without knowing the fragment masses"],ans:[0],exp:"Momentum is conserved in an isolated system even during an internal explosion; if the system's total momentum was zero beforehand (at rest), the vector sum of all fragment momenta afterward must also be zero."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"A diver tucks into a ball shape while spinning during a dive. Compared to an extended body position, the tucked position causes the diver to spin:",ch:["Slower, because moment of inertia increases","Faster, because moment of inertia decreases and angular momentum is conserved","At the same rate, since angular momentum is not conserved in the air","Not at all, since no external torque acts once airborne"],ans:[1],exp:"With no external torque during the dive, angular momentum L = Iω is conserved. Tucking reduces the moment of inertia I, so angular velocity ω must increase to keep L constant."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"A rotating skater extends her arms outward from a tucked position. What happens to her angular velocity?",ch:["It increases","It decreases","It stays the same","It reverses direction"],ans:[1],exp:"Extending the arms increases the skater's moment of inertia; since angular momentum is conserved (no external torque), angular velocity must decrease."},

{cat:"III",sub:"Rotational Motion",type:"single",q:"Two children sit on a balanced seesaw. A heavier child sits closer to the pivot than a lighter child on the other side. This arrangement can balance the seesaw because:",ch:["Torque depends on force times distance from the pivot, so a smaller force at a larger distance can balance a larger force at a smaller distance","Only the total weight matters, not the distance from the pivot","The heavier child always makes the seesaw tip toward them regardless of position","Torque is independent of distance from the pivot"],ans:[0],exp:"Torque = F × r (perpendicular distance from pivot); a heavier child close to the pivot can produce the same torque as a lighter child farther away, balancing the seesaw."},

{cat:"III",sub:"Fluids",type:"single",q:"Water flows through a pipe that narrows partway along its length. Compared to the wider section, in the narrower section the water's speed and pressure are, respectively:",ch:["Higher speed, higher pressure","Higher speed, lower pressure","Lower speed, higher pressure","Lower speed, lower pressure"],ans:[1],exp:"By continuity, water speeds up in the narrower section; by Bernoulli's principle, this faster flow corresponds to lower pressure in that section."},

{cat:"III",sub:"Momentum",type:"single",q:"A 3 kg cart moving at 5 m/s collides and sticks with a 2 kg cart moving at -2 m/s (negative meaning opposite direction). What is their combined velocity after collision?",ch:["4.4 m/s","5 m/s","2.2 m/s","3.8 m/s"],ans:[2],exp:"Conservation of momentum: v_f = (m₁v₁ + m₂v₂)/(m₁+m₂) = ((3)(5) + (2)(-2))/(5) = 2.2 m/s."},
{cat:"III",sub:"Momentum",type:"single",q:"A 5 kg cart moving at 4 m/s collides and sticks with a 3 kg cart moving at -1 m/s (negative meaning opposite direction). What is their combined velocity after collision?",ch:["4.25 m/s","2.12 m/s","2.88 m/s","4 m/s"],ans:[1],exp:"Conservation of momentum: v_f = (m₁v₁ + m₂v₂)/(m₁+m₂) = ((5)(4) + (3)(-1))/(8) = 2.12 m/s."},

{cat:"III",sub:"Gravitation",type:"single",q:"According to Newton's law of universal gravitation, the gravitational force between two objects depends on:",ch:["Only their masses, not the distance between them","The product of their masses and the inverse square of the distance between their centers","The sum of their masses only","Only the distance between them, not their masses"],ans:[1],exp:"Newton's law of gravitation states F = Gm₁m₂/r², so the force depends on the product of the two masses and decreases with the square of the distance between them."},
{cat:"III",sub:"Gravitation",type:"single",q:"If Earth's mass were somehow doubled while its radius stayed the same, the gravitational force on an object at its surface would:",ch:["Double","Stay the same","Be quartered","Be halved"],ans:[0],exp:"Since F = GMm/r², doubling Earth's mass M (with radius r unchanged) directly doubles the gravitational force at the surface."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A mass oscillating on a spring has maximum kinetic energy at which point in its motion?",ch:["At maximum displacement from equilibrium","At the equilibrium position, where speed is greatest","It is constant throughout the motion","At the moment it reverses direction"],ans:[1],exp:"In simple harmonic motion, speed (and thus kinetic energy) is greatest at the equilibrium position, where all the system's energy is kinetic rather than stored as potential energy."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A mass oscillating on a spring has maximum potential energy at which point in its motion?",ch:["At the equilibrium position","At the points of maximum displacement (amplitude) from equilibrium","Only at the moment of release","Potential energy is always zero in this system"],ans:[1],exp:"Elastic potential energy is maximum at the extremes of oscillation, where the spring is maximally stretched or compressed and the mass is momentarily at rest."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"Which factor does NOT affect an object's moment of inertia about a given axis?",ch:["The object's mass","The distribution of mass relative to the axis","The object's velocity","The shape of the object"],ans:[2],exp:"Moment of inertia depends on an object's mass and how that mass is distributed relative to the rotation axis (and its shape), but it does not depend on the object's current velocity."},
{cat:"III",sub:"Fluids",type:"single",q:"An object with density greater than water is placed in water. What happens?",ch:["It floats with most of its volume above the surface","It sinks, since its weight exceeds the maximum buoyant force water can provide","It floats exactly at the surface, fully submerged","It floats with most of its volume below the surface only"],ans:[1],exp:"An object denser than the fluid it's placed in will sink, because even when fully submerged, the buoyant force (equal to the weight of displaced fluid) cannot equal its weight."},
{cat:"III",sub:"Fluids",type:"single",q:"Pressure at a given depth in a static fluid depends on:",ch:["The shape of the container only","The fluid's density, gravitational acceleration, and depth","The total volume of fluid in the container","The surface area of the container's base only"],ans:[1],exp:"Hydrostatic pressure is given by P = ρgh, depending on fluid density (ρ), gravitational acceleration (g), and depth (h) -- not on the container's shape or total volume."},

{cat:"IV",sub:"Electrostatics",type:"single",q:"Electric field lines around a single, isolated negative point charge point:",ch:["Away from the charge","Toward the charge","Parallel to each other, regardless of position","In closed loops around the charge"],ans:[1],exp:"By convention, electric field lines point in the direction a positive test charge would move -- toward negative charges and away from positive charges."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"Two oppositely charged particles are moved farther apart. The electric potential energy of the system:",ch:["Increases","Decreases (becomes more negative), since work is done by the attractive force as they separate is negative -- meaning the system does positive work only when charges come together","Remains exactly zero at all separations","Is undefined for opposite charges"],ans:[1],exp:"For attracting opposite charges, potential energy is negative and becomes less negative (i.e., increases toward zero) as they are separated -- but since work must be done against the attractive force to pull them apart, energy of the system increases in that sense; the key concept is that separating opposite charges requires energy input, opposite to like charges."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"A positive test charge is released from rest in a uniform electric field. It will:",ch:["Remain stationary","Accelerate in the direction of the electric field","Accelerate opposite to the electric field","Move in a circle"],ans:[1],exp:"A positive charge experiences a force in the same direction as the electric field (F = qE), so it accelerates along the field direction."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"A negative test charge is released from rest in a uniform electric field pointing to the right. The charge will accelerate:",ch:["To the right","To the left","Upward","It will not accelerate"],ans:[1],exp:"A negative charge experiences a force opposite to the electric field direction (F = qE, with q negative), so it accelerates to the left if the field points right."},

{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 3 µF and 5 µF, are connected in parallel. What is the equivalent capacitance?",ch:["1.88 µF","8 µF","15 µF","16 µF"],ans:[1],exp:"Capacitors in parallel add directly: C_eq = 3 µF + 5 µF = 8 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 1 µF and 6 µF, are connected in parallel. What is the equivalent capacitance?",ch:["6 µF","14 µF","7 µF","0.86 µF"],ans:[2],exp:"Capacitors in parallel add directly: C_eq = 1 µF + 6 µF = 7 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 4 µF and 4 µF, are connected in parallel. What is the equivalent capacitance?",ch:["16 µF","10.2 µF","2 µF","8 µF"],ans:[3],exp:"Capacitors in parallel add directly: C_eq = 4 µF + 4 µF = 8 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 2 µF and 8 µF, are connected in parallel. What is the equivalent capacitance?",ch:["1.6 µF","16 µF","20 µF","10 µF"],ans:[3],exp:"Capacitors in parallel add directly: C_eq = 2 µF + 8 µF = 10 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 5 µF and 10 µF, are connected in parallel. What is the equivalent capacitance?",ch:["15 µF","30 µF","3.33 µF","50 µF"],ans:[0],exp:"Capacitors in parallel add directly: C_eq = 5 µF + 10 µF = 15 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 3 µF and 7 µF, are connected in parallel. What is the equivalent capacitance?",ch:["21 µF","10 µF","2.1 µF","20 µF"],ans:[1],exp:"Capacitors in parallel add directly: C_eq = 3 µF + 7 µF = 10 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 6 µF and 6 µF, are connected in parallel. What is the equivalent capacitance?",ch:["12 µF","36 µF","24 µF","3 µF"],ans:[0],exp:"Capacitors in parallel add directly: C_eq = 6 µF + 6 µF = 12 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 1 µF and 9 µF, are connected in parallel. What is the equivalent capacitance?",ch:["20 µF","0.9 µF","9 µF","10 µF"],ans:[3],exp:"Capacitors in parallel add directly: C_eq = 1 µF + 9 µF = 10 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 4 µF and 12 µF, are connected in parallel. What is the equivalent capacitance?",ch:["32 µF","3 µF","16 µF","48 µF"],ans:[2],exp:"Capacitors in parallel add directly: C_eq = 4 µF + 12 µF = 16 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 4 µF and 4 µF, are connected in series. What is the equivalent capacitance?",ch:["2 µF","4 µF","8 µF","3.3 µF"],ans:[0],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (4×4)/(4+4) = 2 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 6 µF and 3 µF, are connected in series. What is the equivalent capacitance?",ch:["4.5 µF","2 µF","9 µF","4 µF"],ans:[1],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (6×3)/(6+3) = 2 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 8 µF and 8 µF, are connected in series. What is the equivalent capacitance?",ch:["4 µF","16 µF","8 µF","5.6 µF"],ans:[0],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (8×8)/(8+8) = 4 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 10 µF and 15 µF, are connected in series. What is the equivalent capacitance?",ch:["6 µF","25 µF","12 µF","12.5 µF"],ans:[0],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (10×15)/(10+15) = 6 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 6 µF and 12 µF, are connected in series. What is the equivalent capacitance?",ch:["8 µF","18 µF","9 µF","4 µF"],ans:[3],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (6×12)/(6+12) = 4 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 2 µF and 2 µF, are connected in series. What is the equivalent capacitance?",ch:["2 µF","2.15 µF","4 µF","1 µF"],ans:[3],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (2×2)/(2+2) = 1 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 9 µF and 18 µF, are connected in series. What is the equivalent capacitance?",ch:["12 µF","6 µF","27 µF","13.5 µF"],ans:[1],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (9×18)/(9+18) = 6 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 5 µF and 20 µF, are connected in series. What is the equivalent capacitance?",ch:["8 µF","12.5 µF","25 µF","4 µF"],ans:[3],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (5×20)/(5+20) = 4 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 12 µF and 4 µF, are connected in series. What is the equivalent capacitance?",ch:["3 µF","6 µF","16 µF","8 µF"],ans:[0],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (12×4)/(12+4) = 3 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 6 µF and 6 µF, are connected in series. What is the equivalent capacitance?",ch:["3 µF","4.45 µF","6 µF","12 µF"],ans:[0],exp:"For capacitors in series, 1/C_eq = 1/C₁ + 1/C₂, so C_eq = (C₁C₂)/(C₁+C₂) = (6×6)/(6+6) = 3 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"A parallel-plate capacitor is connected to a battery that maintains a constant voltage across it. A dielectric material is inserted between the plates. The capacitor's stored charge will:",ch:["Increase, since capacitance increases while voltage stays fixed (Q = CV)","Decrease","Stay exactly the same","Immediately drop to zero"],ans:[0],exp:"Inserting a dielectric increases capacitance. With voltage held constant by the battery, Q = CV means the stored charge increases proportionally."},
{cat:"IV",sub:"Capacitance",type:"single",q:"A charged, isolated parallel-plate capacitor (disconnected from any battery) has a dielectric inserted between its plates. What happens to the voltage across the plates?",ch:["It increases","It decreases, since capacitance increases while charge stays fixed (V = Q/C)","It stays the same","It becomes zero"],ans:[1],exp:"With the capacitor isolated, charge Q remains fixed. Since inserting a dielectric increases capacitance C, and V = Q/C, the voltage across the plates decreases."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves to the right through a magnetic field pointing out of the page. Using the right-hand rule (F = qv × B), the magnetic force on the charge points:",ch:["Out of the page","Down","Up","Into the page"],ans:[1],exp:"Using the right-hand rule with velocity to the right and field out of the page, the cross product v × B points down for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves to the right through a magnetic field pointing into the page. Using the right-hand rule (F = qv × B), the magnetic force on the charge points:",ch:["Down","Up","Out of the page","Into the page"],ans:[1],exp:"Using the right-hand rule with velocity to the right and field into the page, the cross product v × B points up for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves upward through a magnetic field pointing out of the page. Using the right-hand rule (F = qv × B), the magnetic force on the charge points:",ch:["To the left","To the right","Out of the page","Into the page"],ans:[1],exp:"Using the right-hand rule with velocity upward and field out of the page, the cross product v × B points to the right for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves downward through a magnetic field pointing into the page. Using the right-hand rule (F = qv × B), the magnetic force on the charge points:",ch:["To the right","Into the page","Out of the page","To the left"],ans:[3],exp:"Using the right-hand rule with velocity downward and field into the page, the cross product v × B points to the left for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves to the left through a magnetic field pointing into the page. Using the right-hand rule (F = qv × B), the magnetic force on the charge points:",ch:["Out of the page","Down","Up","Into the page"],ans:[1],exp:"Using the right-hand rule with velocity to the left and field into the page, the cross product v × B points down for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"Two long, parallel current-carrying wires carry current in opposite directions. The wires will:",ch:["Attract each other","Repel each other","Exert no force on each other","Rotate to become perpendicular"],ans:[1],exp:"Currents flowing in opposite directions in parallel wires repel each other; currents in the same direction attract."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 1 C moves at 10 m/s perpendicular to a 0.2 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["10 N","3.3 N","4 N","2 N"],ans:[3],exp:"F = qvB = (1 C)(10 m/s)(0.2 T) = 2 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 3 C moves at 4 m/s perpendicular to a 0.5 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["6 N","7.9 N","12 N","2 N"],ans:[0],exp:"F = qvB = (3 C)(4 m/s)(0.5 T) = 6 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 0.5 C moves at 8 m/s perpendicular to a 0.6 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["4 N","3.76 N","2.4 N","4.8 N"],ans:[2],exp:"F = qvB = (0.5 C)(8 m/s)(0.6 T) = 2.4 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 4 C moves at 3 m/s perpendicular to a 0.3 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["12 N","7.2 N","0.9 N","3.6 N"],ans:[3],exp:"F = qvB = (4 C)(3 m/s)(0.3 T) = 3.6 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 2 C moves at 6 m/s perpendicular to a 0.25 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["3 N","12 N","1.5 N","6 N"],ans:[0],exp:"F = qvB = (2 C)(6 m/s)(0.25 T) = 3 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 5 C moves at 2 m/s perpendicular to a 0.4 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["8 N","0.8 N","10 N","4 N"],ans:[3],exp:"F = qvB = (5 C)(2 m/s)(0.4 T) = 4 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 1 C moves at 20 m/s perpendicular to a 0.1 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["4 N","20 N","2 N","3.3 N"],ans:[2],exp:"F = qvB = (1 C)(20 m/s)(0.1 T) = 2 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 3 C moves at 5 m/s perpendicular to a 0.2 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["15 N","1 N","3 N","6 N"],ans:[2],exp:"F = qvB = (3 C)(5 m/s)(0.2 T) = 3 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 0.2 C moves at 15 m/s perpendicular to a 0.5 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["7.5 N","2.72 N","1.5 N","3 N"],ans:[2],exp:"F = qvB = (0.2 C)(15 m/s)(0.5 T) = 1.5 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"Which of the following situations produces a magnetic field?",ch:["A charge at rest in a vacuum","A steady electric current flowing through a wire","A neutral, stationary atom","An electric field with no moving charges"],ans:[1],exp:"Magnetic fields are produced by moving charges, including electric currents (organized flow of charge); a stationary charge produces only an electric field."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A current-carrying wire is looped into a coil. Compared to a straight wire carrying the same current, the magnetic field inside the coil is:",ch:["Weaker, because the wire is longer","Stronger, because the magnetic field contributions from each loop add together inside the coil","Exactly zero","Unaffected by the coil shape"],ans:[1],exp:"Looping a wire into a coil causes the magnetic field contributions of each turn to reinforce one another inside the coil, producing a much stronger net field than a straight wire."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A bar magnet is pulled out of a coil of wire, decreasing the magnetic flux through it. According to Lenz's law, the induced current will flow in a direction that:",ch:["Opposes the decrease in flux, creating a magnetic field that tries to maintain the original flux","Has no particular direction","Always flows clockwise regardless of the change","Increases the rate of flux change"],ans:[0],exp:"Lenz's law states the induced current opposes the change in flux that produced it -- here, it flows to try to maintain the decreasing flux, effectively opposing the magnet's removal."},
{cat:"IV",sub:"EM Induction",type:"single",q:"Why does Lenz's law (the direction of induced current opposing the change in flux) make physical sense in terms of energy conservation?",ch:["It doesn't relate to energy conservation at all","If the induced current instead reinforced the change in flux, it would create energy from nothing, violating conservation of energy","It only applies to direct current circuits","It is simply a convention with no physical basis"],ans:[1],exp:"If induced currents reinforced rather than opposed the flux change, the process would runaway and generate energy without any external input, violating energy conservation -- so Lenz's law is a direct consequence of that conservation law."},
{cat:"IV",sub:"EM Induction",type:"single",q:"An electric motor and an electric generator are, in a sense, opposite devices. A motor converts ___ into ___, while a generator converts ___ into ___.",ch:["Electrical energy into mechanical energy; mechanical energy into electrical energy","Mechanical energy into electrical energy; electrical energy into mechanical energy","Thermal energy into electrical energy; electrical energy into thermal energy","Chemical energy into electrical energy; electrical energy into chemical energy"],ans:[0],exp:"A motor uses electrical energy (current in a magnetic field) to produce mechanical motion; a generator uses mechanical motion (rotating a coil in a magnetic field) to induce an electrical current -- the reverse process."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 1 m conducting rod moves at 5 m/s perpendicular to a 0.3 T magnetic field. What EMF is induced across the rod?",ch:["3 V","0.3 V","5 V","1.5 V"],ans:[3],exp:"Motional EMF = BLv = (0.3 T)(1 m)(5 m/s) = 1.5 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 2 m conducting rod moves at 3 m/s perpendicular to a 0.1 T magnetic field. What EMF is induced across the rod?",ch:["0.2 V","0.6 V","1.2 V","6 V"],ans:[1],exp:"Motional EMF = BLv = (0.1 T)(2 m)(3 m/s) = 0.6 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 0.4 m conducting rod moves at 6 m/s perpendicular to a 0.5 T magnetic field. What EMF is induced across the rod?",ch:["2.38 V","1.2 V","0.2 V","2.4 V"],ans:[1],exp:"Motional EMF = BLv = (0.5 T)(0.4 m)(6 m/s) = 1.2 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 0.5 m conducting rod moves at 8 m/s perpendicular to a 0.4 T magnetic field. What EMF is induced across the rod?",ch:["4 V","1.6 V","3.2 V","0.2 V"],ans:[1],exp:"Motional EMF = BLv = (0.4 T)(0.5 m)(8 m/s) = 1.6 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 1 m conducting rod moves at 4 m/s perpendicular to a 0.25 T magnetic field. What EMF is induced across the rod?",ch:["0.25 V","4 V","2 V","1 V"],ans:[3],exp:"Motional EMF = BLv = (0.25 T)(1 m)(4 m/s) = 1 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 0.3 m conducting rod moves at 5 m/s perpendicular to a 0.6 T magnetic field. What EMF is induced across the rod?",ch:["1.5 V","0.9 V","1.8 V","0.18 V"],ans:[1],exp:"Motional EMF = BLv = (0.6 T)(0.3 m)(5 m/s) = 0.9 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 2 m conducting rod moves at 2 m/s perpendicular to a 0.15 T magnetic field. What EMF is induced across the rod?",ch:["0.6 V","0.3 V","1.2 V","4 V"],ans:[0],exp:"Motional EMF = BLv = (0.15 T)(2 m)(2 m/s) = 0.6 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 0.8 m conducting rod moves at 3 m/s perpendicular to a 0.35 T magnetic field. What EMF is induced across the rod?",ch:["0.28 V","0.84 V","2.4 V","1.68 V"],ans:[1],exp:"Motional EMF = BLv = (0.35 T)(0.8 m)(3 m/s) = 0.84 V."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 1.5 m conducting rod moves at 6 m/s perpendicular to a 0.2 T magnetic field. What EMF is induced across the rod?",ch:["9 V","0.3 V","3.6 V","1.8 V"],ans:[3],exp:"Motional EMF = BLv = (0.2 T)(1.5 m)(6 m/s) = 1.8 V."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"The SI unit of electric charge is the:",ch:["Volt","Ampere","Coulomb","Ohm"],ans:[2],exp:"Electric charge is measured in coulombs (C) in the SI system."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"Which principle explains why a charged balloon can stick to a neutral wall?",ch:["The wall becomes permanently charged","The balloon's charge induces a redistribution of charge in the wall (polarization), creating an attractive force","Gravity alone holds the balloon in place","Neutral objects always repel charged objects"],ans:[1],exp:"A charged object induces a temporary redistribution (polarization) of charge in a nearby neutral conductor or insulator, creating a net attractive force even though the wall has no overall charge."},
{cat:"IV",sub:"Circuits",type:"single",q:"In a simple series circuit with a single battery and multiple resistors, the current through each resistor is:",ch:["Different for each resistor, depending on its resistance","The same through every resistor, since there is only one path for current","Zero through all but the largest resistor","Proportional to each resistor's distance from the battery"],ans:[1],exp:"In a series circuit, there is only a single path for current, so the same current flows through every component in the circuit."},
{cat:"IV",sub:"Circuits",type:"single",q:"In a simple parallel circuit with a single battery and multiple resistors, the voltage across each resistor is:",ch:["Different for each resistor","The same across every resistor, equal to the battery's voltage (ignoring internal resistance)","Zero across all but one resistor","Proportional to each resistor's resistance"],ans:[1],exp:"In a parallel circuit, each branch connects directly across the same two nodes (the battery terminals), so each resistor experiences the same voltage."},
{cat:"IV",sub:"Circuits",type:"single",q:"Adding an additional resistor in parallel to an existing parallel combination will cause the total equivalent resistance to:",ch:["Increase","Decrease, since another path for current is added","Stay exactly the same","Become infinite"],ans:[1],exp:"Adding another parallel path always decreases the total equivalent resistance, since current has more ways to flow, unlike in series where adding a resistor increases total resistance."},
{cat:"IV",sub:"Circuits",type:"single",q:"Adding an additional resistor in series to an existing circuit will cause the total resistance to:",ch:["Decrease","Increase, since resistors in series add directly","Stay exactly the same","Depend only on the battery voltage"],ans:[1],exp:"In a series circuit, resistances add directly (R_total = R₁+R₂+...), so adding another resistor always increases the total resistance."},
{cat:"IV",sub:"Capacitance",type:"single",q:"A capacitor's stored electrical energy can be calculated using U = ½CV². If the voltage across a capacitor is doubled while capacitance stays fixed, the stored energy:",ch:["Doubles","Quadruples","Stays the same","Is halved"],ans:[1],exp:"Since energy U = ½CV² depends on the square of voltage, doubling V (with C fixed) quadruples the stored energy."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A compass needle aligns itself with Earth's magnetic field. This demonstrates that a compass needle is essentially:",ch:["An electrically charged object responding to Earth's electric field","A small permanent magnet responding to the torque exerted by an external magnetic field","A device that measures electric current only","Unrelated to magnetic fields"],ans:[1],exp:"A compass needle is a small permanent magnet; it experiences a torque from Earth's magnetic field that aligns it along the local field direction (roughly north-south)."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A transformer uses electromagnetic induction to change AC voltage levels. It relies fundamentally on:",ch:["A constant, unchanging magnetic flux through its coils","A changing magnetic flux (from alternating current) inducing a voltage in a nearby coil","Direct current flowing through both coils simultaneously","Permanent magnets embedded in each coil"],ans:[1],exp:"Transformers work because the changing current in the primary coil produces a changing magnetic flux, which induces a voltage in the secondary coil via electromagnetic induction -- a process that requires AC (or otherwise changing) current, not steady DC."},
{cat:"IV",sub:"EM Induction",type:"single",q:"Which of the following would NOT induce an EMF in a nearby closed loop of wire?",ch:["Moving a bar magnet toward the loop","Rotating the loop within a constant magnetic field","Holding both the loop and a magnet completely stationary relative to each other","Increasing the current in a nearby electromagnet"],ans:[2],exp:"EMF is induced only when magnetic flux through the loop changes over time; if the loop and magnet are both stationary relative to each other with no changing current nearby, flux is constant and no EMF is induced."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 120 V and draws 5 A of current. What is its power consumption?",ch:["600 W","1200 W","24 W","125 W"],ans:[0],exp:"P = IV = 5 A × 120 V = 600 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 240 V and draws 10 A of current. What is its power consumption?",ch:["2400 W","24 W","4800 W","250 W"],ans:[0],exp:"P = IV = 10 A × 240 V = 2400 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 9 V and draws 1.5 A of current. What is its power consumption?",ch:["10.5 W","6 W","13.5 W","27 W"],ans:[2],exp:"P = IV = 1.5 A × 9 V = 13.5 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 1.5 V and draws 0.5 A of current. What is its power consumption?",ch:["1.5 W","3 W","0.75 W","2 W"],ans:[2],exp:"P = IV = 0.5 A × 1.5 V = 0.75 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 6 V and draws 3 A of current. What is its power consumption?",ch:["36 W","18 W","2 W","9 W"],ans:[1],exp:"P = IV = 3 A × 6 V = 18 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 12 V and draws 4 A of current. What is its power consumption?",ch:["96 W","48 W","16 W","3 W"],ans:[1],exp:"P = IV = 4 A × 12 V = 48 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 3 V and draws 1 A of current. What is its power consumption?",ch:["4.45 W","6 W","4 W","3 W"],ans:[3],exp:"P = IV = 1 A × 3 V = 3 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A household appliance operates at 220 V and draws 2 A of current. What is its power consumption?",ch:["110 W","880 W","440 W","222 W"],ans:[2],exp:"P = IV = 2 A × 220 V = 440 W."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 100 W appliance runs for 5 hours. How much energy does it consume, in kilowatt-hours?",ch:["1 kWh","500 kWh","0.5 kWh","20 kWh"],ans:[2],exp:"Energy = P × t = 100 W × 5 h = 500 Wh = 0.5 kWh."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 60 W appliance runs for 10 hours. How much energy does it consume, in kilowatt-hours?",ch:["0.6 kWh","6 kWh","1.2 kWh","600 kWh"],ans:[0],exp:"Energy = P × t = 60 W × 10 h = 600 Wh = 0.6 kWh."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 1500 W appliance runs for 2 hours. How much energy does it consume, in kilowatt-hours?",ch:["3 kWh","6 kWh","3000 kWh","750 kWh"],ans:[0],exp:"Energy = P × t = 1500 W × 2 h = 3000 Wh = 3 kWh."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 2000 W appliance runs for 1 hours. How much energy does it consume, in kilowatt-hours?",ch:["4 kWh","2000 kWh","2 kWh","3.3 kWh"],ans:[2],exp:"Energy = P × t = 2000 W × 1 h = 2000 Wh = 2 kWh."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 75 W appliance runs for 8 hours. How much energy does it consume, in kilowatt-hours?",ch:["9.38 kWh","1.2 kWh","0.6 kWh","600 kWh"],ans:[2],exp:"Energy = P × t = 75 W × 8 h = 600 Wh = 0.6 kWh."},

{cat:"IV",sub:"Electrostatics",type:"single",q:"Charge is conserved in all physical processes, meaning:",ch:["Charge can be created but never destroyed","The total charge of an isolated system remains constant, though charge can move between objects or change form","Charge is destroyed whenever objects touch","Only positive charge is conserved"],ans:[1],exp:"Conservation of charge means the net electric charge of an isolated system cannot change; charge can be transferred between objects (e.g., by friction or conduction) but never created or destroyed."},
