<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study // PopBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1216;
  --panel:#171C22;
  --panel-2:#1E252D;
  --panel-3:#252E38;
  --border:#2C3742;
  --border-lit:#3A4854;
  --amber:#FFB300;
  --amber-dim:#8a640f;
  --cyan:#5FD3C4;
  --text:#E9E6DE;
  --text-dim:#93A0AC;
  --text-dimmer:#5C6874;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(95,211,196,0.05), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(255,179,0,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.label-font{font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
button,input,textarea{font-family:inherit;}

#shell{max-width:980px; margin:0 auto; padding:36px 20px 60px; position:relative;}

/* Back to the PopBoard app (same look as the form's Cancel button). */
.study-back-btn{
  position:absolute; top:28px; left:20px;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px 8px 10px; border-radius:10px; border:1px solid var(--border-lit);
  background:var(--panel-3); color:var(--text-dim); font-size:14px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:color 0.15s ease, border-color 0.15s ease;
}
.study-back-btn svg{width:16px; height:16px;}
.study-back-btn:hover{color:var(--text); border-color:var(--amber-dim);}
@media (max-width:520px){ #shell{padding-top:76px;} .study-back-btn{top:20px; left:16px;} }

.brand{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:8px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 8px var(--amber);}
.brand h1{font-size:22px; margin:0; color:var(--text); letter-spacing:0.08em;}
.subtitle{text-align:center; color:var(--text-dimmer); font-size:12px; font-family:'JetBrains Mono',monospace; letter-spacing:0.08em; margin-bottom:32px;}

.search-wrap{max-width:520px; margin:0 auto 36px; position:relative;}
.search-icon{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-dimmer); pointer-events:none;}
#searchInput{
  width:100%; padding:13px 16px 13px 44px; border-radius:999px; border:1.5px solid var(--border);
  background:var(--panel-2); color:var(--text); font-size:15px; outline:none;
  transition:border-color 0.2s ease, box-shadow 0.2s ease;
}
#searchInput::placeholder{color:var(--text-dimmer);}
#searchInput:focus{border-color:var(--amber-dim); box-shadow:0 0 0 3px rgba(255,179,0,0.12);}

#cardGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;}

.module-card{
  position:relative;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1.5px solid var(--border); border-radius:16px; padding:22px;
  cursor:pointer; transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.module-card:hover{ transform:translateY(-3px); border-color:var(--border-lit); box-shadow:0 10px 24px rgba(0,0,0,0.35); }
.module-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--panel-3); border:1px solid var(--border-lit); color:var(--cyan); margin-bottom:14px;
}
.module-icon svg{width:24px; height:24px;}
.module-icon .emoji-icon{font-size:22px; line-height:1;}
.module-card h3{font-size:16px; margin:0 0 6px 0; color:var(--text);}
.module-card.has-controls h3{padding-right:54px;}
.module-card p{font-size:13px; line-height:1.5; color:var(--text-dim); margin:0;}

.empty-state{
  grid-column:1/-1; text-align:center; padding:48px 20px; color:var(--text-dimmer);
  font-family:'JetBrains Mono',monospace; font-size:13px;
}

/* ---------- teacher-owned custom card controls ---------- */
.module-card-controls{ position:absolute; top:14px; right:14px; display:flex; gap:6px; z-index:2; }
.module-card-controls button{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--border-lit);
  background:rgba(15,18,22,0.85); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0; position:relative; overflow:hidden;
}
.module-card-controls button svg{width:15px; height:15px;}
.module-card-controls button:hover{ color:var(--text); border-color:var(--amber-dim); }

.hold-delete-fill{
  position:absolute; inset:0; width:0%; background:currentColor; opacity:0.3; pointer-events:none; border-radius:inherit;
}
.delete-icon-shaking{ animation: delete-icon-shake 0.3s linear infinite; }
@keyframes delete-icon-shake{
  0%,100%{ transform:translateX(0) rotate(0); }
  25%{ transform:translateX(-2px) rotate(-6deg); }
  75%{ transform:translateX(2px) rotate(6deg); }
}

/* ---------- "+ Add Study Link" tile ---------- */
.module-card.add-card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  border:1.5px dashed var(--border-lit); background:transparent; min-height:150px;
}
.module-card.add-card:hover{ border-color:var(--amber-dim); background:rgba(255,179,0,0.04); transform:translateY(-3px); box-shadow:none; }
.add-card-icon{
  width:44px; height:44px; border-radius:50%; border:1.5px dashed var(--border-lit); display:flex;
  align-items:center; justify-content:center; color:var(--amber); margin-bottom:10px; font-size:22px; line-height:1;
}
.add-card-label{ color:var(--text-dim); font-size:13px; font-weight:600; }

/* ---------- create/edit link modal ---------- */
.link-form-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(5,7,9,0.72); display:flex; align-items:center; justify-content:center; padding:20px;
}
.link-form-overlay.hidden{ display:none; }
.link-form-card{
  width:100%; max-width:480px; max-height:86vh; overflow-y:auto;
  background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1.5px solid var(--border);
  border-radius:18px; padding:26px;
}
.link-form-card h2{ margin:0 0 20px; font-size:17px; text-align:center; }
.form-field{ margin-bottom:16px; }
.form-field label{
  display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase;
  letter-spacing:0.05em; font-family:'JetBrains Mono',monospace;
}
.form-field input[type="text"], .form-field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--border); background:var(--panel-2);
  color:var(--text); font-size:14px; outline:none; resize:vertical;
}
.form-field input:focus, .form-field textarea:focus{ border-color:var(--amber-dim); box-shadow:0 0 0 3px rgba(255,179,0,0.12); }

.icon-search-input{
  width:100%; padding:10px 13px; border-radius:999px; border:1.5px solid var(--border); background:var(--panel-2);
  color:var(--text); font-size:13px; outline:none; margin-bottom:12px;
}
.icon-search-input:focus{ border-color:var(--amber-dim); }
.icon-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(42px, 1fr)); gap:8px; max-height:216px; overflow-y:auto; padding:2px;
}
.icon-cell{
  width:42px; height:42px; border-radius:50%; border:1.5px solid var(--border); background:var(--panel-3);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
.icon-cell svg{ width:19px; height:19px; }
.icon-cell.selected{ border-color:var(--cyan); box-shadow:0 0 0 2px rgba(95,211,196,0.35); color:var(--cyan); }
input.icon-cell{ cursor:text; font-size:18px; text-align:center; }
input.icon-cell::placeholder{ color:var(--text-dimmer); font-size:17px; }

.form-actions{ display:flex; gap:10px; margin-top:6px; }
.form-actions button{ flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; }
.btn-save{ background:var(--amber); color:#1a1200; }
.btn-save:hover{ background:#ffc233; }
.btn-save:disabled{ opacity:0.6; cursor:default; }
.btn-cancel{ background:var(--panel-3); color:var(--text-dim); border:1px solid var(--border-lit); }
.btn-cancel:hover{ color:var(--text); }

@view-transition { navigation: auto; }
@media (prefers-reduced-motion: reduce) {
  @view-transition { navigation: none; }
}
.study-portal-moon {
  display: inline-flex;
  align-items: center;
  color: var(--amber);
  view-transition-name: study-moon;
}
.study-portal-moon svg { width: 22px; height: 22px; display: block; }
</style>

<div id="shell">
  <a id="studyBackBtn" class="study-back-btn" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</a>
  <div class="brand"><span class="study-portal-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg></span><h1>Study</h1></div>
  <div class="subtitle">POPBOARD MODULE LIBRARY</div>
  <div class="search-wrap">
    <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="searchInput" type="text" placeholder="Search modules..." autocomplete="off">
  </div>
  <div id="cardGrid"></div>
</div>

<div id="linkFormOverlay" class="link-form-overlay hidden">
  <div class="link-form-card">
    <h2 id="linkFormHeading">Add Study Link</h2>
    <div class="form-field">
      <label for="linkTitleInput">Title</label>
      <input id="linkTitleInput" type="text" placeholder="e.g. PhET Simulations" autocomplete="off">
    </div>
    <div class="form-field">
      <label for="linkDescInput">Description (optional)</label>
      <textarea id="linkDescInput" rows="2" placeholder="What is this tool for?"></textarea>
    </div>
    <div class="form-field">
      <label for="linkUrlInput">URL</label>
      <input id="linkUrlInput" type="text" placeholder="https://phet.colorado.edu" autocomplete="off">
    </div>
    <div class="form-field">
      <label>Icon</label>
      <input id="iconSearchInput" class="icon-search-input" type="text" placeholder="Search glyph or emoji..." autocomplete="off">
      <div id="iconGrid" class="icon-grid"></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn-cancel" id="linkFormCancelBtn">Cancel</button>
      <button type="button" class="btn-save" id="linkFormSaveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module">
import {
  BOARD_RETURN_STORAGE_KEY, returnStateFromSearch, serializeReturnState,
  studyLibraryBackHref, moduleOpenHref, shouldUseEmulators
} from "./board-return.js?v=20261021i";
"use strict";

/* ============================================================
   Identity / mode resolution.
   - ?teacher=<uid>             -> teacher mode (the gallery gets
     create/edit/delete controls for that teacher's own study links).
   - ?board=<id>&student=<id>   -> student mode, read-only (the owning
     teacher is looked up from the board doc below).
   - neither                    -> built-in modules only, exactly as
     this page behaved before this feature existed.
   ============================================================ */
var params = new URLSearchParams(location.search);
var boardParam = params.get("board");
var studentParam = params.get("student");
var nameParam = params.get("name") || "";
var teacherParam = params.get("teacher");

// Same identity-parsing study-checkride.html itself uses -- kept here
// purely to forward ?board=&student=&name= onward to whichever BUILT-IN
// module is opened, exactly as before this feature existed.
window.__studyIdentity = (boardParam && studentParam) ? { boardId: boardParam, studentId: studentParam, name: nameParam } : null;

var isTeacherMode = !!teacherParam;

// location.search). sessionStorage covers a reload of this tab. With no
// board, Back is / (plus ?emulators=1 when this page was opened that way).
(function wireBackButton() {
  var back = document.getElementById("studyBackBtn");
  if (!back) { return; }
  var state = returnStateFromSearch(location.search);
  if (state) {
    try { sessionStorage.setItem(BOARD_RETURN_STORAGE_KEY, serializeReturnState(state)); } catch (e) {}
  }
  back.href = studyLibraryBackHref(location.search);
})();
var teacherAccount = teacherParam || "";

// Loaded via dynamic import() rather than a static top-level `import`, so
// a CDN hiccup or offline load can't take down the whole page -- the
// built-in modules (which need no network at all) must keep rendering
// exactly like this page did before this feature existed; custom study
// links are a progressive enhancement layered on top, not a dependency
// of the base page working.
var firebaseConfig = {

  appId: "1:1052089495081:web:15293be177ad3a6f577638"
};
var db = null;
var fsDoc, fsGetDoc, fsCollection, fsGetDocs, fsAddDoc, fsUpdateDoc, fsDeleteDoc, fsServerTimestamp;

var firebaseReady = (async function loadFirebase() {
  try {
    var appMod = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
    var fsMod = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
    var fbApp = appMod.initializeApp(firebaseConfig);
    db = fsMod.getFirestore(fbApp);
    // Reuse the PopBoard sign-in from the main app (same site, so Firebase
    // Auth restores it). Firestore security rules only allow reads/writes for
    // signed-in users, and only the owning teacher can change study links.
    // On localhost with ?emulators=1 this must use the emulator too. A
    // production Auth client on the same origin would reject the emulator
    // session and clear it, so Back would land on sign-in.
    var fbAuth = authMod.getAuth(fbApp);
    if (shouldUseEmulators(location.hostname, location.search)) {
      authMod.connectAuthEmulator(fbAuth, "http://127.0.0.1:9099", { disableWarnings: true });
      fsMod.connectFirestoreEmulator(db, "127.0.0.1", 8080);
    }
    if (fbAuth.authStateReady) { await fbAuth.authStateReady(); }
    fsDoc = fsMod.doc; fsGetDoc = fsMod.getDoc; fsCollection = fsMod.collection; fsGetDocs = fsMod.getDocs;

  } catch (e) {
    console.error("Firebase failed to load -- study links are unavailable this session", e);
    return false;
  }
})();

function normalizeUrl(raw) {
  var u = (raw || "").trim();
  if (!u) { return ""; }
  if (!/^https?:\/\//i.test(u)) { u = "https://" + u; }
  return u;
}
function glyphMatches(entry, query) {
  var q = (query || "").trim().toLowerCase();
  if (!q) { return true; }
  if (entry.key && entry.key.toLowerCase().indexOf(q) !== -1) { return true; }
  var kws = entry.keywords || [];
  for (var i = 0; i < kws.length; i++) {
    if (kws[i].toLowerCase().indexOf(q) !== -1) { return true; }
  }
  return false;
}
function sortByOrder(list) {
  return list.slice().sort(function(a, b) { return (a.order || 0) - (b.order || 0); });
}
function humanizeGlyphKey(key) {
  return (key || "").replace(/([A-Z])/g, " $1").replace(/^./, function(c) { return c.toUpperCase(); });
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ============================================================
   Teacher-created study links: Firestore I/O against
   teachers/{teacherUid}/studyLinks -- a subcollection off the
   existing `teachers` doc, matching this app's existing flat schema
   (teachers/{name}, boards/{id} are the only two top-level collections).
   This app never uses Firestore orderBy() -- always fetch-then-sort
   client-side (e.g. app.js:1242), matched here via sortByOrder().
   ============================================================ */
var customLinks = [];

async function fetchCustomLinks(account) {
  if (!account) { return []; }
  var ready = await firebaseReady;
  if (!ready) { return []; }
  try {
    var snap = await fsGetDocs(fsCollection(db, "teachers", account, "studyLinks"));
    var list = [];
    snap.forEach(function(d) {
      var data = d.data();
      list.push({
        docId: d.id,
        title: data.title || "",
        description: data.description || "",
        url: data.url || "",
        iconType: data.iconType || "glyph",
        iconValue: data.iconValue || "link",
        order: data.order || 0
      });
    });
    return sortByOrder(list);
  } catch (e) {
    console.error("study links fetch failed", e);
    return [];
  }
}

// Student mode doesn't know the teacher's name directly -- only the board
// it belongs to -- so look the owning teacher up from the board doc.
async function resolveTeacherAccount() {
  if (teacherAccount) { return teacherAccount; }
  if (!boardParam) { return ""; }
  var ready = await firebaseReady;
  if (!ready) { return ""; }
  try {
    var snap = await fsGetDoc(fsDoc(db, "boards", boardParam));
    if (snap.exists() && snap.data().ownerUid) { return snap.data().ownerUid; }
  } catch (e) {
    console.error("board->teacher lookup failed", e);
  }
  return "";
}

async function saveLink(formData, editingDocId) {
  var ready = await firebaseReady;
  if (!ready) { throw new Error("Firebase unavailable"); }
  var payload = {
    title: formData.title,
    description: formData.description,
    url: formData.url,
    iconType: formData.iconType,
    iconValue: formData.iconValue
  };
  if (editingDocId) {
    payload.updatedAt = fsServerTimestamp();
    await fsUpdateDoc(fsDoc(db, "teachers", teacherAccount, "studyLinks", editingDocId), payload);
  } else {
    payload.order = Date.now();
    payload.createdAt = fsServerTimestamp();
    await fsAddDoc(fsCollection(db, "teachers", teacherAccount, "studyLinks"), payload);
  }
}

async function deleteLinkDoc(docId) {
  try {
    var ready = await firebaseReady;
    if (!ready) { throw new Error("Firebase unavailable"); }
    await fsDeleteDoc(fsDoc(db, "teachers", teacherAccount, "studyLinks", docId));
    customLinks = customLinks.filter(function(l) { return l.docId !== docId; });
    render(currentSearchText);
  } catch (e) {
    console.error("delete study link failed", e);
    alert("Couldn't delete that study link. Check your connection and try again.");
  }
}

/* ============================================================
   Hold-to-confirm delete -- a trimmed, self-contained port of
   wireHoldToConfirmDelete (app.js:478-530), this app's standard delete
   UX everywhere else (boards, polls, posts, students, seats): press and
   hold ~900ms while a fill bar animates and the icon shakes; release
   early cancels with nothing deleted. Ported rather than imported since
   this page shares no code with app.js, per the per-module isolation
   convention.
   ============================================================ */
var HOLD_DELETE_MS = 900;
function wireHoldToConfirmDelete(btn, iconEl, onConfirmed) {
  var fill = document.createElement("span");
  fill.className = "hold-delete-fill";
  btn.appendChild(fill);
  var rafId = null;
  var startedAt = null;
  var done = false;

  function cancelHold() {
    if (done) { return; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    startedAt = null;
    fill.style.width = "0%";
    if (iconEl) { iconEl.classList.remove("delete-icon-shaking"); }
  }
  function tick() {
    if (done) { return; }
    var elapsed = Date.now() - startedAt;
    var pct = Math.min(100, (elapsed / HOLD_DELETE_MS) * 100);
    fill.style.width = pct + "%";
    if (pct >= 100) {
      done = true;
      if (iconEl) { iconEl.classList.remove("delete-icon-shaking"); }
      fill.style.width = "0%";
      onConfirmed();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }
  function startHold() {
    if (startedAt) { return; }
    done = false;
    startedAt = Date.now();
    if (iconEl) { iconEl.classList.add("delete-icon-shaking"); }
    rafId = requestAnimationFrame(tick);
  }

  btn.addEventListener("pointerdown", function(e) { e.preventDefault(); startHold(); });
  btn.addEventListener("pointerup", cancelHold);
  btn.addEventListener("pointerleave", cancelHold);
  btn.addEventListener("pointercancel", cancelHold);
  btn.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startHold(); }
  });
  btn.addEventListener("keyup", function(e) {
    if (e.key === "Enter" || e.key === " ") { cancelHold(); }
  });
  btn.addEventListener("click", function(e) { e.preventDefault(); e.stopPropagation(); });
}

/* ============================================================
   Gallery: merge built-ins + custom links, search/filter, open.
   ============================================================ */
var currentSearchText = "";

function resolveIconHtml(iconType, iconValue) {
  if (iconType === "emoji") {
    return '<span class="emoji-icon">' + escapeHtml(iconValue) + '</span>';
  }
  var g = GLYPHS[iconValue] || GLYPHS.link;
  return g.svg;
}

function buildCombinedList() {
  var builtins = BUILTIN_MODULES.map(function(m) {
    return { kind: "builtin", id: m.id, name: m.name, description: m.description, file: m.file, iconHtml: m.icon };
  });
  var custom = customLinks.map(function(link) {
    return {
      kind: "custom",
      name: link.title,
      description: link.description || "",
      url: link.url,
      iconHtml: resolveIconHtml(link.iconType, link.iconValue),
      docId: link.docId,
      raw: link
    };
  });
  return builtins.concat(custom);
}

function openModule(m) {
  if (m.kind === "builtin") {
    // Forward board / student / teacher / pbreturn / emulators so the
    // module's Back button (study.html + location.search) still knows
    // which PopBoard to return to. Module deep links such as mode= and
    // view= are not copied onto the next module.
    window.open(moduleOpenHref(m.file, location.search), "_blank");
  } else {
    window.open(m.url, "_blank");
  }
}

// Title/description are escaped via textContent (never innerHTML) since,
// unlike the built-in modules' hardcoded copy, custom links carry
// teacher-typed text; only the icon markup (a trusted GLYPHS svg, a
// trusted builtin svg, or an escaped emoji span) goes through innerHTML.
function makeModuleCard(m) {
  var card = document.createElement("div");
  card.className = "module-card";
  var iconWrap = document.createElement("div");
  iconWrap.className = "module-icon";
  iconWrap.innerHTML = m.iconHtml;
  card.appendChild(iconWrap);
  var h3 = document.createElement("h3");
  h3.textContent = m.name;
  card.appendChild(h3);
  var p = document.createElement("p");
  p.textContent = m.description;
  card.appendChild(p);
  card.onclick = function() { openModule(m); };
  if (m.kind === "builtin" && window.PopBoardFun) { var fb = window.PopBoardFun.badge(m.id); if (fb) card.appendChild(fb); }

  if (m.kind === "custom" && isTeacherMode) {
    card.classList.add("has-controls");
    var controls = document.createElement("div");
    controls.className = "module-card-controls";

    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.title = "Edit";
    editBtn.innerHTML = GLYPHS.pencil.svg;
    editBtn.onclick = function(e) { e.stopPropagation(); openLinkForm(m.raw); };
    controls.appendChild(editBtn);

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.title = "Hold to delete";
    delBtn.innerHTML = GLYPHS.trash.svg;
    controls.appendChild(delBtn);
    wireHoldToConfirmDelete(delBtn, delBtn.querySelector("svg"), function() { deleteLinkDoc(m.docId); });

    card.appendChild(controls);
  }
  return card;
}

function makeAddCard() {
  var card = document.createElement("div");
  card.className = "module-card add-card";
  var iconWrap = document.createElement("div");
  iconWrap.className = "add-card-icon";
  iconWrap.textContent = "+";
  card.appendChild(iconWrap);
  var label = document.createElement("span");
  label.className = "add-card-label";
  label.textContent = "Add Study Link";
  card.appendChild(label);
  card.onclick = function() { openLinkForm(null); };
  return card;
}

function render(filterText) {
  currentSearchText = filterText || "";
  var grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  var ft = currentSearchText.trim().toLowerCase();
  var combined = buildCombinedList();
  var filtered = combined.filter(function(m) {
    return !ft || m.name.toLowerCase().indexOf(ft) !== -1 || m.description.toLowerCase().indexOf(ft) !== -1;
  });
  if (!filtered.length) {
    var empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = 'No modules match "' + currentSearchText + '".';
    grid.appendChild(empty);
  } else {
    filtered.forEach(function(m) { grid.appendChild(makeModuleCard(m)); });
  }
  if (isTeacherMode) { grid.appendChild(makeAddCard()); }
}

/* ============================================================
   Create/Edit modal, including the icon picker (search + emoji input +
   glyph grid).
   ============================================================ */
var linkFormOverlay = document.getElementById("linkFormOverlay");
var linkFormHeading = document.getElementById("linkFormHeading");
var linkTitleInput = document.getElementById("linkTitleInput");
var linkDescInput = document.getElementById("linkDescInput");
var linkUrlInput = document.getElementById("linkUrlInput");
var iconSearchInput = document.getElementById("iconSearchInput");
var iconGrid = document.getElementById("iconGrid");
var linkFormCancelBtn = document.getElementById("linkFormCancelBtn");
var linkFormSaveBtn = document.getElementById("linkFormSaveBtn");

var selectedIcon = { iconType: "glyph", iconValue: "link" };
var editingDocId = null;
var emojiInput = null;

function refreshIconSelection() {
  var cells = iconGrid.children;
  for (var i = 0; i < cells.length; i++) {
    cells[i].classList.remove("selected");
    if (selectedIcon.iconType === "glyph" && cells[i].dataset && cells[i].dataset.iconKey === selectedIcon.iconValue) {
      cells[i].classList.add("selected");
    }
  }
  if (selectedIcon.iconType === "emoji" && emojiInput) { emojiInput.classList.add("selected"); }
}

function renderIconGrid(query) {
  iconGrid.innerHTML = "";

  emojiInput = document.createElement("input");
  emojiInput.type = "text";
  emojiInput.className = "icon-cell" + (selectedIcon.iconType === "emoji" ? " selected" : "");
  emojiInput.placeholder = "😀";
  emojiInput.maxLength = 16; // generous enough for multi-codepoint ZWJ emoji sequences (e.g. a family or skin-toned emoji), which can run past 8 UTF-16 code units
  emojiInput.title = "Type or paste any emoji from your device's keyboard";
  emojiInput.value = selectedIcon.iconType === "emoji" ? selectedIcon.iconValue : "";
  emojiInput.addEventListener("input", function() {
    selectedIcon = { iconType: "emoji", iconValue: emojiInput.value.trim() };
    refreshIconSelection();
  });
  emojiInput.addEventListener("focus", function() {
    selectedIcon = { iconType: "emoji", iconValue: emojiInput.value.trim() };
    refreshIconSelection();
  });
  iconGrid.appendChild(emojiInput);

  Object.keys(GLYPHS).forEach(function(key) {
    var entry = GLYPHS[key];
    if (!glyphMatches({ key: key, keywords: entry.keywords }, query)) { return; }
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-cell" + (selectedIcon.iconType === "glyph" && selectedIcon.iconValue === key ? " selected" : "");
    btn.innerHTML = entry.svg;
    btn.dataset.iconKey = key;
    btn.title = humanizeGlyphKey(key);
    btn.onclick = function() {
      selectedIcon = { iconType: "glyph", iconValue: key };
      refreshIconSelection();
    };
    iconGrid.appendChild(btn);
  });
}

function openLinkForm(existing) {
  editingDocId = existing ? existing.docId : null;
  linkFormHeading.textContent = existing ? "Edit Study Link" : "Add Study Link";
  linkTitleInput.value = existing ? existing.title : "";
  linkDescInput.value = existing ? existing.description : "";
  linkUrlInput.value = existing ? existing.url : "";
  selectedIcon = existing ? { iconType: existing.iconType, iconValue: existing.iconValue } : { iconType: "glyph", iconValue: "link" };
  iconSearchInput.value = "";
  renderIconGrid("");
  linkFormOverlay.classList.remove("hidden");
}
function closeLinkForm() {
  linkFormOverlay.classList.add("hidden");
}

iconSearchInput.addEventListener("input", function(e) { renderIconGrid(e.target.value); });
linkFormCancelBtn.onclick = closeLinkForm;
linkFormOverlay.addEventListener("click", function(e) {
  if (e.target === linkFormOverlay) { closeLinkForm(); }
});

linkFormSaveBtn.onclick = async function() {
  var title = linkTitleInput.value.trim();
  var url = normalizeUrl(linkUrlInput.value);
  if (!title) { alert("Give your study link a title."); return; }
  if (!url) { alert("Enter a URL for the study link."); return; }
  var formData = {
    title: title,
    description: linkDescInput.value.trim(),
    url: url,
    iconType: selectedIcon.iconType,
    iconValue: selectedIcon.iconValue || "link"
  };
  linkFormSaveBtn.disabled = true;
  try {
    await saveLink(formData, editingDocId);
    closeLinkForm();
    customLinks = await fetchCustomLinks(teacherAccount);
    render(currentSearchText);
  } catch (e) {
    console.error("save study link failed", e);
    alert("Couldn't save that study link. Check your connection and try again.");
  } finally {
    linkFormSaveBtn.disabled = false;
  }
};

/* ============================================================
   Boot
   ============================================================ */
document.getElementById("searchInput").addEventListener("input", function(e) { render(e.target.value); });

render(""); // built-ins (and the add-tile, in teacher mode) show immediately, not blocked on network

(async function boot() {
  var account = await resolveTeacherAccount();
  if (account) {
    teacherAccount = account;
    customLinks = await fetchCustomLinks(account);
    render(currentSearchText);
  }
})();
</script>
