<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHECKRIDE // Physics 5266 Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0F1216;
  --panel:#171C22;
  --panel-2:#1E252D;
  --panel-3:#252E38;
  --border:#2C3742;
  --border-lit:#3A4854;
  --amber:#FFB300;
  --amber-dim:#8a640f;
  --cyan:#5FD3C4;
  --green:#4CD07D;
  --red:#FF5C5C;
  --text:#E9E6DE;
  --text-dim:#93A0AC;
  --text-dimmer:#5C6874;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(95,211,196,0.05), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(255,179,0,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.label-font{font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-lit); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- shell ---------- */
#app{max-width:1080px; margin:0 auto; padding:14px 14px 60px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; margin-bottom:14px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border); border-radius:var(--radius);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 8px var(--amber);}
.brand h1{font-size:18px; margin:0; color:var(--text); letter-spacing:0.06em;}
.brand .sub{font-size:10px; color:var(--text-dimmer); font-family:'JetBrains Mono',monospace; letter-spacing:0.08em;}
.readout{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--cyan); text-align:right;}
.readout div{line-height:1.5;}

nav.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
nav.tabs button{
  background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
  padding:9px 14px; border-radius:8px; font-size:12px; font-family:'Oswald',sans-serif;
  letter-spacing:0.05em; text-transform:uppercase; transition:all .15s;
}
nav.tabs button:hover{border-color:var(--border-lit); color:var(--text);}
nav.tabs button.active{background:var(--panel-3); color:var(--amber); border-color:var(--amber-dim); box-shadow:inset 0 0 0 1px rgba(255,179,0,0.15);}

.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
.panel-title{font-size:13px; color:var(--text-dim); margin:0 0 14px; display:flex; align-items:center; justify-content:space-between;}
.panel-title .tag{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dimmer); text-transform:none; letter-spacing:0;}

/* ---------- dashboard gauges ---------- */
.gauge-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
.gauge-card{background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center;}
.gauge-card svg{display:block; margin:0 auto;}
.gauge-label{font-size:11px; color:var(--text-dim); margin-top:8px; font-family:'Oswald',sans-serif; letter-spacing:0.04em; text-transform:uppercase;}
.gauge-sub{font-size:10px; color:var(--text-dimmer); font-family:'JetBrains Mono',monospace; margin-top:2px;}
.gauge-pct{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px;}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:16px;}
.stat-box{background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:12px;}
.stat-box .n{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--amber);}
.stat-box .l{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--panel-3); border:1px solid var(--border-lit); color:var(--text);
  padding:11px 18px; border-radius:8px; font-size:13px; font-weight:500;
  font-family:'Oswald',sans-serif; letter-spacing:0.04em; text-transform:uppercase;
  transition:all .15s;
}
.btn:hover{border-color:var(--amber-dim); background:#2a333e;}
.btn-primary{background:var(--amber); border-color:var(--amber); color:#1a1300; font-weight:700;}
.btn-primary:hover{background:#ffc433; border-color:#ffc433;}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-danger{border-color:#5a2a2a; color:var(--red);}
.btn-danger:hover{background:#241414; border-color:var(--red);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-sm{padding:6px 12px; font-size:11px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---------- mode cards ---------- */
.mode-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.mode-card{
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; cursor:pointer; transition:all .15s; position:relative; overflow:hidden;
}
.mode-card:hover{border-color:var(--amber-dim); transform:translateY(-1px);}
.mode-card .icon{font-size:22px; margin-bottom:8px;}
.mode-card h3{margin:0 0 6px; font-size:15px; color:var(--text);}
.mode-card p{margin:0; font-size:12px; color:var(--text-dim); line-height:1.5;}
.mode-card .badge{position:absolute; top:14px; right:14px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--cyan); border:1px solid #2a4a45; padding:2px 7px; border-radius:20px;}

/* ---------- question player ---------- */
.player-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.progress-bar{height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border);}
.progress-bar-fill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--amber)); transition:width .3s;}
.q-meta{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dimmer);}
.q-timer{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--amber); background:var(--panel-2); border:1px solid var(--border); padding:5px 12px; border-radius:6px;}
.q-cat-pill{font-size:10px; color:var(--cyan); border:1px solid #2a4a45; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.04em; font-family:'Oswald',sans-serif;}
.q-text{font-size:16px; line-height:1.6; margin:16px 0 18px; color:var(--text);}
.q-instruction{font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; font-family:'Oswald',sans-serif;}
.choices{display:flex; flex-direction:column; gap:8px;}
.choice{
  display:flex; align-items:flex-start; gap:12px; padding:13px 14px;
  background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
  transition:all .12s;
}
.choice:not(.locked):hover{border-color:var(--border-lit); background:#232b34;}
.choice .letter{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
  width:22px; height:22px; border-radius:5px; border:1px solid var(--border-lit);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-dim);
}
.choice .txt{font-size:14px; line-height:1.5; padding-top:2px;}
.choice.selected{border-color:var(--amber); background:rgba(255,179,0,0.08);}
.choice.selected .letter{background:var(--amber); color:#1a1300; border-color:var(--amber);}
.choice.correct{border-color:var(--green); background:rgba(76,208,125,0.09);}
.choice.correct .letter{background:var(--green); color:#0a1f0f; border-color:var(--green);}
.choice.incorrect{border-color:var(--red); background:rgba(255,92,92,0.09);}
.choice.incorrect .letter{background:var(--red); color:#2a0a0a; border-color:var(--red);}

.explain-box{margin-top:16px; padding:14px; background:var(--panel-2); border-left:3px solid var(--cyan); border-radius:0 8px 8px 0; font-size:13px; line-height:1.6; color:var(--text-dim);}
.explain-box b{color:var(--cyan);}

.player-foot{display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--border);}

/* ---------- results ---------- */
.result-hero{text-align:center; padding:24px 10px;}
.result-hero .big{font-family:'JetBrains Mono',monospace; font-size:52px; font-weight:700; line-height:1;}
.result-hero .pass{color:var(--green);}
.result-hero .fail{color:var(--red);}
.result-hero .cap{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:8px;}
.breakdown-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
.breakdown-row:last-child{border-bottom:none;}
.breakdown-name{flex:0 0 180px; font-size:12px; color:var(--text-dim);}
.breakdown-track{flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; border:1px solid var(--border);}
.breakdown-fill{height:100%; border-radius:4px;}
.breakdown-pct{flex:0 0 50px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px;}

/* ---------- lists / tables ---------- */
.item-row{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
.item-row .info{flex:1; min-width:200px;}
.item-row .title{font-size:13px; color:var(--text); margin-bottom:2px;}
.item-row .meta{font-size:11px; color:var(--text-dimmer); font-family:'JetBrains Mono',monospace;}
.miss-bar{width:60px; height:6px; background:var(--panel-3); border-radius:3px; overflow:hidden; display:inline-block; margin-left:8px; vertical-align:middle;}
.miss-fill{height:100%; background:var(--red);}

.empty-state{text-align:center; padding:40px 20px; color:var(--text-dimmer);}
.empty-state .big{font-size:32px; margin-bottom:10px;}

/* ---------- import ---------- */
textarea{
  width:100%; min-height:180px; background:var(--panel-2); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:12px; font-family:'JetBrains Mono',monospace;
  font-size:12.5px; line-height:1.6; resize:vertical;
}
textarea:focus, select:focus, input:focus{outline:1px solid var(--amber-dim);}
.file-drop{
  border:1.5px dashed var(--border-lit); border-radius:8px; padding:22px; text-align:center;
  color:var(--text-dim); font-size:12px; margin-bottom:14px; cursor:pointer; transition:all .15s;
}
.file-drop:hover{border-color:var(--amber-dim); color:var(--text);}
select{background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:12px; font-family:'Inter',sans-serif;}
.parsed-item{background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px;}
.parsed-item .pq{font-size:13px; margin-bottom:8px;}
.parsed-item .pc{font-size:12px; color:var(--text-dim); margin:2px 0;}
.parsed-item .pc.correct{color:var(--green);}
.parsed-item .prow{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px;}

.hint{font-size:11.5px; color:var(--text-dimmer); line-height:1.6; margin-top:10px;}
.hint code{background:var(--panel-3); padding:1px 5px; border-radius:4px; color:var(--cyan);}

.check-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}

@media (max-width:640px){
  .breakdown-name{flex-basis:110px; font-size:11px;}
  .topbar{flex-direction:column; align-items:flex-start; gap:8px;}
  .readout{text-align:left;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CHECKRIDE — Praxis Physics (5266) practice engine
   Original practice content only. Not affiliated with ETS.
   ============================================================ */

const CATS = {
  I:   {name:"Nature & Impact of Science", short:"Sci & Eng", weight:12, color:"#5FD3C4"},
  II:  {name:"Matter & Energy", short:"Matter/Energy", weight:15, color:"#8FD35F"},
  III: {name:"Mechanics", short:"Mechanics", weight:35, color:"#FFB300"},
  IV:  {name:"Electricity & Magnetism", short:"E&M", weight:21, color:"#FF8A5C"},
  V:   {name:"Waves", short:"Waves", weight:17, color:"#C88FFF"}
};

/* ---------- seed question bank (90 original items, ETS-weighted, not real exam content) ---------- */
const SEED = [
// ===== CATEGORY I — Nature & Impact of Science (10) =====
{cat:"I",sub:"Nature of Science",type:"single",q:"Which statement best distinguishes a scientific theory from a hypothesis?",ch:["A theory is a guess, while a hypothesis has been proven true","A hypothesis is an untested tentative explanation; a theory is a well-substantiated explanation supported by extensive evidence","Theories cannot be revised once accepted, while hypotheses can be revised freely","A hypothesis applies only to living systems, while a theory applies to physical systems"],ans:[1],exp:"In science, a hypothesis is a testable, tentative explanation. A theory is a broad, well-tested explanatory framework supported by a large body of evidence — and like all scientific claims, it remains open to revision in light of new evidence."},
{cat:"I",sub:"Nature of Science",type:"single",q:"A physics teacher asks students why scientific models are sometimes revised. Which response best reflects the nature of scientific knowledge?",ch:["Models are revised only when proven completely wrong","Models are revised as new evidence emerges that requires more accurate or complete explanations","Models are permanent once accepted by the scientific community","Models are revised based on popular vote among scientists"],ans:[1],exp:"Scientific models are provisional; they are refined or replaced as new data demand a better fit between explanation and observation."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A student measures the length of a table as 152.30 cm with a meter stick marked in millimeters. How many significant figures does this measurement contain?",ch:["3","4","5","6"],ans:[2],exp:"152.30 cm has five significant figures: the trailing zero after the decimal point is significant because it reflects the precision of the measuring instrument."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 72 km/h to meters per second.",ch:["10 m/s","20 m/s","25 m/s","30 m/s"],ans:[1],exp:"72 km/h × (1000 m/km) ÷ (3600 s/h) = 20 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A hiker walks 3.0 km east, then 4.0 km north. What is the magnitude of the hiker's total displacement?",ch:["3.0 km","4.0 km","5.0 km","7.0 km"],ans:[2],exp:"The displacement is the hypotenuse of a 3-4-5 right triangle: √(3² + 4²) = 5.0 km."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A student experimentally measures g as 9.7 m/s². The accepted value is 9.8 m/s². What is the percent error, to the nearest tenth?",ch:["0.1%","1.0%","1.2%","10%"],ans:[1],exp:"Percent error = |9.7 − 9.8| / 9.8 × 100% ≈ 1.0%."},
{cat:"I",sub:"Lab Procedures",type:"multi",selectN:2,q:"Which TWO of the following are appropriate safety practices when using a laser pointer in a classroom demonstration?",ch:["Point the laser directly at students to show reflection","Wear laser safety goggles rated for the laser's wavelength","Avoid aiming the beam toward reflective surfaces at eye level","Use the highest-power laser available for better visibility"],ans:[1,2],exp:"Lasers should never be aimed at people or at reflective surfaces near eye level, and appropriate eyewear should be worn. Higher power increases hazard, not safety."},
{cat:"I",sub:"Engineering Design",type:"single",q:"In the engineering design process, which step primarily involves identifying criteria and constraints?",ch:["Optimizing the design","Defining the problem","Testing the prototype","Communicating results"],ans:[1],exp:"Defining the problem includes establishing the criteria (what success looks like) and the constraints (limits on the solution) before design work begins."},
{cat:"I",sub:"Science, Tech & Society",type:"single",q:"Which of the following is a legitimate criticism of large-scale wind energy production, distinct from concerns about fossil fuel combustion?",ch:["Wind turbines emit large amounts of carbon dioxide during operation","Wind energy generation is intermittent and depends on local wind conditions","Wind turbines are a major contributor to ozone layer depletion","Wind energy cannot be used to generate electricity at all"],ans:[1],exp:"A central engineering challenge of wind power is intermittency — output depends on variable wind conditions, unlike dispatchable fossil-fuel generation."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A graph of an object's position versus time is a straight line with a positive, constant slope. What can be concluded?",ch:["The object is at rest","The object is accelerating uniformly","The object is moving with constant, nonzero velocity","The object is moving with decreasing speed"],ans:[2],exp:"A constant slope on a position-time graph represents constant velocity; the object covers equal displacement in equal time intervals."},

// ===== CATEGORY II — Matter & Energy (13) =====
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"In the Bohr model of the hydrogen atom, an electron emits a photon when it:",ch:["Absorbs energy and moves to a higher energy level","Transitions from a higher energy level to a lower one","Remains in the ground state indefinitely","Collides directly with the nucleus"],ans:[1],exp:"Photon emission occurs when an electron drops to a lower, more stable energy level, releasing the energy difference as a photon."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"What particle is emitted during alpha decay of a radioactive nucleus?",ch:["A helium-4 nucleus (2 protons, 2 neutrons)","A high-energy electron","A high-energy photon","A free neutron"],ans:[0],exp:"An alpha particle is identical to a helium-4 nucleus: two protons and two neutrons bound together."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"A radioactive sample has a half-life of 8 days. What fraction of the original sample remains after 32 days?",ch:["1/4","1/8","1/16","1/32"],ans:[2],exp:"32 days ÷ 8 days = 4 half-lives. Remaining fraction = (1/2)^4 = 1/16."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"Which of the following best describes nuclear fusion?",ch:["A heavy nucleus splits into two lighter nuclei, releasing energy","Two light nuclei combine to form a heavier nucleus, releasing energy","A nucleus captures a free electron, releasing energy","An electron is ejected from a metal surface, releasing energy"],ans:[1],exp:"Fusion combines light nuclei (e.g., isotopes of hydrogen) into a heavier nucleus, releasing energy because the products are more tightly bound."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"According to the photoelectric effect, increasing the intensity of light incident on a metal surface (above the threshold frequency) primarily increases:",ch:["The maximum kinetic energy of each ejected electron","The number of electrons ejected per second","The work function of the metal","The threshold frequency of the metal"],ans:[1],exp:"Intensity relates to photon count, not photon energy. More photons above threshold frequency eject more electrons per second; maximum kinetic energy depends on frequency, not intensity."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"The de Broglie wavelength of a particle is inversely proportional to its:",ch:["Mass alone","Momentum","Electric charge","Temperature"],ans:[1],exp:"λ = h/p — the de Broglie wavelength depends inversely on momentum (mass × velocity), not mass alone."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"How much heat is required to raise the temperature of 2.0 kg of water by 10°C? (c_water = 4186 J/kg·°C)",ch:["4,186 J","41,860 J","83,720 J","837,200 J"],ans:[2],exp:"Q = mcΔT = (2.0 kg)(4186 J/kg·°C)(10°C) = 83,720 J."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Which of the following processes requires energy input while the temperature of the substance remains constant?",ch:["Heating liquid water from 20°C to 50°C","Melting ice at 0°C into liquid water at 0°C","Cooling steam from 150°C to 110°C","Heating a solid metal bar with no phase change"],ans:[1],exp:"During a phase change, added energy (latent heat) goes into breaking intermolecular bonds rather than raising temperature, so temperature stays constant while melting occurs."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Absolute zero on the Celsius scale is approximately:",ch:["0°C","−100°C","−273°C","−460°C"],ans:[2],exp:"Absolute zero is 0 K, which corresponds to approximately −273.15°C."},
{cat:"II",sub:"Thermodynamics",type:"single",q:"A gas absorbs 500 J of heat and does 200 J of work on its surroundings. What is the change in the gas's internal energy?",ch:["200 J","300 J","500 J","700 J"],ans:[1],exp:"By the first law of thermodynamics, ΔU = Q − W = 500 J − 200 J = 300 J."},
{cat:"II",sub:"Thermodynamics",type:"single",q:"Which statement is consistent with the second law of thermodynamics?",ch:["The entropy of an isolated system tends to decrease over time","Heat spontaneously flows from a colder object to a hotter one","The total entropy of an isolated system never decreases over time","Energy is created in every thermodynamic process"],ans:[2],exp:"The second law states that the total entropy of an isolated system tends to increase, or at minimum stay the same for a reversible process — it never spontaneously decreases."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"A metal spoon and a wooden spoon have both been sitting in the same room for hours. The metal spoon feels colder to the touch. This is best explained by:",ch:["The metal spoon actually has a lower temperature than the wood","Metal has higher thermal conductivity, so it conducts heat away from the hand faster","Wood radiates more heat than metal at the same temperature","The metal spoon has a greater specific heat than the wood"],ans:[1],exp:"Both objects are at the same (room) temperature. The perceived difference is due to thermal conductivity: metal conducts heat away from skin much faster than wood, making it feel colder."},
{cat:"II",sub:"Atomic/Nuclear",type:"multi",selectN:2,q:"Which TWO of the following particles reside in the nucleus of an atom?",ch:["Electron","Proton","Neutron","Positron"],ans:[1,2],exp:"The nucleus contains protons and neutrons (collectively, nucleons). Electrons orbit outside the nucleus, and positrons are antimatter particles produced in certain decay processes, not standard nuclear constituents."},

// ===== CATEGORY III — Mechanics (32) =====
{cat:"III",sub:"Kinematics",type:"single",q:"A ball is thrown vertically upward with an initial speed of 20 m/s. Ignoring air resistance, how long until it returns to its starting height? (g = 10 m/s²)",ch:["1 s","2 s","4 s","8 s"],ans:[2],exp:"Time up = v/g = 2 s; total time (up and down) = 2 × 2 s = 4 s."},
{cat:"III",sub:"Kinematics",type:"single",q:"A car accelerates uniformly from rest to 30 m/s in 6 s. What distance does it travel during this time?",ch:["45 m","90 m","180 m","360 m"],ans:[1],exp:"Average velocity = (0 + 30)/2 = 15 m/s. Distance = 15 m/s × 6 s = 90 m."},
{cat:"III",sub:"Kinematics",type:"single",q:"On a velocity-versus-time graph, which feature represents the object's acceleration?",ch:["The area under the curve","The slope of the line","The y-intercept","The x-intercept"],ans:[1],exp:"Slope = Δv/Δt, which is the definition of acceleration. The area under a v-t graph instead gives displacement."},
{cat:"III",sub:"Kinematics",type:"single",q:"A projectile is launched at 30 m/s at 37° above horizontal (sin 37° ≈ 0.6, cos 37° ≈ 0.8). What is the initial vertical velocity component?",ch:["6 m/s","18 m/s","24 m/s","30 m/s"],ans:[1],exp:"v_y = v·sinθ = 30 × 0.6 = 18 m/s."},
{cat:"III",sub:"Kinematics",type:"single",q:"A boat heads directly across a river at 4 m/s relative to the water, while the current flows at 3 m/s downstream. What is the boat's speed relative to the shore?",ch:["1 m/s","3 m/s","5 m/s","7 m/s"],ans:[2],exp:"The velocities are perpendicular, so resultant speed = √(4² + 3²) = 5 m/s."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"An object moves at constant velocity in a straight line. What can be concluded about the net force acting on it?",ch:["The net force is in the direction of motion","The net force is zero","The net force is increasing over time","The net force opposes the motion"],ans:[1],exp:"By Newton's first law, constant velocity (no acceleration) means the net force on the object is zero."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"A 5 kg object experiences a net force of 20 N. What is its acceleration?",ch:["0.25 m/s²","4 m/s²","15 m/s²","25 m/s²"],ans:[1],exp:"a = F/m = 20 N / 5 kg = 4 m/s²."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"According to Newton's third law, if a book pushes down on a table with force F, the table pushes up on the book with:",ch:["A force less than F","A force equal to F, in the opposite direction","A force greater than F","No force at all"],ans:[1],exp:"Newton's third law: for every action force there is a reaction force equal in magnitude and opposite in direction, acting on the other object."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"An elevator accelerates upward at 2 m/s². A 70 kg passenger stands on a scale inside. What does the scale read? (g = 10 m/s²)",ch:["700 N","714 N","840 N","980 N"],ans:[2],exp:"Normal force N = m(g + a) = 70 kg × (10 + 2) m/s² = 840 N."},
{cat:"III",sub:"Newton's Laws",type:"single",q:"A passenger in an accelerating train observes a ball roll toward the back of the train with no applied force, in the train's own frame of reference. Which statement best explains this?",ch:["The train's frame is non-inertial, so a fictitious force appears to act on the ball","Newton's laws only apply outside moving vehicles","The ball briefly has negative mass in this frame","Air resistance pushes the ball backward"],ans:[0],exp:"In an accelerating (non-inertial) reference frame, objects appear to experience a fictitious force opposite the frame's acceleration, even though no real force acts on them."},
{cat:"III",sub:"Gravitation",type:"single",q:"Two masses are separated by a distance r, exerting gravitational force F on each other. If the distance is doubled, the new force is:",ch:["F/4","F/2","2F","4F"],ans:[0],exp:"Gravitational force follows an inverse-square law: F ∝ 1/r². Doubling r reduces the force to F/4."},
{cat:"III",sub:"Gravitation",type:"single",q:"A satellite orbits Earth at radius R. If the orbital radius is increased, the satellite's orbital speed:",ch:["Increases","Decreases","Stays the same","Depends only on the satellite's mass"],ans:[1],exp:"Orbital speed v = √(GM/R). As R increases, orbital speed decreases."},
{cat:"III",sub:"Gravitation",type:"single",q:"Planet X orbits its star at a radius 4 times that of Earth's orbit around the Sun. Approximately how many Earth years does one orbit of Planet X take?",ch:["4 years","8 years","16 years","64 years"],ans:[1],exp:"By Kepler's third law, T² ∝ R³. With R = 4, R³ = 64, so T = √64 = 8 years."},
{cat:"III",sub:"Gravitation",type:"single",q:"An astronaut has a mass of 80 kg on Earth. On the Moon, where gravity is about 1/6 of Earth's, the astronaut's mass is:",ch:["80 kg","13.3 kg","480 kg","0 kg, since mass is a form of weight"],ans:[0],exp:"Mass is an intrinsic property of matter and does not change with location; only weight (the gravitational force on that mass) changes."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A car rounds a curve at constant speed. In what direction does the net (centripetal) force point?",ch:["Tangent to the path of motion","Outward, away from the center of the curve","Toward the center of the curve","The net force is zero since speed is constant"],ans:[2],exp:"Centripetal force always points toward the center of the circular path, even when speed is constant, because direction (and thus velocity) is still changing."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"A 2 kg object moves in a circle of radius 0.5 m at a constant speed of 4 m/s. What is the magnitude of the centripetal force?",ch:["8 N","16 N","32 N","64 N"],ans:[3],exp:"F_c = mv²/r = (2 kg)(4 m/s)² / 0.5 m = 2 × 16 / 0.5 = 64 N."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"On a mass-spring system undergoing simple harmonic motion, doubling the mass (with the same spring constant) causes the period to:",ch:["Increase by a factor of 2","Increase by a factor of √2","Decrease by a factor of √2","Remain unchanged"],ans:[1],exp:"T = 2π√(m/k). Doubling m multiplies T by √2."},
{cat:"III",sub:"Circular & Harmonic Motion",type:"single",q:"For a simple pendulum undergoing small-angle oscillations, the restoring force is provided primarily by:",ch:["Tension in the string alone","The component of gravity tangent to the arc of motion","Air resistance","The normal force from the pivot point"],ans:[1],exp:"The tangential component of gravity along the arc pulls the pendulum bob back toward equilibrium; tension acts along the string (centripetal direction) and does no tangential work."},
{cat:"III",sub:"Energy & Work",type:"single",q:"A 10 kg box is lifted 2 m at constant velocity. How much work is done against gravity? (g = 10 m/s²)",ch:["20 J","100 J","200 J","2000 J"],ans:[2],exp:"W = mgh = (10 kg)(10 m/s²)(2 m) = 200 J."},
{cat:"III",sub:"Energy & Work",type:"single",q:"A 0.5 kg ball is dropped from a height of 5 m. Ignoring air resistance, what is its speed just before hitting the ground? (g = 10 m/s²)",ch:["5 m/s","7.1 m/s","10 m/s","100 m/s"],ans:[2],exp:"By conservation of energy, v = √(2gh) = √(2 × 10 × 5) = √100 = 10 m/s."},
{cat:"III",sub:"Energy & Work",type:"single",q:"A motor performs 6000 J of work in 3 seconds. What is its power output?",ch:["500 W","2000 W","3000 W","18000 W"],ans:[1],exp:"P = W/t = 6000 J / 3 s = 2000 W."},
{cat:"III",sub:"Energy & Work",type:"single",q:"As a bungee jumper falls from the platform toward the lowest point of the fall (ignoring air resistance), gravitational potential energy is primarily converted into:",ch:["Kinetic energy only, for the entire fall","Kinetic energy, and then increasingly into elastic potential energy of the cord as it stretches","Thermal energy only","Electrical energy"],ans:[1],exp:"Early in the fall, PE converts mostly to KE. Once the cord begins to stretch, energy increasingly transfers into elastic potential energy stored in the cord as it decelerates the jumper."},
{cat:"III",sub:"Momentum",type:"single",q:"A 3 kg cart moving at 4 m/s collides with and sticks to a stationary 1 kg cart. What is their combined velocity immediately after the collision?",ch:["1 m/s","3 m/s","4 m/s","12 m/s"],ans:[1],exp:"Conservation of momentum: (3 kg)(4 m/s) = (4 kg)(v_f), so v_f = 12/4 = 3 m/s."},
{cat:"III",sub:"Momentum",type:"single",q:"Which of the following is conserved in BOTH elastic and inelastic collisions within an isolated system?",ch:["Kinetic energy only","Momentum only","Both momentum and kinetic energy","Neither momentum nor kinetic energy"],ans:[1],exp:"Momentum is conserved in all collisions within an isolated system. Kinetic energy is conserved only in elastic collisions."},
{cat:"III",sub:"Momentum",type:"single",q:"A 0.2 kg ball moving at 6 m/s is struck and reverses direction, moving away at 4 m/s. What is the magnitude of the impulse delivered to the ball?",ch:["0.4 kg·m/s","1.0 kg·m/s","2.0 kg·m/s","2.0 N"],ans:[2],exp:"Impulse = Δp = m(v_f − v_i) = 0.2 kg × (−4 − 6) m/s = −2.0 kg·m/s; magnitude = 2.0 kg·m/s."},
{cat:"III",sub:"Momentum",type:"single",q:"For an isolated system with no external forces, the velocity of the system's center of mass:",ch:["Always increases","Always decreases","Remains constant","Oscillates over time"],ans:[2],exp:"With no external net force, the total momentum of the system is conserved, so the center of mass moves at constant velocity (or remains at rest)."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"A spinning ice skater pulls her arms inward. What happens to her angular velocity and rotational kinetic energy?",ch:["Both increase","Both decrease","Angular velocity increases; kinetic energy also increases due to work done pulling her arms in","Angular velocity increases; kinetic energy decreases"],ans:[2],exp:"With angular momentum conserved, a smaller moment of inertia means a larger angular velocity. Because the skater does work pulling her arms inward against the effective outward tendency, rotational kinetic energy actually increases."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"A force of 10 N is applied perpendicular to a wrench at a distance of 0.3 m from the bolt. What is the resulting torque?",ch:["0.3 N·m","3 N·m","10 N·m","30 N·m"],ans:[1],exp:"τ = F × r = 10 N × 0.3 m = 3 N·m."},
{cat:"III",sub:"Rotational Motion",type:"single",q:"For an extended rigid object to be in static equilibrium, which condition(s) must be satisfied?",ch:["Net force must be zero only","Net torque must be zero only","Both net force and net torque must be zero","Neither must be zero if the object is symmetric"],ans:[2],exp:"Static equilibrium requires that both the net force (ΣF = 0) and the net torque (Στ = 0) acting on the object are zero."},
{cat:"III",sub:"Fluids",type:"single",q:"An object floats with 60% of its volume submerged in water (density 1000 kg/m³). What is the density of the object?",ch:["400 kg/m³","600 kg/m³","1000 kg/m³","1600 kg/m³"],ans:[1],exp:"For a floating object, the fraction submerged equals the ratio of object density to fluid density: 0.60 × 1000 kg/m³ = 600 kg/m³."},
{cat:"III",sub:"Fluids",type:"single",q:"According to Bernoulli's principle, as the speed of a fluid increases, the pressure within the fluid:",ch:["Increases","Decreases","Remains unchanged","Becomes zero"],ans:[1],exp:"Bernoulli's principle states that for an ideal fluid, an increase in flow speed corresponds to a decrease in pressure (at the same elevation)."},
{cat:"III",sub:"Friction",type:"single",q:"A 4 kg box slides on a horizontal floor with a coefficient of kinetic friction of 0.25. What is the magnitude of the kinetic friction force? (g = 10 m/s²)",ch:["1 N","2.5 N","10 N","40 N"],ans:[2],exp:"f = μ·N = μ·mg = 0.25 × 4 kg × 10 m/s² = 10 N."},

// ===== CATEGORY IV — Electricity & Magnetism (19) =====
{cat:"IV",sub:"Electrostatics",type:"single",q:"Two point charges +q and −q attract each other with force F at separation r. If both charge magnitudes are tripled while r stays fixed, the new force is:",ch:["F","3F","9F","F/9"],ans:[2],exp:"Coulomb's law: F ∝ q₁q₂. Tripling both charges multiplies the force by 3 × 3 = 9."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"Two charges separated by 2 m exert a force of 8 N on each other. If the separation is increased to 4 m, what is the new force?",ch:["2 N","4 N","8 N","16 N"],ans:[0],exp:"F ∝ 1/r². Doubling the distance reduces the force by a factor of 4: 8 N / 4 = 2 N."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"Electric field lines around a single, isolated positive point charge point:",ch:["Toward the charge","Away from the charge","Parallel to each other","In circles around the charge"],ans:[1],exp:"By convention, electric field lines point away from positive charges (in the direction a positive test charge would be pushed) and toward negative charges."},
{cat:"IV",sub:"Electrostatics",type:"single",q:"Two like charges are brought closer together. The electric potential energy of the system:",ch:["Increases","Decreases","Remains zero","Remains constant"],ans:[0],exp:"Work must be done against the repulsive force to bring like charges closer together, which increases the system's stored electric potential energy."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 6-ohm resistor is connected to a 12 V battery. What current flows through it?",ch:["0.5 A","2 A","6 A","72 A"],ans:[1],exp:"By Ohm's law, I = V/R = 12 V / 6 Ω = 2 A."},
{cat:"IV",sub:"Circuits",type:"single",q:"A 3-ohm and a 6-ohm resistor are connected in series to a 9 V battery. What is the total current in the circuit?",ch:["0.5 A","1 A","3 A","9 A"],ans:[1],exp:"Series resistance adds: R_total = 3 + 6 = 9 Ω. I = V/R = 9 V / 9 Ω = 1 A."},
{cat:"IV",sub:"Circuits",type:"single",q:"Two 4-ohm resistors are connected in parallel. What is the equivalent resistance?",ch:["1 ohm","2 ohms","4 ohms","8 ohms"],ans:[1],exp:"For equal parallel resistors, R_eq = R/n = 4 Ω / 2 = 2 Ω."},
{cat:"IV",sub:"Circuits",type:"single",q:"A resistor carries a current of 3 A when connected to a 12 V source. What power does it dissipate?",ch:["4 W","9 W","15 W","36 W"],ans:[3],exp:"P = IV = 3 A × 12 V = 36 W."},
{cat:"IV",sub:"Circuits",type:"multi",selectN:2,q:"Which TWO of the following materials are good electrical conductors at room temperature?",ch:["Copper","Rubber","Silver","Glass"],ans:[0,2],exp:"Copper and silver are metals with loosely bound valence electrons, making them excellent conductors. Rubber and glass are electrical insulators."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two capacitors, 2 µF and 4 µF, are connected in parallel. What is the equivalent capacitance?",ch:["1.33 µF","2 µF","4 µF","6 µF"],ans:[3],exp:"Capacitors in parallel add directly: C_eq = 2 µF + 4 µF = 6 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Two identical 6 µF capacitors are connected in series. What is the equivalent capacitance?",ch:["3 µF","6 µF","12 µF","36 µF"],ans:[0],exp:"For equal series capacitors, C_eq = C/n = 6 µF / 2 = 3 µF."},
{cat:"IV",sub:"Capacitance",type:"single",q:"Inserting a dielectric material between the plates of a parallel-plate capacitor (with charge held constant) causes the capacitance to:",ch:["Decrease","Increase","Remain the same","Become zero"],ans:[1],exp:"A dielectric reduces the effective electric field between the plates for a given charge, which increases capacitance (C = Q/V, and V decreases)."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A positive charge moves to the right through a magnetic field pointing into the page. Using the right-hand rule, the magnetic force on the charge points:",ch:["Up","Down","Into the page","Out of the page"],ans:[0],exp:"F = qv × B. With v to the right and B into the page, the cross product v × B points upward (toward the top of the page) for a positive charge."},
{cat:"IV",sub:"Magnetism",type:"single",q:"Two long, parallel wires carry current in the same direction. The wires will:",ch:["Repel each other","Attract each other","Exert no force on each other","Rotate perpendicular to each other"],ans:[1],exp:"Parallel currents flowing in the same direction attract each other; currents in opposite directions repel."},
{cat:"IV",sub:"Magnetism",type:"single",q:"A charge of 2 C moves at 5 m/s perpendicular to a 0.4 T magnetic field. What is the magnitude of the magnetic force on the charge?",ch:["0.4 N","1 N","4 N","10 N"],ans:[2],exp:"F = qvB = (2 C)(5 m/s)(0.4 T) = 4 N."},
{cat:"IV",sub:"Magnetism",type:"single",q:"Which of the following creates a magnetic field?",ch:["A stationary point charge only","A moving charge or an electric current","A charge at absolute rest in a vacuum","An uncharged, stationary object"],ans:[1],exp:"Magnetic fields are produced by moving charges (currents). A stationary charge produces only an electric field."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A bar magnet is pushed into a coil of wire, inducing a current. According to Lenz's law, the direction of the induced current opposes:",ch:["The resistance of the wire","The change in magnetic flux through the coil","The direction of the magnet's velocity only","Gravity"],ans:[1],exp:"Lenz's law states that the induced current flows in the direction that opposes the change in magnetic flux that caused it."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A generator converts mechanical energy into electrical energy through which process?",ch:["Electrostatic induction","Electromagnetic induction","Thermal conduction","The photoelectric effect"],ans:[1],exp:"Generators rotate a coil within a magnetic field (or vice versa), inducing an EMF via electromagnetic induction (Faraday's law)."},
{cat:"IV",sub:"EM Induction",type:"single",q:"A 0.5 m conducting rod moves at 4 m/s perpendicular to a 0.2 T magnetic field. What EMF is induced across the rod?",ch:["0.1 V","0.4 V","1.0 V","4.0 V"],ans:[1],exp:"Motional EMF = BLv = (0.2 T)(0.5 m)(4 m/s) = 0.4 V."},

// ===== CATEGORY V — Waves (16) =====
{cat:"V",sub:"Wave Properties",type:"single",q:"A wave has a wavelength of 2 m and a frequency of 5 Hz. What is its speed?",ch:["0.4 m/s","2.5 m/s","7 m/s","10 m/s"],ans:[3],exp:"v = λf = 2 m × 5 Hz = 10 m/s."},
{cat:"V",sub:"Wave Properties",type:"single",q:"Sound waves traveling through air are classified as:",ch:["Transverse waves","Longitudinal waves","Electromagnetic waves","Standing waves only"],ans:[1],exp:"Sound propagates through compressions and rarefactions of the medium parallel to the direction of travel, making it a longitudinal wave."},
{cat:"V",sub:"Wave Properties",type:"single",q:"A standing wave on a string is formed by:",ch:["A single wave traveling in one direction only","The superposition of two waves of the same frequency traveling in opposite directions","Two waves of different frequencies traveling in the same direction","A wave reflecting off a moving boundary only"],ans:[1],exp:"Standing waves result from the interference of two identical waves traveling in opposite directions, typically from a wave and its reflection."},
{cat:"V",sub:"Wave Properties",type:"single",q:"If the amplitude of a wave is doubled, the energy transported by the wave (per unit time) is multiplied by a factor of:",ch:["2","4","8","16"],ans:[1],exp:"Wave energy is proportional to the square of the amplitude, so doubling amplitude quadruples the energy."},
{cat:"V",sub:"Sound",type:"single",q:"The pitch of a sound is most closely associated with its:",ch:["Amplitude","Frequency","Speed","Wavelength, regardless of medium"],ans:[1],exp:"Pitch is the perceptual correlate of frequency: higher frequency is perceived as higher pitch."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 100 Hz. What is the frequency of the next higher harmonic it can produce?",ch:["150 Hz","200 Hz","300 Hz","400 Hz"],ans:[2],exp:"A pipe closed at one end supports only odd harmonics (1st, 3rd, 5th...). The next harmonic after the fundamental (1st) is the 3rd: 3 × 100 Hz = 300 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two tuning forks with frequencies of 440 Hz and 444 Hz are struck simultaneously. What beat frequency is heard?",ch:["2 Hz","4 Hz","442 Hz","884 Hz"],ans:[1],exp:"Beat frequency equals the absolute difference between the two frequencies: |444 − 440| = 4 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"As an ambulance with its siren sounding approaches a stationary observer, the observer hears a frequency that is:",ch:["Lower than the source frequency","Higher than the source frequency","The same as the source frequency","Inaudible due to destructive interference"],ans:[1],exp:"By the Doppler effect, when a source approaches an observer, the observed frequency increases (wavefronts are compressed)."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Which of the following lists electromagnetic waves in order of increasing frequency?",ch:["Radio, visible, gamma ray","Gamma ray, visible, radio","Visible, radio, gamma ray","Radio, gamma ray, visible"],ans:[0],exp:"In order of increasing frequency (and decreasing wavelength): radio, microwave, infrared, visible, ultraviolet, X-ray, gamma ray."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"In a vacuum, which color of visible light travels fastest?",ch:["Red","Blue","Violet","All colors travel at the same speed in a vacuum"],ans:[3],exp:"In a vacuum, all electromagnetic waves — regardless of frequency or color — travel at the same speed, c ≈ 3 × 10⁸ m/s. Dispersion by wavelength occurs only in a medium."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"The redshift of light from distant galaxies is an application of which phenomenon?",ch:["Diffraction","The Doppler effect","Total internal reflection","Polarization"],ans:[1],exp:"Redshift results from the relative recession of distant galaxies, stretching light to longer wavelengths — a Doppler-effect analog for electromagnetic waves."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 40 cm in front of a converging lens with a focal length of 10 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["8 cm","13.3 cm","20 cm","40 cm"],ans:[1],exp:"1/dᵢ = 1/f − 1/dₒ = 1/10 − 1/40 = 3/40, so dᵢ = 40/3 ≈ 13.3 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A concave mirror forms what type of image when the object is placed beyond the center of curvature?",ch:["Virtual, upright, magnified","Real, inverted, reduced","Virtual, inverted, reduced","Real, upright, magnified"],ans:[1],exp:"For an object beyond the center of curvature of a concave mirror, the image forms between the focal point and the center of curvature: real, inverted, and reduced."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"Light travels from water into air at an angle to the normal. What happens to the ray?",ch:["It bends toward the normal","It bends away from the normal","It continues in a straight line, unaffected","It reverses direction"],ans:[1],exp:"Going from a denser medium (water) to a less dense medium (air), light speeds up and bends away from the normal, per Snell's law."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"In Young's double-slit experiment, bright fringes occur where:",ch:["Waves from the two slits arrive out of phase and destructively interfere","Waves from the two slits arrive in phase and constructively interfere","Only one slit contributes light to that point","The path difference equals a quarter wavelength"],ans:[1],exp:"Bright (constructive interference) fringes occur where the path difference between the two slits is a whole number of wavelengths, so the waves arrive in phase."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"The sky appears blue primarily because of:",ch:["Absorption of blue light by atmospheric ozone","Rayleigh scattering, which scatters shorter (blue) wavelengths more than longer wavelengths","Reflection of blue light off the ocean","The Doppler effect caused by Earth's rotation"],ans:[1],exp:"Rayleigh scattering by air molecules scatters shorter (blue/violet) wavelengths of sunlight much more strongly than longer (red) wavelengths, giving the sky its blue color."},

{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 90 km/h to meters per second.",ch:["90 m/s","50 m/s","12.5 m/s","25 m/s"],ans:[3],exp:"90 km/h × (1000 m/km) ÷ (3600 s/h) = 25 m/s."},

{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 126 km/h to meters per second.",ch:["70 m/s","126 m/s","35 m/s","17.5 m/s"],ans:[2],exp:"126 km/h × (1000 m/km) ÷ (3600 s/h) = 35 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 144 km/h to meters per second.",ch:["144 m/s","20 m/s","40 m/s","80 m/s"],ans:[2],exp:"144 km/h × (1000 m/km) ÷ (3600 s/h) = 40 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 18 km/h to meters per second.",ch:["5 m/s","10 m/s","18 m/s","2.5 m/s"],ans:[0],exp:"18 km/h × (1000 m/km) ÷ (3600 s/h) = 5 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 27 km/h to meters per second.",ch:["15 m/s","3.75 m/s","7.5 m/s","27 m/s"],ans:[2],exp:"27 km/h × (1000 m/km) ÷ (3600 s/h) = 7.5 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 81 km/h to meters per second.",ch:["11.25 m/s","45 m/s","81 m/s","22.5 m/s"],ans:[3],exp:"81 km/h × (1000 m/km) ÷ (3600 s/h) = 22.5 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 99 km/h to meters per second.",ch:["13.75 m/s","99 m/s","27.5 m/s","55 m/s"],ans:[2],exp:"99 km/h × (1000 m/km) ÷ (3600 s/h) = 27.5 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 117 km/h to meters per second.",ch:["65 m/s","16.25 m/s","117 m/s","32.5 m/s"],ans:[3],exp:"117 km/h × (1000 m/km) ÷ (3600 s/h) = 32.5 m/s."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Convert 135 km/h to meters per second.",ch:["37.5 m/s","135 m/s","18.75 m/s","75 m/s"],ans:[0],exp:"135 km/h × (1000 m/km) ÷ (3600 s/h) = 37.5 m/s."},

{cat:"I",sub:"Nature of Science",type:"single",q:"A scientific law differs from a scientific theory primarily in that a law:",ch:["Is always true and can never be revised, unlike a theory","Describes a consistent pattern or relationship in nature (often mathematically) without necessarily explaining why it occurs, while a theory provides the underlying explanation","Is a guess that has not yet been tested","Applies only to biology, while theories apply only to physics"],ans:[1],exp:"A scientific law typically describes a repeatable pattern or relationship (e.g., Newton's law of gravitation gives a formula), whereas a theory provides a broader explanatory framework for why that pattern exists."},
{cat:"I",sub:"Nature of Science",type:"single",q:"Which best describes the role of peer review in the scientific process?",ch:["It guarantees a study's conclusions are permanently correct","It allows other experts to evaluate the methodology and evidence before findings are widely accepted","It is required only for physics research, not other sciences","It replaces the need for reproducibility"],ans:[1],exp:"Peer review subjects research to scrutiny by other experts in the field, helping catch errors and evaluate methodology before publication, though it does not guarantee permanent correctness."},
{cat:"I",sub:"Nature of Science",type:"single",q:"Two independent labs perform the same experiment under the same conditions and obtain very similar results. This best demonstrates which feature of scientific knowledge?",ch:["Falsifiability","Reproducibility","Subjectivity","Permanence"],ans:[1],exp:"Reproducibility -- the ability of independent researchers to obtain consistent results using the same methods -- strengthens confidence in a scientific finding."},
{cat:"I",sub:"Nature of Science",type:"single",q:"A scientific claim that cannot, even in principle, be tested or shown to be false is best described as:",ch:["A robust theory","Not falsifiable, and therefore outside the scope of empirical science","A well-supported law","An engineering constraint"],ans:[1],exp:"For a claim to be considered scientific, it must be falsifiable -- there must be some possible observation or experiment that could show it to be false."},
{cat:"I",sub:"Nature of Science",type:"single",q:"A researcher publishes surprising results, but other scientists cannot replicate them despite following the same procedure. What is the most appropriate scientific response?",ch:["Accept the original results because they were published first","Treat the original results with skepticism until the discrepancy is understood","Assume the replicating scientists made a mistake without further investigation","Discard the scientific method for that topic"],ans:[1],exp:"When results cannot be reproduced, the scientific community treats the original claim with appropriate skepticism and investigates the discrepancy rather than accepting it outright."},
{cat:"I",sub:"Engineering Design",type:"single",q:"During the 'test and evaluate' phase of the engineering design process, engineers primarily:",ch:["Brainstorm as many possible solutions as they can","Build a prototype and assess how well it meets the original criteria and constraints","Communicate the final design to the public","Identify the problem to be solved"],ans:[1],exp:"Testing and evaluating involves building and assessing a prototype against the criteria and constraints established when the problem was defined."},
{cat:"I",sub:"Engineering Design",type:"single",q:"In engineering design, a 'constraint' refers to:",ch:["A measure of how well a solution meets its goals","A limitation on the design, such as cost, available materials, or size","The final tested prototype","A brainstorming technique"],ans:[1],exp:"Constraints are limits placed on a design solution (e.g., budget, materials, size, time) that any viable solution must work within."},
{cat:"I",sub:"Engineering Design",type:"single",q:"Why do engineers often build and test multiple prototypes rather than a single final design?",ch:["Because the design process is iterative, and testing reveals weaknesses that can be corrected in later versions","Because building only one prototype is against safety regulations","Because clients require a minimum number of prototypes","Because it is required for a patent"],ans:[0],exp:"The engineering design process is iterative: each prototype is tested, and results inform improvements in subsequent versions."},
{cat:"I",sub:"Engineering Design",type:"single",q:"Which of the following is an example of a design trade-off?",ch:["Choosing a lighter material for a bridge that is also less strong, requiring a balance between weight and strength","Following a step-by-step instruction manual exactly","Measuring a bridge's length with a tape measure","Publishing the design in a journal"],ans:[0],exp:"A trade-off occurs when improving one design criterion (e.g., reducing weight) comes at the cost of another (e.g., strength), requiring engineers to balance competing goals."},
{cat:"I",sub:"Engineering Design",type:"single",q:"A team is designing a solar-powered water pump for a remote village. Which of the following is most likely a criterion (a measure of success) rather than a constraint (a limitation)?",ch:["The budget cannot exceed $500","The pump must move at least 20 liters of water per minute","Only locally available materials may be used","The device must be assembled within one week"],ans:[1],exp:"A criterion defines what a successful solution must achieve (e.g., pumping a minimum amount of water); a constraint limits how the solution can be built (budget, materials, time)."},
{cat:"I",sub:"Lab Procedures",type:"single",q:"A student is about to heat a test tube containing a liquid over a Bunsen burner. Which practice is safest?",ch:["Point the open end of the test tube toward classmates so they can observe","Point the open end of the test tube away from anyone, including themselves, and heat gently while moving it slightly","Seal the test tube tightly before heating","Hold the test tube directly in the hottest part of the flame without moving it"],ans:[1],exp:"Test tubes should never be pointed at anyone during heating, and gentle, even heating with slight motion helps prevent sudden boiling and spattering."},
{cat:"I",sub:"Lab Procedures",type:"single",q:"Before beginning any laboratory activity involving chemicals, students should first:",ch:["Taste a small amount to identify the substance","Read the safety data and instructions and put on appropriate personal protective equipment","Mix all available chemicals to observe reactions","Skip safety goggles if the activity seems simple"],ans:[1],exp:"Reviewing safety information and wearing appropriate PPE (such as goggles) before beginning is a fundamental laboratory safety practice."},
{cat:"I",sub:"Lab Procedures",type:"single",q:"A glass beaker used for heating cracks after being removed from a hot plate and placed on a cold, wet lab bench. This is best explained by:",ch:["Chemical reaction between glass and water","Thermal shock caused by rapid, uneven contraction from the sudden temperature change","The beaker being defective from manufacturing","Static electricity"],ans:[1],exp:"Rapid temperature changes can cause different parts of the glass to expand or contract at different rates, creating stress that cracks the glass -- known as thermal shock."},
{cat:"I",sub:"Lab Procedures",type:"single",q:"Which of the following is the most appropriate way to dispose of a broken mercury thermometer in a school laboratory?",ch:["Sweep it into a regular trash can","Follow the school's hazardous material protocol and notify a teacher or safety officer immediately","Rinse it down a sink drain","Leave it for the next class to handle"],ans:[1],exp:"Mercury is a hazardous material; spills or broken mercury thermometers require immediate teacher notification and proper hazardous-material handling, not disposal in regular trash or down a drain."},
{cat:"I",sub:"Science, Tech & Society",type:"single",q:"Which of the following best describes a genuine engineering trade-off involved in adopting solar photovoltaic panels for home electricity?",ch:["Solar panels produce electricity with zero cost or resource use at any stage","Solar panels have high upfront installation cost but low ongoing fuel cost and no direct emissions during operation","Solar panels work equally well day and night","Solar panels never require any maintenance or replacement"],ans:[1],exp:"A realistic engineering trade-off with solar power is a relatively high upfront cost balanced against low operating costs and no direct emissions once installed -- unlike claims of zero cost or resource use."},
{cat:"I",sub:"Science, Tech & Society",type:"single",q:"A city is deciding between building a natural gas power plant and a large-scale wind farm. Which statement reflects an accurate, balanced comparison?",ch:["Wind farms have zero environmental impact of any kind, while gas plants have significant impact","Gas plants provide more consistent, dispatchable power, while wind farms produce variable power dependent on weather but emit no combustion byproducts during operation","Natural gas plants never produce carbon dioxide","Wind farms can generate electricity regardless of wind conditions"],ans:[1],exp:"Fossil-fuel plants can generally provide steady, on-demand ('dispatchable') power, while wind is intermittent and weather-dependent but does not directly emit combustion byproducts during operation -- a genuine trade-off engineers and policymakers must weigh."},
{cat:"I",sub:"Science, Tech & Society",type:"single",q:"Which of the following is a valid scientific and engineering concern associated with large-scale hydroelectric dams?",ch:["They cannot generate any usable electricity","They may disrupt river ecosystems and fish migration patterns","They produce more air pollution per kilowatt-hour than coal plants","They require constant fossil fuel input to operate"],ans:[1],exp:"While hydroelectric power avoids direct combustion emissions, a well-documented engineering and ecological concern is the disruption of river ecosystems, sediment flow, and fish migration caused by dam construction."},
{cat:"I",sub:"Science, Tech & Society",type:"single",q:"A new technology reduces the cost of a manufacturing process but increases the amount of a particular industrial byproduct released into a river. This scenario best illustrates:",ch:["A situation with no trade-offs, since cost was reduced","A trade-off between economic benefit and potential environmental cost, which policymakers and engineers must weigh","Proof that all new technology is harmful","An example of basic scientific research"],ans:[1],exp:"Real-world applications of science and technology frequently involve trade-offs between benefits (like reduced cost) and potential costs (like environmental impact) that must be weighed by engineers and policymakers."},

{cat:"I",sub:"Nature of Science",type:"single",q:"A student proposes an explanation for an observed pattern, then designs an experiment specifically intended to see whether the explanation could be proven wrong. This approach best reflects:",ch:["Confirmation bias","The principle of falsifiability central to the scientific method","A flawed experimental design","An engineering constraint"],ans:[1],exp:"Actively designing experiments capable of disproving a hypothesis (rather than only seeking confirming evidence) reflects the falsifiability principle central to sound scientific method."},
{cat:"I",sub:"Nature of Science",type:"single",q:"Which of the following is most clearly an example of a controlled experiment?",ch:["Observing whether it rains more on days when a specific bird species is seen","Testing plant growth under different light levels while keeping water, soil, and temperature the same across all groups","Surveying students about their favorite subject","Reading about someone else's past experiment"],ans:[1],exp:"A controlled experiment isolates one independent variable (light level) while holding other variables (water, soil, temperature) constant, allowing a clear causal comparison."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A measuring instrument consistently reads 2.0 units higher than the true value on every trial. This is an example of:",ch:["Random error","Systematic error","Human error only","No error at all"],ans:[1],exp:"A consistent offset in the same direction on every measurement is systematic error, often caused by a miscalibrated instrument, distinct from random fluctuations (random error)."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"Which best distinguishes precision from accuracy in measurement?",ch:["They mean exactly the same thing","Precision refers to how close repeated measurements are to each other; accuracy refers to how close a measurement is to the true value","Precision refers to the true value; accuracy refers to repeatability","Neither term applies to physics measurements"],ans:[1],exp:"Precision describes the consistency (closeness) of repeated measurements to one another, while accuracy describes how close a measurement is to the actual, true value -- a measurement can be precise without being accurate, or vice versa."},
{cat:"I",sub:"Engineering Design",type:"single",q:"After testing a prototype and finding it fails to meet one criterion, the most appropriate next step in the engineering design process is typically to:",ch:["Abandon the entire project","Redesign or modify the prototype based on the test results, then test again","Ignore the failed criterion and proceed to manufacturing","Publish the design as final"],ans:[1],exp:"The engineering design process is iterative: failed criteria inform redesign, and the improved prototype is tested again, repeating until the design meets its criteria and constraints."},
{cat:"I",sub:"Data & Measurement",type:"single",q:"A student repeats a measurement five times and gets very consistent values, but all of them differ substantially from the accepted true value. This measurement set is best described as:",ch:["Accurate but not precise","Precise but not accurate","Both accurate and precise","Neither accurate nor precise"],ans:[1],exp:"Consistent (tightly clustered) results indicate high precision, but a systematic offset from the true value indicates poor accuracy -- so the measurements are precise but not accurate."},

{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"During beta-minus decay, a neutron in the nucleus transforms into a proton while emitting:",ch:["An alpha particle and a gamma ray","An electron (beta particle) and an antineutrino","A photon only","A free neutron"],ans:[1],exp:"In beta-minus decay, a neutron converts into a proton, emitting a high-energy electron (the beta particle) and an antineutrino."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"Which type of nuclear radiation has the greatest penetrating power through matter?",ch:["Alpha particles","Beta particles","Gamma rays","All three penetrate matter equally"],ans:[2],exp:"Gamma rays are high-energy electromagnetic radiation with the greatest penetrating power, often requiring thick lead or concrete shielding, compared to alpha (stopped by paper) or beta (stopped by a few mm of aluminum)."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"An atom's mass number represents:",ch:["The number of protons only","The number of protons plus neutrons in the nucleus","The number of electrons in neutral orbit","The atomic charge"],ans:[1],exp:"Mass number (A) is the total count of protons and neutrons (nucleons) in the nucleus."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"Two atoms of the same element that have different numbers of neutrons are called:",ch:["Ions","Isotopes","Isomers","Allotropes"],ans:[1],exp:"Isotopes are atoms of the same element (same proton number) with differing neutron numbers, and therefore different mass numbers."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"An atom that has lost two electrons will have an overall charge of:",ch:["+1","-1","+2","-2"],ans:[2],exp:"Losing two negatively charged electrons leaves the atom with a net charge of +2, since the proton count (positive charge) now exceeds the electron count by two."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"In a chain reaction inside a nuclear fission reactor, control rods are used primarily to:",ch:["Absorb excess neutrons and regulate the reaction rate","Increase the number of neutrons produced","Cool the reactor water","Convert mass directly into electricity"],ans:[0],exp:"Control rods are made of neutron-absorbing material and are inserted or withdrawn to regulate how many neutrons are available to sustain the chain reaction, controlling reactor power."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"Which of the following correctly compares nuclear fission and nuclear fusion?",ch:["Both split heavy nuclei into lighter ones","Fission splits a heavy nucleus into lighter fragments; fusion combines light nuclei into a heavier one","Fission combines light nuclei; fusion splits heavy nuclei","Neither process releases energy"],ans:[1],exp:"Fission is the splitting of a heavy nucleus (such as uranium) into lighter fragments, while fusion is the combination of light nuclei (such as hydrogen isotopes) into a heavier nucleus; both release energy because the products are more tightly bound per nucleon in the favorable direction."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"In the photoelectric effect, no electrons are ejected from a metal surface no matter how intense the light is, unless:",ch:["The light's frequency is at or above the metal's threshold frequency","The light is red in color","The metal is grounded","The experiment is performed in a vacuum"],ans:[0],exp:"Electrons are only ejected when incoming photons have at least the threshold frequency (and thus minimum energy, the work function) required to free an electron -- intensity alone cannot compensate for insufficient photon energy."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"According to the photoelectric effect, the maximum kinetic energy of ejected electrons depends on:",ch:["The intensity of the light only","The frequency of the light, not its intensity","The color of the metal","The duration of light exposure only"],ans:[1],exp:"Maximum kinetic energy of ejected electrons is KE_max = hf − W₀, which depends on the frequency of incident light (and the metal's work function), not on intensity."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"A metal has a higher work function than another metal. Compared to the metal with the lower work function, the higher-work-function metal requires:",ch:["A lower threshold frequency to eject electrons","A higher threshold frequency to eject electrons","No light at all to eject electrons","The same threshold frequency"],ans:[1],exp:"Work function is the minimum energy needed to eject an electron; a higher work function requires higher-frequency (higher-energy) photons to reach that threshold."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"Which observation from the photoelectric effect could not be explained by treating light purely as a continuous wave, and instead required treating light as discrete photons?",ch:["Light can reflect off a mirror","Ejection of electrons is instantaneous once threshold frequency is met, and no electrons are ejected below threshold frequency regardless of intensity","Light travels in straight lines","Light can be polarized"],ans:[1],exp:"Classical wave theory predicted that sufficiently intense light of any frequency should eventually eject electrons; the fact that below-threshold-frequency light never ejects electrons, regardless of intensity, could only be explained by quantized photons."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"The de Broglie wavelength of an electron is halved. What must have happened to its momentum?",ch:["It was halved","It was doubled","It was quadrupled","It remained the same"],ans:[1],exp:"Since λ = h/p, wavelength and momentum are inversely proportional; halving the wavelength means the momentum must have doubled."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"Which particle would exhibit the largest, most easily observable de Broglie wavelength when moving at the same speed?",ch:["An electron","A proton","A baseball","A car"],ans:[0],exp:"Because λ = h/p = h/(mv), the smallest mass at a given speed produces the largest de Broglie wavelength; the electron has by far the smallest mass among these choices."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"A pot of boiling water stays at 100°C even while heat continues to be added, until it fully boils away. This is because:",ch:["The added heat converts to potential energy that breaks intermolecular bonds during the phase change, rather than raising kinetic energy (temperature)","The stove has stopped supplying heat","Water cannot absorb more than a fixed amount of thermal energy","The pot has reached absolute zero"],ans:[0],exp:"During a phase change, added energy goes into overcoming intermolecular attractions (latent heat) rather than increasing average kinetic energy, so temperature remains constant until the phase change completes."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Which requires more energy: converting 1 kg of 100°C water into 100°C steam, or heating 1 kg of water from 0°C to 100°C? (Latent heat of vaporization is much larger than the heat needed for this temperature rise.)",ch:["Heating the water from 0°C to 100°C","Converting the 100°C water into steam","They require exactly the same energy","Neither process requires any energy"],ans:[1],exp:"The latent heat of vaporization for water (~2,260,000 J/kg) is substantially larger than the sensible heat needed to raise 1 kg of water by 100°C (~418,600 J), so vaporization requires more energy."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Sweat evaporating from skin cools the body primarily because:",ch:["Evaporation releases heat into the skin","The fastest-moving (highest-energy) water molecules escape as vapor, lowering the average kinetic energy -- and thus temperature -- of the remaining liquid","Sweat is naturally colder than body temperature","Evaporation increases the skin's surface area"],ans:[1],exp:"Evaporative cooling occurs because the highest-energy molecules preferentially leave the liquid phase, reducing the average kinetic energy (temperature) of what remains."},
{cat:"II",sub:"Thermodynamics",type:"single",q:"A refrigerator moves heat from its cold interior to the warmer room outside. This does not violate the second law of thermodynamics because:",ch:["Heat never actually flows from cold to hot","External work (electrical energy) is input to the system, and total entropy of the fridge-plus-surroundings still increases","The second law only applies to gases","Refrigerators are exempt from thermodynamic laws"],ans:[1],exp:"The second law forbids spontaneous heat flow from cold to hot without external work; a refrigerator uses electrical work to force this transfer, and the total entropy of the refrigerator and its surroundings still increases overall."},
{cat:"II",sub:"Thermodynamics",type:"single",q:"Which of the following is an example of increasing entropy?",ch:["An ice cube melting into liquid water at room temperature","Water freezing solid in a very cold freezer with heat continuously removed","A gas spontaneously compressing itself into a smaller volume","Perfectly ordered crystal formation at absolute zero"],ans:[0],exp:"Melting increases molecular disorder (entropy) as the rigid, ordered solid structure becomes a more disordered liquid; this occurs spontaneously at room temperature, consistent with the second law."},
{cat:"II",sub:"Thermodynamics",type:"single",q:"A perpetual motion machine that produces more energy than it consumes, without any energy input, is impossible because it would violate:",ch:["The first law of thermodynamics (conservation of energy)","Newton's third law","The photoelectric effect","Coulomb's law"],ans:[0],exp:"Such a machine would create energy from nothing, violating the first law of thermodynamics, which states that energy cannot be created or destroyed, only transformed."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Heat transfer through direct molecular collisions in a solid, without the bulk movement of matter, is called:",ch:["Convection","Conduction","Radiation","Sublimation"],ans:[1],exp:"Conduction transfers thermal energy through direct particle-to-particle collisions within a material, without the material itself flowing."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Heat transfer via the bulk movement of a heated fluid, such as warm air rising, is called:",ch:["Conduction","Radiation","Convection","Condensation"],ans:[2],exp:"Convection is heat transfer through the movement of a fluid (liquid or gas), such as warm, less dense air rising and being replaced by cooler air."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"The Sun's energy reaches Earth primarily through which heat transfer mechanism, despite the vacuum of space?",ch:["Conduction","Convection","Radiation","Sublimation"],ans:[2],exp:"Radiation transfers energy via electromagnetic waves and does not require a medium, allowing solar energy to cross the vacuum of space to reach Earth."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"A thermos (vacuum flask) keeps beverages hot mainly by minimizing which two forms of heat transfer?",ch:["Conduction and radiation","Convection and nuclear decay","Radiation and sublimation","Conduction and evaporation"],ans:[0],exp:"A vacuum flask uses a vacuum gap to minimize conduction and convection, and often a reflective coating to minimize radiative heat loss -- but of the given options, conduction and radiation are the pair addressed by its design."},

{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"The strong nuclear force that holds protons and neutrons together in a nucleus is best described as:",ch:["Repulsive at all distances, like the electric force between protons","Attractive at very short range within the nucleus, strong enough to overcome electric repulsion between protons","Identical in behavior to gravity, just weaker","Only active between neutrons"],ans:[1],exp:"The strong nuclear force acts over extremely short ranges within the nucleus and is strong enough to bind protons together despite their mutual electric repulsion."},
{cat:"II",sub:"Atomic/Nuclear",type:"single",q:"Why are very large nuclei (such as uranium) generally less stable than medium-sized nuclei (such as iron)?",ch:["Large nuclei have too few neutrons to have any binding force","The short-range strong force cannot as effectively counteract the long-range electric repulsion among the many protons in a large nucleus","Large nuclei have no protons","Medium nuclei have a weaker strong force"],ans:[1],exp:"As nuclei grow larger, the short-range strong force struggles to counteract the cumulative long-range electric repulsion among all the protons, making very large nuclei less stable and more prone to fission or decay."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Two objects made of different materials but with the same mass absorb the same amount of heat. The object with the higher specific heat capacity will experience:",ch:["A larger temperature change","A smaller temperature change","No temperature change at all","The same temperature change as the other object"],ans:[1],exp:"Specific heat capacity relates heat input to temperature change (Q = mcΔT); for the same heat input and mass, a higher specific heat means a smaller resulting temperature change."},
{cat:"II",sub:"Thermal Energy",type:"single",q:"Coastal regions tend to have milder, more stable temperatures than inland regions at the same latitude. This is largely because water has:",ch:["A very low specific heat capacity, changing temperature quickly","A very high specific heat capacity, resisting large temperature swings and moderating nearby air temperature","No thermal properties relevant to climate","The same specific heat as air"],ans:[1],exp:"Water's high specific heat capacity allows it to absorb or release large amounts of heat with relatively small temperature changes, moderating the climate of nearby coastal land."},
{cat:"II",sub:"Quantum Basics",type:"single",q:"Which of the following best summarizes wave-particle duality as demonstrated by phenomena like the photoelectric effect and electron diffraction?",ch:["Light and matter behave only as waves, never as particles","Light and matter can each exhibit both wave-like and particle-like behavior, depending on the experiment","Only light exhibits wave-particle duality; matter is purely particle-like","Wave-particle duality has been fully disproven by modern physics"],ans:[1],exp:"Wave-particle duality describes how both light and matter can exhibit wave-like behavior (such as diffraction and interference) and particle-like behavior (such as discrete photon absorption), depending on how they are observed."},
