{cat:"V",sub:"Sound",type:"single",q:"Two tuning forks with frequencies of 600 Hz and 592 Hz are struck simultaneously. What beat frequency is heard?",ch:["16 Hz","1192 Hz","596 Hz","8 Hz"],ans:[3],exp:"Beat frequency equals the absolute difference between the two frequencies: |592 − 600| = 8 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two tuning forks with frequencies of 280 Hz and 284 Hz are struck simultaneously. What beat frequency is heard?",ch:["4 Hz","8 Hz","282 Hz","564 Hz"],ans:[0],exp:"Beat frequency equals the absolute difference between the two frequencies: |284 − 280| = 4 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two tuning forks with frequencies of 350 Hz and 357 Hz are struck simultaneously. What beat frequency is heard?",ch:["14 Hz","7 Hz","353.5 Hz","707 Hz"],ans:[1],exp:"Beat frequency equals the absolute difference between the two frequencies: |357 − 350| = 7 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two tuning forks with frequencies of 410 Hz and 404 Hz are struck simultaneously. What beat frequency is heard?",ch:["814 Hz","12 Hz","407 Hz","6 Hz"],ans:[3],exp:"Beat frequency equals the absolute difference between the two frequencies: |404 − 410| = 6 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An ambulance siren approaches a stationary observer. The observer hears a frequency that is:",ch:["Identical to the source frequency","Impossible to determine","Higher than the source frequency","Lower than the source frequency"],ans:[2],exp:"By the Doppler effect, the observed frequency is higher than the source frequency in this scenario; note that as the ambulance moves away from the same observer afterward, the perceived frequency becomes lower than the source frequency, since the wavefronts stretch out."},
{cat:"V",sub:"Sound",type:"single",q:"A train horn moves away from a stationary observer. The observer hears a frequency that is:",ch:["Higher than the source frequency","Lower than the source frequency","Identical to the source frequency","Impossible to determine"],ans:[1],exp:"By the Doppler effect, the observed frequency is lower than the source frequency in this scenario; note that as a train approaches an observer, the perceived frequency instead becomes higher, since the wavefronts compress."},
{cat:"V",sub:"Sound",type:"single",q:"A race car speeds toward a stationary trackside microphone. The observer hears a frequency that is:",ch:["Higher than the source frequency","Lower than the source frequency","Identical to the source frequency","Impossible to determine"],ans:[0],exp:"By the Doppler effect, the observed frequency is higher than the source frequency in this scenario; note that once the car passes and moves away, the pitch heard drops below the source frequency."},
{cat:"V",sub:"Sound",type:"single",q:"A stationary observer stands still as a source moves away from them. The observer hears a frequency that is:",ch:["Higher than the source frequency","Lower than the source frequency","Impossible to determine","Identical to the source frequency"],ans:[1],exp:"By the Doppler effect, the observed frequency is lower than the source frequency in this scenario; note that if the source instead approached the observer, the perceived frequency would be higher than the source frequency."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Which list correctly orders these electromagnetic waves from lowest to highest frequency?",ch:["X-ray, visible, radio","Radio, infrared, ultraviolet","Gamma ray, X-ray, visible","Ultraviolet, visible, infrared"],ans:[1],exp:"In order of increasing frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma ray -- so radio, infrared, ultraviolet is correctly ordered from lowest to highest."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Which list correctly orders these electromagnetic waves from longest to shortest wavelength?",ch:["Gamma ray, visible, radio","Radio, visible, gamma ray","Visible, gamma ray, radio","X-ray, radio, visible"],ans:[1],exp:"Wavelength decreases as frequency increases. From longest to shortest wavelength: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma ray -- matching 'radio, visible, gamma ray.'"},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Compared to visible light, X-rays have:",ch:["Lower frequency and longer wavelength","Higher frequency and shorter wavelength","The same frequency but different speed","Higher frequency but the same wavelength"],ans:[1],exp:"X-rays lie beyond ultraviolet on the electromagnetic spectrum, with higher frequency and correspondingly shorter wavelength than visible light."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Microwave ovens use electromagnetic radiation with frequency and wavelength most similar to which region of the spectrum?",ch:["Between radio waves and infrared","Between visible light and ultraviolet","Beyond gamma rays","Below radio waves"],ans:[0],exp:"Microwaves occupy the spectrum region between radio waves and infrared radiation, with frequencies higher than typical radio broadcast frequencies but lower than infrared."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"In a vacuum, how does the speed of a gamma ray compare to the speed of a radio wave?",ch:["The gamma ray travels much faster","The radio wave travels much faster","They travel at the same speed, c ≈ 3×10⁸ m/s","Neither can travel through a vacuum"],ans:[2],exp:"All electromagnetic waves, regardless of frequency, travel at the same speed in a vacuum: c ≈ 3×10⁸ m/s."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"A glass prism separates white light into a rainbow of colors. This occurs because, within the glass, different wavelengths of light:",ch:["Travel at different speeds, causing different amounts of bending (dispersion)","Travel at exactly the same speed","Are absorbed and re-emitted as different colors","Do not interact with the glass at all"],ans:[0],exp:"Dispersion occurs because a material's index of refraction varies slightly with wavelength, so different colors of light travel at slightly different speeds within the glass and bend by different amounts."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Astronomers observe that light from a distant galaxy is shifted toward longer (redder) wavelengths compared to a stationary source. This redshift most likely indicates that the galaxy is:",ch:["Moving toward Earth","Moving away from Earth","Stationary relative to Earth","Emitting only gamma rays"],ans:[1],exp:"Redshift -- a stretching of light to longer wavelengths -- indicates the source is moving away from the observer, analogous to the Doppler effect for sound."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 30 cm in front of a converging lens with a focal length of 15 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["30 cm","60 cm","15 cm","35.5 cm"],ans:[0],exp:"1/dᵢ = 1/f − 1/dₒ = 1/15 − 1/30, so dᵢ ≈ 30 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 20 cm in front of a converging lens with a focal length of 5 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["6.67 cm","15 cm","13.33 cm","5 cm"],ans:[0],exp:"1/dᵢ = 1/f − 1/dₒ = 1/5 − 1/20, so dᵢ ≈ 6.67 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 60 cm in front of a converging lens with a focal length of 20 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["60 cm","40 cm","30 cm","20 cm"],ans:[2],exp:"1/dᵢ = 1/f − 1/dₒ = 1/20 − 1/60, so dᵢ ≈ 30 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 50 cm in front of a converging lens with a focal length of 12.5 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["12.5 cm","16.67 cm","37.5 cm","33.33 cm"],ans:[1],exp:"1/dᵢ = 1/f − 1/dₒ = 1/12.5 − 1/50, so dᵢ ≈ 16.67 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 25 cm in front of a converging lens with a focal length of 10 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["33.33 cm","15 cm","16.67 cm","10 cm"],ans:[2],exp:"1/dᵢ = 1/f − 1/dₒ = 1/10 − 1/25, so dᵢ ≈ 16.67 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 45 cm in front of a converging lens with a focal length of 15 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["45 cm","15 cm","30 cm","22.5 cm"],ans:[3],exp:"1/dᵢ = 1/f − 1/dₒ = 1/15 − 1/45, so dᵢ ≈ 22.5 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 35 cm in front of a converging lens with a focal length of 7 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["8.75 cm","28 cm","17.5 cm","7 cm"],ans:[0],exp:"1/dᵢ = 1/f − 1/dₒ = 1/7 − 1/35, so dᵢ ≈ 8.75 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 80 cm in front of a converging lens with a focal length of 20 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["20 cm","53.33 cm","26.67 cm","60 cm"],ans:[2],exp:"1/dᵢ = 1/f − 1/dₒ = 1/20 − 1/80, so dᵢ ≈ 26.67 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 24 cm in front of a converging lens with a focal length of 8 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["16 cm","24 cm","12 cm","8 cm"],ans:[2],exp:"1/dᵢ = 1/f − 1/dₒ = 1/8 − 1/24, so dᵢ ≈ 12 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 15 cm in front of a converging lens with a focal length of 5 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["15 cm","5 cm","7.5 cm","10 cm"],ans:[2],exp:"1/dᵢ = 1/f − 1/dₒ = 1/5 − 1/15, so dᵢ ≈ 7.5 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed 100 cm in front of a converging lens with a focal length of 25 cm. Using 1/f = 1/dₒ + 1/dᵢ, what is the image distance?",ch:["66.67 cm","33.33 cm","25 cm","75 cm"],ans:[1],exp:"1/dᵢ = 1/f − 1/dₒ = 1/25 − 1/100, so dᵢ ≈ 33.33 cm."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed beyond the center of curvature of a concave mirror. What type of image results?",ch:["Virtual, upright, magnified","Real, inverted, magnified","Virtual, upright, reduced","Real, inverted, reduced"],ans:[3],exp:"For an object beyond the center of curvature of a concave mirror, the resulting image is real, inverted, reduced."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed between the focal point and the center of curvature of a concave mirror. What type of image results?",ch:["Real, inverted, magnified","Virtual, upright, reduced","Virtual, upright, magnified","Real, inverted, reduced"],ans:[0],exp:"For an object between the focal point and the center of curvature of a concave mirror, the resulting image is real, inverted, magnified."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed between the focal point and the surface of a concave mirror. What type of image results?",ch:["Real, inverted, reduced","Virtual, upright, reduced","Real, inverted, magnified","Virtual, upright, magnified"],ans:[3],exp:"For an object between the focal point and the surface of a concave mirror, the resulting image is virtual, upright, magnified."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"An object is placed any position in front of a convex mirror. What type of image results?",ch:["Virtual, upright, magnified","Virtual, upright, reduced","Real, inverted, reduced","Real, inverted, magnified"],ans:[1],exp:"For an object any position in front of a convex mirror, the resulting image is virtual, upright, reduced."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"Light travels from air into glass at an angle to the normal. Since glass is optically denser than air, the ray:",ch:["Bends toward the normal, as it slows down entering the denser medium","Bends away from the normal","Continues in a straight line, unaffected","Reflects entirely back into the air"],ans:[0],exp:"Going from a less dense medium (air) to a denser medium (glass), light slows down and bends toward the normal, per Snell's law."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"Light travels from glass into air at an angle to the normal. The ray:",ch:["Bends toward the normal","Bends away from the normal, as it speeds up entering the less dense medium","Stops entirely","Travels backward"],ans:[1],exp:"Going from a denser medium (glass) to a less dense medium (air), light speeds up and bends away from the normal."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"In Young's double-slit experiment, dark fringes occur where:",ch:["Waves from the two slits arrive in phase","Waves from the two slits arrive out of phase and destructively interfere","Light from only one slit reaches the screen","The screen is perfectly reflective"],ans:[1],exp:"Dark (destructive interference) fringes occur where the path difference between the two slits equals a half-integer number of wavelengths, causing the waves to arrive out of phase and cancel."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"In a double-slit interference pattern, if the spacing between the two slits is decreased (with wavelength and screen distance unchanged), the spacing between bright fringes on the screen will:",ch:["Increase","Decrease","Stay exactly the same","Disappear entirely"],ans:[0],exp:"Fringe spacing is inversely proportional to slit separation (Δy ∝ λL/d); decreasing the slit spacing d increases the fringe spacing."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Sunsets often appear red or orange because, at sunset, sunlight travels through more of the atmosphere, and:",ch:["Blue light is scattered away out of the direct line of sight, leaving mostly longer-wavelength red and orange light to reach the observer directly","Red light is absorbed by the atmosphere, leaving only blue light","The Sun itself changes color at sunset","Rayleigh scattering only affects red light"],ans:[0],exp:"At sunset, sunlight passes through a longer path of atmosphere, scattering away even more of the shorter-wavelength blue light via Rayleigh scattering, leaving the direct light dominated by longer-wavelength red and orange hues."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Total internal reflection can occur when light travels from a denser medium to a less dense medium at an angle:",ch:["Less than the critical angle","Greater than the critical angle","Exactly 0° from the normal","Only when the light is polarized"],ans:[1],exp:"Total internal reflection occurs when light traveling from a denser to a less dense medium strikes the boundary at an angle greater than the critical angle, so no light is transmitted and all of it reflects."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Fiber optic cables transmit light over long distances with minimal loss primarily using which phenomenon?",ch:["Diffraction","Total internal reflection","The Doppler effect","Polarization"],ans:[1],exp:"Fiber optic cables are designed so light striking the internal walls of the fiber does so at an angle beyond the critical angle, undergoing total internal reflection and staying confined within the fiber."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Polarized sunglasses reduce glare from horizontal surfaces (like water or roads) because they:",ch:["Block all light equally regardless of orientation","Selectively block light waves oscillating in the horizontal direction, which dominates reflected glare","Increase the intensity of all incoming light","Only work with infrared light"],ans:[1],exp:"Polarized lenses contain a filter that blocks light oscillating in a particular direction (typically horizontal), which is the dominant orientation of glare reflected off horizontal surfaces."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Which of the following wave types can be polarized?",ch:["Sound waves in air","Transverse waves, such as light, but not longitudinal waves like sound in air","Both sound and light waves equally","Only waves traveling through a vacuum"],ans:[1],exp:"Polarization -- restricting oscillation to a single plane -- is a property specific to transverse waves like light; longitudinal waves such as sound in air oscillate along the direction of travel and cannot be polarized in the same sense."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 65 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["97.5 Hz","260 Hz","195 Hz","130 Hz"],ans:[2],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 65 Hz = 195 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 75 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["225 Hz","150 Hz","300 Hz","112.5 Hz"],ans:[0],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 75 Hz = 225 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 95 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["190 Hz","142.5 Hz","380 Hz","285 Hz"],ans:[3],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 95 Hz = 285 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 125 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["250 Hz","187.5 Hz","500 Hz","375 Hz"],ans:[3],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 125 Hz = 375 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 140 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["560 Hz","210 Hz","420 Hz","280 Hz"],ans:[2],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 140 Hz = 420 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 160 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["320 Hz","640 Hz","480 Hz","240 Hz"],ans:[2],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 160 Hz = 480 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 175 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["700 Hz","350 Hz","525 Hz","262.5 Hz"],ans:[2],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 175 Hz = 525 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"An organ pipe closed at one end has a fundamental frequency of 45 Hz. What is the frequency of its third harmonic (the next overtone it can produce)?",ch:["180 Hz","67.5 Hz","90 Hz","135 Hz"],ans:[3],exp:"A pipe closed at one end supports only odd harmonics. The next harmonic after the fundamental is the 3rd: 3 × 45 Hz = 135 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 262 Hz and 266 Hz are played together. What beat frequency results?",ch:["264 Hz","4 Hz","528 Hz","8 Hz"],ans:[1],exp:"Beat frequency = |266 − 262| = 4 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 392 Hz and 388 Hz are played together. What beat frequency results?",ch:["4 Hz","780 Hz","390 Hz","8 Hz"],ans:[0],exp:"Beat frequency = |388 − 392| = 4 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 523 Hz and 530 Hz are played together. What beat frequency results?",ch:["14 Hz","526.5 Hz","1053 Hz","7 Hz"],ans:[3],exp:"Beat frequency = |530 − 523| = 7 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 196 Hz and 200 Hz are played together. What beat frequency results?",ch:["396 Hz","8 Hz","198 Hz","4 Hz"],ans:[3],exp:"Beat frequency = |200 − 196| = 4 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 660 Hz and 653 Hz are played together. What beat frequency results?",ch:["656.5 Hz","1313 Hz","14 Hz","7 Hz"],ans:[3],exp:"Beat frequency = |653 − 660| = 7 Hz."},
{cat:"V",sub:"Sound",type:"single",q:"Two musical notes at 247 Hz and 252 Hz are played together. What beat frequency results?",ch:["499 Hz","5 Hz","10 Hz","249.5 Hz"],ans:[1],exp:"Beat frequency = |252 − 247| = 5 Hz."},
{cat:"V",sub:"Wave Properties",type:"single",q:"A wave's frequency is doubled while its speed in the medium stays constant. What happens to its wavelength?",ch:["It doubles","It is halved","It stays the same","It quadruples"],ans:[1],exp:"Since v = fλ and v is constant, doubling frequency f requires the wavelength λ to be halved to keep the product constant."},
{cat:"V",sub:"Wave Properties",type:"single",q:"A wave's wavelength is tripled while its frequency stays the same. What happens to its speed?",ch:["It triples","It is divided by three","It stays the same","It is divided by nine"],ans:[0],exp:"Since v = fλ, if frequency is unchanged and wavelength triples, the wave's speed must also triple."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A virtual image, as opposed to a real image, is one that:",ch:["Can be projected onto a screen","Cannot be projected onto a screen because light rays only appear to diverge from it, not actually pass through it","Is always larger than the object","Never forms in mirrors"],ans:[1],exp:"A virtual image forms where light rays appear to diverge from, but do not actually converge at that location, so it cannot be captured on a screen -- unlike a real image, formed by actually converging light rays."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A plane (flat) mirror always produces an image that is:",ch:["Real, inverted, and the same size as the object","Virtual, upright, and the same size as the object","Real, upright, and magnified","Virtual, inverted, and reduced"],ans:[1],exp:"A plane mirror always forms a virtual, upright image that is the same size as the object, located as far behind the mirror as the object is in front of it."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Ultraviolet light has more energy per photon than visible light because photon energy is proportional to frequency (E = hf), and ultraviolet light has:",ch:["A lower frequency than visible light","A higher frequency than visible light","The same frequency as visible light","No defined frequency"],ans:[1],exp:"Ultraviolet light lies beyond violet on the spectrum with a higher frequency than visible light, and since E = hf, higher frequency means higher photon energy."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Infrared radiation is often associated with heat because it is:",ch:["Higher frequency than visible light and strongly ionizing","Readily absorbed by many materials, increasing their thermal (vibrational/rotational) energy","Not actually part of the electromagnetic spectrum","Only produced by nuclear reactions"],ans:[1],exp:"Infrared radiation is readily absorbed by many everyday materials, increasing molecular vibration and rotation -- perceived as an increase in thermal energy, or heat."},
{cat:"V",sub:"Wave Properties",type:"single",q:"The amplitude of a wave describes:",ch:["How many wave cycles pass a point per second","The maximum displacement of the medium from its equilibrium (rest) position","The distance between two successive crests","The speed at which the wave travels"],ans:[1],exp:"Amplitude is the maximum displacement of particles in the medium from their equilibrium position, related to the wave's energy."},
{cat:"V",sub:"Wave Properties",type:"single",q:"The period of a wave is related to its frequency by:",ch:["T = f","T = 1/f","T = f²","T is unrelated to frequency"],ans:[1],exp:"Period (T) and frequency (f) are reciprocals of each other: T = 1/f, where period is the time for one full cycle and frequency is cycles per second."},
{cat:"V",sub:"Sound",type:"single",q:"The speed of sound in air is generally:",ch:["Faster than the speed of sound in water","Slower than the speed of sound in most solids and liquids, since sound travels faster through denser, more tightly bonded media","Exactly equal to the speed of light","Independent of the medium's properties"],ans:[1],exp:"Sound generally travels fastest through solids, slower through liquids, and slowest through gases like air, because more tightly bonded, less compressible media transmit mechanical vibrations more quickly."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Which of the following correctly pairs a practical application with its associated region of the electromagnetic spectrum?",ch:["Radio broadcasting -- gamma rays","Medical X-ray imaging -- X-rays","Microwave ovens -- ultraviolet light","Night-vision goggles -- radio waves"],ans:[1],exp:"Medical X-ray imaging correctly uses X-rays, which can penetrate soft tissue but are absorbed by denser bone, creating useful images."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A converging (convex) lens forms a real, inverted image when the object is placed:",ch:["Anywhere between the lens and its focal point","Beyond the focal point of the lens","Exactly at the lens itself","Real images are never formed by converging lenses"],ans:[1],exp:"A converging lens forms a real, inverted image when the object is placed beyond the focal point; placing the object between the lens and the focal point instead produces a virtual, upright, magnified image."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A diverging (concave) lens always produces an image that is:",ch:["Real, inverted, and magnified","Virtual, upright, and reduced, regardless of object position","Real and reduced","Located exactly at the lens's focal point"],ans:[1],exp:"A diverging lens always forms a virtual, upright, reduced image, no matter where the object is placed in front of it."},
{cat:"V",sub:"Wave Phenomena",type:"single",q:"Diffraction is most noticeable when a wave passes through an opening or around an obstacle whose size is:",ch:["Much larger than the wave's wavelength","Comparable to or smaller than the wave's wavelength","Exactly zero","Unrelated to the wavelength"],ans:[1],exp:"Diffraction effects become most pronounced when the size of an opening or obstacle is comparable to or smaller than the wavelength of the wave encountering it."},
{cat:"V",sub:"Wave Properties",type:"single",q:"Two waves of the same frequency and amplitude meet in phase (crest aligns with crest). This produces:",ch:["Destructive interference, canceling the waves","Constructive interference, producing a wave with larger amplitude","No interference effect at all","A standing wave only"],ans:[1],exp:"When two waves meet in phase, their displacements add together, producing constructive interference and a resultant wave of greater amplitude."},
{cat:"V",sub:"Wave Properties",type:"single",q:"Two waves of equal amplitude meet completely out of phase (crest aligns with trough). This produces:",ch:["Constructive interference","Destructive interference, potentially canceling the waves entirely","A doubling of amplitude","A change in wave speed"],ans:[1],exp:"Waves meeting exactly out of phase experience destructive interference; if amplitudes are equal, the waves can cancel completely at that point."},
{cat:"V",sub:"Sound",type:"single",q:"As altitude increases and air becomes less dense, the speed of sound in air generally:",ch:["Increases significantly","Decreases somewhat, largely due to the associated drop in temperature","Stays exactly constant regardless of conditions","Becomes infinite"],ans:[1],exp:"The speed of sound in air depends primarily on temperature (and to a lesser extent composition); as altitude increases, temperature typically drops, and the speed of sound decreases correspondingly."},
{cat:"V",sub:"Sound",type:"single",q:"A guitarist presses a string to a shorter effective length before plucking it. Compared to the full-length string, the shortened string will produce a:",ch:["Lower-pitched (lower frequency) note","Higher-pitched (higher frequency) note, since a shorter length supports a shorter fundamental wavelength and thus higher frequency","Note of exactly the same pitch","Louder note only, with unchanged pitch"],ans:[1],exp:"For a string under fixed tension, a shorter length supports a shorter fundamental wavelength; since v = fλ and wave speed on the string is roughly unchanged, a shorter wavelength means a higher frequency (higher pitch)."},
{cat:"V",sub:"EM Spectrum",type:"single",q:"Which of these forms of electromagnetic radiation carries the most energy per photon?",ch:["Radio waves","Visible light","Gamma rays","Microwaves"],ans:[2],exp:"Photon energy is proportional to frequency (E = hf). Gamma rays have the highest frequency of the options listed, and therefore carry the most energy per photon."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"The focal length of a converging lens is the distance from the lens at which:",ch:["Parallel rays of light entering the lens converge to a single point","All light is completely absorbed","The image is always life-sized","Light bends away from the axis"],ans:[0],exp:"The focal point of a converging lens is the point where incoming parallel rays (such as from a distant object) converge after passing through the lens; focal length is the distance from the lens to this point."},
{cat:"V",sub:"Geometric Optics",type:"single",q:"A nearsighted (myopic) eye focuses images of distant objects in front of the retina rather than on it. This can typically be corrected using:",ch:["A converging lens to focus the image further back onto the retina","A diverging lens to focus the image further back onto the retina by first spreading the rays","No lens can correct this condition","A mirror instead of a lens"],ans:[1],exp:"Nearsightedness is typically corrected with a diverging (concave) lens, which spreads incoming rays slightly before they enter the eye, pushing the focal point back onto the retina."},

/* ---------- utility ---------- */
const LETTERS = ["A","B","C","D","E","F"];
const uid = () => 'q' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; };
const pct = (n,d) => d===0 ? 0 : Math.round((n/d)*100);

/* ---------- storage layer (browser localStorage) ---------- */
const STORE_KEY = "ppdb-v1";
let DB = null; // {questions, stats, sessions}
let saveTimer = null;

function seedDB(){
  const questions = SEED.map(s => ({...s, id: uid(), origin:"seed"}));
  return {questions, stats:{}, sessions:[]};
}

async function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      DB = JSON.parse(raw);
      if(!DB.questions || !DB.questions.length) DB.questions = seedDB().questions;
      if(!DB.stats) DB.stats = {};
      if(!DB.sessions) DB.sessions = [];
    } else {
      DB = seedDB();
      await persist(true);
    }
  }catch(e){
    DB = seedDB();
  }
}
function persist(immediate){
  clearTimeout(saveTimer);
  const doSave = async () => {
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ console.error("save failed", e); }
  };
  if(immediate) return doSave();
  saveTimer = setTimeout(doSave, 350);
}

function statFor(qid){
  if(!DB.stats[qid]) DB.stats[qid] = {seen:0, correct:0, wrong:0, streak:0, lastResult:null, lastSeen:0};
  return DB.stats[qid];
}

function weightFor(qid){
  const s = DB.stats[qid];
  if(!s || s.seen===0) return 4;              // unseen — high priority
  if(s.lastResult===false) return 3.2;        // missed last time
  if(s.streak>=3) return 0.35;                // mastered — rarely resurface
  if(s.streak>=1) return 1;                   // correct but not mastered
  return 2;
}

function weightedSample(pool, n){
  const items = pool.map(q => ({q, w: weightFor(q.id) * (0.85+Math.random()*0.3)}));
  items.sort((a,b)=>b.w-a.w);
  // take top-weighted 70%, randomize rest for variety
  const take = Math.min(n, items.length);
  const topSlice = items.slice(0, Math.min(items.length, Math.ceil(take*1.8)));
  const chosen = shuffle(topSlice).slice(0, take).map(x=>x.q);
  return shuffle(chosen);
}

/* ---------- app state ---------- */
let VIEW = "dashboard";
let SESSION = null; // active practice/test session
let IMPORT_PREVIEW = [];

function catStats(catKey){
  const qs = DB.questions.filter(q => q.cat===catKey);
  let seen=0, correct=0, attempts=0;
  qs.forEach(q=>{ const s=DB.stats[q.id]; if(s && s.seen>0){ seen++; correct+=s.correct; attempts+=s.seen; }});
  const mastery = attempts===0 ? 0 : pct(correct, attempts);
  return {total:qs.length, seen, mastery, attempts, correct};
}

function overallMastery(){
  let attempts=0, correct=0;
  Object.values(DB.stats).forEach(s=>{ attempts+=s.seen; correct+=s.correct; });
  return {attempts, correct, pct: pct(correct,attempts)};
}

function gaugeSVG(pctVal, color, size=88){
  const r = size/2 - 8;
  const c = 2*Math.PI*r;
  const off = c * (1 - pctVal/100);
  const cx=size/2, cy=size/2;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#252E38" stroke-width="7"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .5s;"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="${color}">${pctVal}%</text>
  </svg>`;
}

/* ============================================================
   SESSION PLAYER
   ============================================================ */
function startSession(kind, opts={}){
  let pool = DB.questions;
  let modeLabel = "Session";
  let feedback = "study";
  let len = 20;
  let timeLimitSec = null;

  if(kind==="drill-20"){ pool = DB.questions; len=20; feedback="study"; modeLabel="Quick Drill"; }
  if(kind==="checkride"){ pool = DB.questions; len=Math.min(125, DB.questions.length); feedback="test"; modeLabel="Full Checkride"; timeLimitSec=150*60; }
  if(kind==="trouble"){ pool = troubleQuestions(); len=Math.min(pool.length,30); feedback="study"; modeLabel="Trouble Areas Drill"; if(pool.length===0) return; }
  if(kind==="custom"){
    pool = opts.cat==="ALL" ? DB.questions : DB.questions.filter(q=>q.cat===opts.cat);
    len = Math.min(opts.len, pool.length);
    feedback = opts.mode;
    modeLabel = `Custom · ${opts.cat==="ALL"?'All Categories':opts.cat} · ${len}Q`;
    if(opts.mode==="test" && len>=100) timeLimitSec = 150*60;
  }

  const qset = weightedSample(pool, len);
  if(qset.length===0) return;

  SESSION = {
    kind, modeLabel, feedback,
    questions: qset,
    idx: 0,
    answers: {}, // qid -> {selected:[], correct:bool}
    locked: false,
    startTime: Date.now(),
    timeLimitSec,
    finished:false
  };
  render();
  if(timeLimitSec) startTimer();
}

let timerInterval=null;
function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!SESSION || SESSION.finished){ clearInterval(timerInterval); return; }
    const elapsed = (Date.now()-SESSION.startTime)/1000;
    const remain = SESSION.timeLimitSec - elapsed;
    if(remain<=0){
      finishSession();
      clearInterval(timerInterval);
    } else {
      const el = document.getElementById('q-timer-val');
      if(el) el.textContent = fmtTime(remain);
    }
  },1000);
}

function renderPlayer(){
  if(SESSION.finished) return renderResults();
  const q = SESSION.questions[SESSION.idx];
  const ans = SESSION.answers[q.id];
  const isMulti = q.type==="multi";
  const locked = !!ans && (SESSION.feedback==="study");
  const c = CATS[q.cat];
  const progressPct = Math.round((SESSION.idx)/SESSION.questions.length*100);

  return `
  <div class="panel">
    <div class="player-head">
      <div>
        <span class="q-cat-pill">${q.cat} · ${c.short}</span>
        <span class="q-meta" style="margin-left:10px;">ITEM ${SESSION.idx+1} / ${SESSION.questions.length}</span>
      </div>
      ${SESSION.timeLimitSec ? `<div class="q-timer">⏱ <span id="q-timer-val">${fmtTime(SESSION.timeLimitSec - (Date.now()-SESSION.startTime)/1000)}</span></div>` : `<div class="q-meta">${SESSION.modeLabel}</div>`}
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>

    ${isMulti ? `<div class="q-instruction">Select ${q.selectN===2?'TWO':q.selectN===3?'THREE':q.selectN} answers</div>` : ''}
    <div class="q-text">${escapeHtml(q.q)}</div>

    <div class="choices">
      ${q.ch.map((choice,ci)=>{
        const selected = ans && ans.selected.includes(ci);
        let cls = "choice";
        if(selected) cls += " selected";
        if(locked){
          cls += " locked";
          if(q.ans.includes(ci)) cls += " correct";
          else if(selected) cls += " incorrect";
        }
        return `<div class="${cls}" data-choice="${ci}">
          <div class="letter">${LETTERS[ci]}</div>
          <div class="txt">${escapeHtml(choice)}</div>
        </div>`;
      }).join('')}
    </div>

    ${locked ? `<div class="explain-box"><b>${ans.correct?'Correct.':'Missed.'}</b> ${escapeHtml(q.exp||'No explanation provided.')}</div>` : ''}

    <div class="player-foot">
      <button class="btn btn-ghost" id="quit-session">Exit Session</button>
      <div class="btn-row">
        ${!ans && !isMulti ? '' : ''}
        ${!locked ? `<button class="btn btn-primary" id="submit-answer" ${!ans || ans.selected.length===0 ? 'disabled':''}>Submit</button>`
                   : `<button class="btn btn-primary" id="next-question">${SESSION.idx+1>=SESSION.questions.length ? 'Finish Session' : 'Next Item →'}</button>`}
      </div>
    </div>
  </div>`;
}

function renderResults(){
  const total = SESSION.questions.length;
  let correct = 0;
  const byCat = {};
  SESSION.questions.forEach(q=>{
    const a = SESSION.answers[q.id];
    const ok = a && a.correct;
    if(ok) correct++;
    if(!byCat[q.cat]) byCat[q.cat] = {total:0, correct:0};
    byCat[q.cat].total++;
    if(ok) byCat[q.cat].correct++;
  });
  const scorePct = pct(correct,total);
  const passLine = scorePct>=70;
  const duration = (Date.now()-SESSION.startTime)/1000;

  return `
  <div class="panel">
    <div class="result-hero">
      <div class="big ${passLine?'pass':'fail'}">${scorePct}%</div>
      <div class="cap">${correct} / ${total} correct · ${SESSION.modeLabel} · ${fmtTime(duration)} elapsed</div>
    </div>
    <div style="margin-top:10px;">
      ${Object.entries(byCat).map(([k,d])=>{
        const p = pct(d.correct,d.total);
        return `<div class="breakdown-row">
          <div class="breakdown-name">${k} · ${CATS[k].short}</div>
          <div class="breakdown-track"><div class="breakdown-fill" style="width:${p}%; background:${CATS[k].color};"></div></div>
          <div class="breakdown-pct" style="color:${CATS[k].color}">${p}%</div>
        </div>`;
      }).join('')}
    </div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-primary" id="close-session">Back to Dashboard</button>
      <button class="btn btn-ghost" id="review-session">Review Missed Items</button>
    </div>
  </div>`;
}

function selectChoice(ci){
  const q = SESSION.questions[SESSION.idx];
  if(!SESSION.answers[q.id]) SESSION.answers[q.id] = {selected:[], correct:false};
  const a = SESSION.answers[q.id];
  if(a.locked) return;
  const isMulti = q.type==="multi";
  if(isMulti){
    const pos = a.selected.indexOf(ci);
    if(pos>=0) a.selected.splice(pos,1);
    else a.selected.push(ci);
  } else {
    a.selected = [ci];
  }
  render();
}

function submitAnswer(){
  const q = SESSION.questions[SESSION.idx];
  const a = SESSION.answers[q.id];
  if(!a || a.selected.length===0) return;
  const sortedSel = [...a.selected].sort().join(',');
  const sortedAns = [...q.ans].sort().join(',');
  a.correct = sortedSel===sortedAns;
  a.locked = true;

  const s = statFor(q.id);
  s.seen++;
  s.lastSeen = Date.now();
  if(a.correct){ s.correct++; s.streak++; s.lastResult=true; }
  else { s.wrong++; s.streak=0; s.lastResult=false; }
  persist();

  if(SESSION.feedback==="test"){
    goNext();
  } else {
    render();
  }
}

function goNext(){
  if(SESSION.idx+1 >= SESSION.questions.length){
    finishSession();
  } else {
    SESSION.idx++;
    render();
  }
}

function finishSession(){
  SESSION.finished = true;
  const total = SESSION.questions.length;
  let correct = 0;
  SESSION.questions.forEach(q=>{ const a=SESSION.answers[q.id]; if(a && a.correct) correct++; });
  DB.sessions.push({
    id: uid(), date: Date.now(), modeLabel: SESSION.modeLabel,
    total, correct, durationSec: (Date.now()-SESSION.startTime)/1000
  });
  persist(true);
  render();
}

/* ============================================================
   IMPORT PARSER
   ============================================================ */
function parseImportText(text, defaultCat){
  text = text.trim();
  if(!text) return [];

  // Try MCQ pattern first
  const mcq = parseMCQBlocks(text, defaultCat);
  if(mcq.length>0) return mcq;

  // Fallback: Quizlet tab-separated term/definition pairs
  return parseQuizletPairs(text, defaultCat);
}

function parseMCQBlocks(text, defaultCat){
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let current = null;

  const qStart = /^\s*(\d+)[\.\)]\s*(.+)/;
  const choiceLine = /^\s*[\(\[]?([A-Fa-f])[\.\)\]]\s+(.+)/;
  const answerLine = /^\s*(answer|correct)\s*:?\s*([A-Fa-f](\s*[,\/&]\s*[A-Fa-f])*)/i;

  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    const qm = line.match(qStart);
    const cm = line.match(choiceLine);
    const am = line.match(answerLine);

    if(am && current){
      current.ansLetters = am[2].toUpperCase().split(/[,\/&]/).map(s=>s.trim());
      return;
    }
    if(cm && current){
      current.choices.push(cm[2].trim());
      return;
    }
    if(qm){
      if(current) blocks.push(current);
      current = {qtext: qm[2].trim(), choices:[], ansLetters:[]};
      return;
    }
    // continuation of question text (no marker yet, and no choices started)
    if(current && current.choices.length===0){
      current.qtext += " " + line;
    }
  });
  if(current) blocks.push(current);

  const out = [];
  blocks.forEach(b=>{
    if(b.choices.length<2 || b.ansLetters.length===0 || !b.qtext) return;
    const ansIdx = b.ansLetters.map(l=>LETTERS.indexOf(l.toUpperCase())).filter(i=>i>=0 && i<b.choices.length);
    if(ansIdx.length===0) return;
    out.push({
      id: uid(), cat: defaultCat, sub:"Imported", origin:"imported",
      type: ansIdx.length>1 ? "multi" : "single",
      selectN: ansIdx.length>1 ? ansIdx.length : undefined,
      q: b.qtext, ch: b.choices, ans: ansIdx,
      exp: "Imported item — no explanation provided."
    });
  });
  return out;
}

function parseQuizletPairs(text, defaultCat){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const pairs = [];
  lines.forEach(l=>{
    const parts = l.split('\t');
    if(parts.length>=2 && parts[0] && parts[1]){
      pairs.push({term: parts[0].trim(), def: parts.slice(1).join(' ').trim()});
    } else {
      // try comma-separated as fallback if no tabs found anywhere
      const cparts = l.split(/\s{2,}|;\s*/);
      if(cparts.length>=2 && cparts[0] && cparts[1]){
        pairs.push({term: cparts[0].trim(), def: cparts.slice(1).join(' ').trim()});
      }
    }
  });
  if(pairs.length<2) return [];

  const allTerms = pairs.map(p=>p.term);
  const out = pairs.map((p,i)=>{
    const distractorPool = allTerms.filter((t,ti)=>ti!==i);
    const distractors = shuffle(distractorPool).slice(0,3);
    const choices = shuffle([p.term, ...distractors]);
    const correctIdx = choices.indexOf(p.term);
    return {
      id: uid(), cat: defaultCat, sub:"Imported (Quizlet)", origin:"imported",
      type:"single", q: `Which term matches: "${p.def}"?`,
      ch: choices, ans:[correctIdx],
      exp: "Imported from Quizlet-style term/definition pair."
    };
  });
  return out;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(" ") + "\n";
  }
  return text;
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireGlobalEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ VIEW = b.getAttribute('data-tab'); IMPORT_PREVIEW=[]; render(); };
  });
  document.querySelectorAll('[data-tab-jump]').forEach(b=>{
    b.onclick = ()=>{ VIEW = b.getAttribute('data-tab-jump'); render(); };
  });
  document.querySelectorAll('[data-start]').forEach(b=>{
    b.onclick = ()=> startSession(b.getAttribute('data-start'));
  });

  const pkStart = document.getElementById('pk-start');
  if(pkStart) pkStart.onclick = ()=>{
    const cat = document.getElementById('pk-cat').value;
    const len = parseInt(document.getElementById('pk-len').value);
    const mode = document.getElementById('pk-mode').value;
    startSession("custom", {cat, len, mode});
  };

  const drillTrouble = document.getElementById('drill-trouble');
  if(drillTrouble) drillTrouble.onclick = ()=> startSession("trouble");

  document.querySelectorAll('[data-view-cat]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.getAttribute('data-view-cat');
      const qs = DB.questions.filter(q=>q.cat===k);
      const el = document.getElementById('cat-detail');
      el.innerHTML = `<div class="panel-title" style="margin-top:10px;"><span>${k} — ${CATS[k].name}</span></div>` +
        qs.map(q=>{
          const s = DB.stats[q.id];
          const seen = s ? s.seen : 0;
          const acc = s && s.seen>0 ? pct(s.correct,s.seen) : null;
          return `<div class="item-row">
            <div class="info"><div class="title">${escapeHtml(q.q.slice(0,110))}${q.q.length>110?'…':''}</div>
            <div class="meta">${q.sub} · ${q.origin} ${acc!==null ? '· '+acc+'% ('+seen+' attempts)' : '· not yet attempted'}</div></div>
          </div>`;
        }).join('');
    };
  });

  // player
  document.querySelectorAll('[data-choice]').forEach(el=>{
    el.onclick = ()=> selectChoice(parseInt(el.getAttribute('data-choice')));
  });
  const submitBtn = document.getElementById('submit-answer');
  if(submitBtn) submitBtn.onclick = submitAnswer;
  const nextBtn = document.getElementById('next-question');
  if(nextBtn) nextBtn.onclick = goNext;
  const quitBtn = document.getElementById('quit-session');
  if(quitBtn) quitBtn.onclick = ()=>{
    if(confirm('Exit this session? Progress on answered questions is already saved, but the session summary will not be logged.')){
      clearInterval(timerInterval);
      SESSION = null; render();
    }
  };
  const closeBtn = document.getElementById('close-session');
  if(closeBtn) closeBtn.onclick = ()=>{ SESSION=null; VIEW="dashboard"; render(); };
  const reviewBtn = document.getElementById('review-session');
  if(reviewBtn) reviewBtn.onclick = ()=>{
    SESSION.reviewMode = true;
    SESSION.finished = false;
    SESSION.questions = SESSION.questions.filter(q=>{ const a=SESSION.answers[q.id]; return a && !a.correct; });
    SESSION.idx = 0;
    if(SESSION.questions.length===0){ SESSION=null; VIEW="dashboard"; }
    else { SESSION.feedback="study"; SESSION.answers = {}; SESSION.timeLimitSec=null; }
    render();
  };

  // import
  const pdfDrop = document.getElementById('pdf-drop');
  const pdfInput = document.getElementById('pdf-input');
  if(pdfDrop) pdfDrop.onclick = ()=> pdfInput.click();
  if(pdfInput) pdfInput.onchange = async ()=>{
    const file = pdfInput.files[0];
    if(!file) return;
    const status = document.getElementById('pdf-status');
    status.textContent = "Extracting text from " + file.name + " ...";
    try{
      const text = await extractPdfText(file);
      document.getElementById('import-text').value = text.trim();
      status.textContent = `Extracted ${text.length.toLocaleString()} characters from ${file.name}. Review below, then Parse.`;
    }catch(e){
      status.textContent = "Could not extract text from that PDF: " + e.message;
    }
  };
  const parseBtn = document.getElementById('parse-btn');
  if(parseBtn) parseBtn.onclick = ()=>{
    const text = document.getElementById('import-text').value;
    const cat = document.getElementById('import-cat').value;
    IMPORT_PREVIEW = parseImportText(text, cat);
    render();
  };
  const clearImport = document.getElementById('clear-import');
  if(clearImport) clearImport.onclick = ()=>{ document.getElementById('import-text').value=""; };
  const commitBtn = document.getElementById('commit-import');
  if(commitBtn) commitBtn.onclick = ()=>{
    DB.questions.push(...IMPORT_PREVIEW);
    persist(true);
    IMPORT_PREVIEW = [];
    document.getElementById('import-text').value = "";
    render();
  };
  const discardBtn = document.getElementById('discard-import');
  if(discardBtn) discardBtn.onclick = ()=>{ IMPORT_PREVIEW=[]; render(); };
  document.querySelectorAll('[data-remove-preview]').forEach(b=>{
    b.onclick = ()=>{ IMPORT_PREVIEW.splice(parseInt(b.getAttribute('data-remove-preview')),1); render(); };
  });
  document.querySelectorAll('[data-preview-cat]').forEach(sel=>{
    sel.onchange = ()=>{ IMPORT_PREVIEW[parseInt(sel.getAttribute('data-preview-cat'))].cat = sel.value; };
  });
}

/* ---------- boot ---------- */
(async function boot(){
  document.getElementById('app').innerHTML = '<div style="padding:60px; text-align:center; color:#93A0AC; font-family:JetBrains Mono, monospace;">Loading question bank…</div>';
  await loadDB();
  render();
})();
</script>
