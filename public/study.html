<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study // PopBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1216;
  --panel:#171C22;
  --panel-2:#1E252D;
  --panel-3:#252E38;
  --border:#2C3742;
  --border-lit:#3A4854;
  --amber:#FFB300;
  --amber-dim:#8a640f;
  --cyan:#5FD3C4;
  --text:#E9E6DE;
  --text-dim:#93A0AC;
  --text-dimmer:#5C6874;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(95,211,196,0.05), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(255,179,0,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.label-font{font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
button,input{font-family:inherit;}

#shell{max-width:980px; margin:0 auto; padding:36px 20px 60px;}

.brand{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:8px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 8px var(--amber);}
.brand h1{font-size:22px; margin:0; color:var(--text); letter-spacing:0.08em;}
.subtitle{text-align:center; color:var(--text-dimmer); font-size:12px; font-family:'JetBrains Mono',monospace; letter-spacing:0.08em; margin-bottom:32px;}

.search-wrap{max-width:520px; margin:0 auto 36px; position:relative;}
.search-icon{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-dimmer); pointer-events:none;}
#searchInput{
  width:100%; padding:13px 16px 13px 44px; border-radius:999px; border:1.5px solid var(--border);
  background:var(--panel-2); color:var(--text); font-size:15px; outline:none;
  transition:border-color 0.2s ease, box-shadow 0.2s ease;
}
#searchInput::placeholder{color:var(--text-dimmer);}
#searchInput:focus{border-color:var(--amber-dim); box-shadow:0 0 0 3px rgba(255,179,0,0.12);}

#cardGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;}

.module-card{
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1.5px solid var(--border); border-radius:16px; padding:22px;
  cursor:pointer; transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.module-card:hover{ transform:translateY(-3px); border-color:var(--border-lit); box-shadow:0 10px 24px rgba(0,0,0,0.35); }
.module-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--panel-3); border:1px solid var(--border-lit); color:var(--cyan); margin-bottom:14px;
}
.module-icon svg{width:24px; height:24px;}
.module-card h3{font-size:16px; margin:0 0 6px 0; color:var(--text);}
.module-card p{font-size:13px; line-height:1.5; color:var(--text-dim); margin:0;}

.empty-state{
  grid-column:1/-1; text-align:center; padding:48px 20px; color:var(--text-dimmer);
  font-family:'JetBrains Mono',monospace; font-size:13px;
}
</style>
</head>
<body>
<div id="shell">
  <div class="brand"><div class="dot"></div><h1>Study</h1></div>
  <div class="subtitle">POPBOARD MODULE LIBRARY</div>
  <div class="search-wrap">
    <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="searchInput" type="text" placeholder="Search modules..." autocomplete="off">
  </div>
  <div id="cardGrid"></div>
</div>

<script>
/* Same identity-parsing pattern study-checkride.html itself uses (and
   historically used before this library existed) -- parsed here purely so
   this page can forward ?board=&student=&name= onward to whichever module
   is opened, matching exactly how the Study buttons in app.js already
   build that URL today. This page makes no Firestore calls of its own. */
window.__studyIdentity = (function(){
  try{
    var p = new URLSearchParams(location.search);
    var board = p.get("board");
    var student = p.get("student");
    if(!board || !student) return null;
    return { boardId: board, studentId: student, name: p.get("name") || "" };
  }catch(e){ return null; }
})();

/* Every entry's name/description is trusted, hardcoded copy (never user
   input), so building innerHTML from them directly is safe -- same
   convention the rest of this app uses for static/trusted label text. */
var MODULES = [
  {
    id: "checkride",
    name: "PRAXIS Physics 5266 Prep",
    description: "Adaptive practice questions, timed checkride drills, and a question importer for the PRAXIS Physics exam.",
    file: "study-checkride.html",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H12v18H5.5A1.5 1.5 0 0 1 4 19.5Z"/><path d="M20 4.5A1.5 1.5 0 0 0 18.5 3H12v18h6.5a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>'
  },
  {
    id: "space-sandbox",
    name: "Space Sandbox",
    description: "An interactive gravity simulator -- place planets, stars, and black holes and watch them orbit, collide, and merge.",
    file: "study-sandbox.html",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="3.2" transform="rotate(-20 12 12)"/></svg>'
  }
];

function openModule(file){
  var url = file;
  if (window.__studyIdentity) {
    url += "?board=" + encodeURIComponent(window.__studyIdentity.boardId) +
      "&student=" + encodeURIComponent(window.__studyIdentity.studentId) +
      "&name=" + encodeURIComponent(window.__studyIdentity.name || "");
  }
  window.open(url, "_blank");
}

function render(filterText){
  var grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  var ft = (filterText || "").trim().toLowerCase();
  var filtered = MODULES.filter(function(m){
    return !ft || m.name.toLowerCase().indexOf(ft) !== -1 || m.description.toLowerCase().indexOf(ft) !== -1;
  });
  if (!filtered.length) {
    var empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = 'No modules match "' + filterText + '".';
    grid.appendChild(empty);
    return;
  }
  filtered.forEach(function(m){
    var card = document.createElement("div");
    card.className = "module-card";
    card.innerHTML = "<div class='module-icon'>" + m.icon + "</div><h3>" + m.name + "</h3><p>" + m.description + "</p>";
    card.onclick = function(){ openModule(m.file); };
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", function(e){ render(e.target.value); });
render("");
</script>
</body>
</html>
