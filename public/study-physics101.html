<!DOCTYPE html>
<html lang="en" data-theme="light" data-course="physics101">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="shared/layout/layout.css">
<script type="module" src="shared/layout/layout.js"></script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe4">
<title>Physics 101 // PopBoard</title>
<link rel="icon" type="image/png" href="popboard-logo.png">
<script>
  // Light notebook paper is the default; dark paper is remembered for the whole course.
  (function () {
    var t = null;
    try { t = localStorage.getItem("popboard.physics101.theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="shared/paper/paper.css">
<link rel="stylesheet" href="astro-course/ac-theme.css">
<link rel="stylesheet" href="astro-course/ac-library.css">
<link rel="stylesheet" href="physics101/p101.css">
<link rel="stylesheet" href="physics101/sq-page.css">
<link rel="preload" href="fonts/cabin-sketch-bold.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<header class="ac-bar">
  <button id="studyBackBtn" class="study-back-btn" type="button" data-study-back aria-label="Back to Study library"><span class="back-icon"></span><span class="back-label">Back</span></button>
  <p class="ac-bar-title sr-only">Physics 101</p>
  <span class="ac-spacer"></span>
  <button id="themeBtn" class="ac-theme-btn" type="button"></button>
</header>

<main class="lib">
  <section class="lib-cover">
    <h1 class="lib-title">Physics 101</h1>
    <p class="lib-lede">One storybook for every lesson, grouped by module. The lessons are being written now.</p>
    <label class="lib-search sketch" for="q">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.4l5.3 5.1"/></svg>
      <span class="sr-only">Search titles and every page</span>
      <input id="q" type="search" placeholder="Search titles and every page" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="lib-filter-row">
      <a class="pq-btn" id="pqBtn" href="study-physics101-questions.html">Practice Questions <svg viewBox="0 0 34 16" width="30" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.6c6-.8 13-.2 19-.6s7.5-.3 10-.1"/><path d="M24.5 2.8c2.4 1.9 4.6 3.3 6.8 5.1-2.3 1.6-4.4 3.3-6.4 5.4"/></svg></a>
      <div class="lib-filters" role="group" aria-label="Module" data-auto="module">
        <button type="button" data-q="0" aria-pressed="true">All</button>
      </div>
    </div>
    <p class="lib-count" id="count" aria-live="polite"></p>
  </section>
  <ol class="lib-grid" id="grid"></ol>
  <p class="lib-empty" id="empty" hidden>No page in the course matches that yet. Try a shorter word.</p>
</main>

<script type="module" src="astro-course/ac-library-ui.js"></script>
</body>
</html>
