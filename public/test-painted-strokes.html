<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Painted strokes tech test (throwaway)</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a1e; overflow: hidden; color: #fff; font: 600 14px/1.3 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .chip { position: fixed; padding: 8px 12px; border-radius: 14px; background: rgba(12, 16, 40, .62); border: 1px solid rgba(255, 255, 255, .16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #fps { left: 12px; top: 12px; margin-top: env(safe-area-inset-top); font: 600 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: #C3C9E6; }
  #title { left: 12px; bottom: 12px; margin-bottom: env(safe-area-inset-bottom); max-width: calc(100% - 200px); color: #C3C9E6; font-weight: 500; font-size: 12px; }
  #title b { color: #fff; display: block; font-size: 13px; }
  #bar { position: fixed; right: 12px; bottom: 12px; margin-bottom: env(safe-area-inset-bottom); display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 16px; cursor: pointer; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .10); color: #C3C9E6; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); min-height: 22px; }
  button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.75; stroke-linecap: round; }
  button .pip { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: #7a809e; }
  button.on { background: linear-gradient(135deg, rgba(127, 178, 255, .30), rgba(164, 140, 255, .22)); border-color: rgba(170, 205, 255, .85); color: #fff; box-shadow: 0 0 28px rgba(127, 178, 255, .25); }
  button.on .pip { background: #7FB2FF; box-shadow: 0 0 10px #7FB2FF; }
  #vr { background: rgba(127, 178, 255, .16); border-color: rgba(170, 205, 255, .5); color: #fff; }
  #vr[hidden], #vrNote[hidden], #status[hidden] { display: none; }
  #vrNote { position: static; font-size: 11px; font-weight: 500; color: #A9B0D0; padding: 0 4px; max-width: 190px; text-align: right; }
  @media (max-width: 600px) { #title { display: none; } }
  #status { left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps" class="chip">starting...</div>
<div id="title" class="chip"><b>Painted strokes tech test</b>Throwaway. Young protostar in its dusty disk, ribbons only. Drag to look, pinch or wheel to zoom.</div>
<div id="status" class="chip">Loading...</div>
<div id="bar">
  <button id="calm" type="button" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 14c5-7 9 7 14 0s9 7 14 0 7 3 10 0"/><path d="M6 27h36"/><path d="M6 36h36"/></svg><span>Calm lines</span><i class="pip"></i></button>
  <button id="vr" type="button" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="13" width="40" height="22" rx="9"/><path d="M19 27c3 2 7 2 10 0"/></svg><span class="lbl">Enter VR</span></button>
  <div id="vrNote" class="chip" style="position:static;background:none;border:0;backdrop-filter:none">VR button appears in a WebXR headset browser (Quest).</div>
</div>
<script type="module" src="test-painted-strokes/main.js"></script>
</body>
</html>
