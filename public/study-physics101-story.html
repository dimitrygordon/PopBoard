<!DOCTYPE html>
<html lang="en" data-theme="light" data-course="physics101">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="shared/layout/layout.css">
<script type="module" src="shared/layout/layout.js"></script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe4">
<title>Physics 101 storybook // PopBoard</title>
<link rel="icon" type="image/png" href="popboard-logo.png">
<script>
  // Light notebook paper is the default; dark paper is remembered for the whole course.
  (function () {
    var t = null;
    try { t = localStorage.getItem("popboard.physics101.theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="shared/paper/paper.css">
<script src="shared/notation/notation.js"></script>
<link rel="stylesheet" href="astro-course/ac-theme.css">
<link rel="stylesheet" href="astro-course/ac-story.css">
<link rel="stylesheet" href="physics101/p101.css">
<link rel="stylesheet" href="physics101/sq-page.css">
</head>
<body>
<header class="ac-bar">
  <button id="studyBackBtn" class="study-back-btn" type="button" aria-label="Back to the Physics 101 library"><span class="back-icon"></span><span class="back-label">Library</span></button>
  <h1 class="ac-bar-title" id="deckTitle">Physics 101</h1>
  <button id="sbMenuBtn" type="button" aria-expanded="false" aria-controls="sbMenu" aria-label="Sandboxes and Try it links" hidden><span class="sb-long">Sandboxes</span><span class="sb-short" aria-hidden="true">Try it</span></button>
  <button id="tiltBtn" type="button" aria-pressed="false" hidden>Tilt off</button>
  <button id="sandboxBtn" type="button" aria-pressed="false" hidden>Sandbox</button>
  <button id="sqDoor" class="sq-door" type="button" aria-label="Study Questions for this lesson" title="Study Questions"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.2-4.6L16.6 4a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6.1l3.4 3.4"/><path d="M4 20l4.6-1.2"/></svg></button>
  <button id="themeBtn" class="ac-theme-btn" type="button"></button>
</header>

<!-- Opens one lesson: ?lesson=m01-l01. Same reader as the Astronomy Course storybooks. -->
<div class="sb-menu sketch" id="sbMenu" hidden></div>
<main class="story" id="story">
  <section class="book" aria-label="Storybook page">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage" data-pb-free aria-live="polite"></div>
      <div class="sandbox-stage" id="sandboxStage" hidden></div>
    </div>
    <div class="stage-cap" id="stageCap">
      <button type="button" id="prevBtn" aria-label="Previous page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <p class="page-label" id="pageLabel">Page 1</p>
      <button type="button" id="nextBtn" aria-label="Next page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <label class="scrub" id="scrubRow"><span class="sr-only">Go to page</span><input type="range" id="scrub" min="1" max="1" step="1" value="1"></label>
  </section>

  <aside class="panel" id="panel" aria-label="Page tools">
    <button type="button" class="sheet-handle" id="sheetHandle" aria-label="Resize page tools"><span></span></button>
    <div class="panel-body" id="panelBody">
      <div class="ptabs" role="tablist" aria-label="Page tools">
        <button type="button" role="tab" id="tabRead" aria-controls="readBox" aria-selected="true">Read this page</button>
        <button type="button" role="tab" id="tabSq" aria-controls="sqPane" aria-selected="false">Study Questions</button>
        <button type="button" role="tab" id="tabTest" aria-controls="tools" aria-selected="false" hidden>Test it</button>
      </div>
      <section class="sq-pane" id="sqPane" role="tabpanel" aria-labelledby="tabSq" hidden>
        <div class="sq-pane-top">
          <label class="sq-pick"><span>Lesson</span><select id="sqPick"></select></label>
          <button id="soundBtn" type="button" aria-pressed="false" title="Pencil sound">Sound off</button>
        </div>
        <div class="sq-chips" id="sqChips" role="group" aria-label="Show"></div>
        <div class="sq" id="sqList"></div>
        <p class="sq-lib-link"><a href="study-physics101-questions.html">All Practice Questions</a></p>
      </section>
      <section class="read" id="readBox" aria-label="This page in large print"><h2 class="panel-h">Read this page</h2><div id="narr"></div><div id="readText"></div></section>
      <section id="tools"></section>
      <nav class="toc" id="toc" aria-label="Contents"><h2 class="panel-h">Contents</h2><ol id="tocList"></ol></nav>
    </div>
  </aside>
</main>

<script type="module" src="astro-course/ac-story.js"></script>
<script type="module" src="physics101/sq-tab.js"></script>
</body>
</html>
