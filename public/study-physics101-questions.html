<!DOCTYPE html>
<html lang="en" data-theme="light" data-course="physics101">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe4">
<title>Practice Questions // Physics 101 // PopBoard</title>
<link rel="icon" type="image/png" href="popboard-logo.png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("popboard.physics101.theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="astro-course/ac-theme.css">
<link rel="stylesheet" href="astro-course/ac-library.css">
<link rel="stylesheet" href="physics101/p101.css">
<link rel="stylesheet" href="physics101/sq-page.css">
</head>
<body class="sq-lib">
<!-- Practice Questions library: modules, then lessons (?module=N), then one lesson's problems (?lesson=m01-l04).
     Extra practice from the Inspire Physics study set; the lessons' own worked examples stay in the storybooks. -->
<header class="ac-bar">
  <a id="sqBack" class="btn study-back-btn" href="study-physics101.html"><span class="back-icon"></span><span class="back-label">Library</span></a>
  <h1 class="ac-bar-title" id="sqTitle">Practice Questions</h1>
  <button id="soundBtn" type="button" aria-pressed="false" title="Pencil sound">Sound off</button>
  <button id="themeBtn" class="ac-theme-btn" type="button"></button>
</header>
<main class="sq" id="sq">
  <nav class="sq-crumbs" id="sqCrumbs" aria-label="Where you are"></nav>
  <section id="viewHome" hidden>
    <h2 class="sq-hero">Practice Questions</h2>
    <p class="sq-lede">Extra practice for every Physics 101 lesson, worked step by step.</p>
    <label class="lib-search sketch" for="sqQ">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.4l5.3 5.1"/></svg>
      <span class="sr-only">Search every question</span>
      <input id="sqQ" type="search" placeholder="Search every question" autocomplete="off" enterkeyhint="search">
    </label>
    <ol class="sq-results" id="sqResults" hidden></ol>
    <ol class="sq-mods" id="sqMods"></ol>
  </section>
  <section id="viewModule" hidden><ol class="sq-lessons" id="sqLessons"></ol></section>
  <section id="viewLesson" hidden>
    <div class="sq-lesson-head"><p class="sq-crumb" id="sqLessonTag"></p><h2 class="sq-lesson-title" id="sqLessonTitle"></h2>
      <a class="btn" id="sqOpenBook" href="#">Open the storybook</a></div>
    <div class="sq-chips" id="sqChips" role="group" aria-label="Show"></div>
    <div id="sqList"></div>
  </section>
</main>
<script type="module" src="physics101/sq-page.js"></script>
</body>
</html>
