<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Friction Lab // PopBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a;
  --panel:#171C22;
  --panel-2:#1E252D;
  --panel-3:#252E38;
  --border:#2C3742;
  --border-lit:#3A4854;
  --amber:#FFB300;
  --amber-dim:#8a640f;
  --cyan:#5FD3C4;
  --violet:#B07CFF;
  --violet-dim:#6b4a99;
  --text:#E9E6DE;
  --text-dim:#93A0AC;
  --text-dimmer:#5C6874;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);height:100%;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;touch-action:none;}
h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
button,input{font-family:inherit;}
#stage{display:block;width:100vw;height:100vh;background:var(--bg);touch-action:none;}

/* ---------- top / bottom bars ---------- */
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;pointer-events:none;z-index:50;}
.bar-top{top:0;}
.bar-bottom{bottom:0;}
.bar button{pointer-events:auto;background:none;border:none;color:#0A84FF;font-size:15px;cursor:pointer;padding:4px 2px;}
.bar button:active{opacity:0.6;}
.bar-left{display:flex;align-items:center;gap:18px;}
.bar button.study-back-btn{display:inline-flex;align-items:center;gap:2px;}
/* Phones: chevron only, so the left buttons never run into the centered one. */
@media (max-width:400px){.bar-left{gap:12px;}.bar button.study-back-btn .back-label{display:none;}.bar button.study-back-btn svg{width:20px;height:20px;}}
.bar-top .bar-center, .bar-bottom .bar-center{position:absolute;left:50%;transform:translateX(-50%);}

/* ---------- status banner ---------- */
#statusBanner{
  position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:45;
  background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-lit);border-radius:14px;padding:10px 22px;text-align:center;
  max-width:min(92vw,600px);pointer-events:none;transition:border-color 0.3s ease, box-shadow 0.3s ease;
}
#statusBanner .status-type{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text);}
#statusBanner .status-reason{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-family:'JetBrains Mono',monospace;}
#statusBanner.sliding{border-color:var(--amber-dim);box-shadow:0 0 24px rgba(255,179,0,0.18);}
#statusBanner.sliding .status-type{color:var(--amber);}

/* ---------- motion HUD: big digital velocity/acceleration readout ---------- */
#motionHud{position:fixed;top:118px;left:50%;transform:translateX(-50%);z-index:44;display:flex;gap:10px;pointer-events:none;}
.motion-tile{background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-lit);border-radius:14px;padding:8px 18px 10px;text-align:center;min-width:128px;}
.motion-tile .motion-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);}
.motion-tile .motion-value{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;line-height:1.15;color:var(--text);transition:color 0.15s ease;}
.motion-tile .motion-unit{font-size:12.5px;color:var(--text-dim);margin-left:3px;}
#hudAccelTile{pointer-events:auto;cursor:pointer;}
#hudAccelTile:active{background:rgba(255,255,255,0.08);}

/* ---------- floating panels ---------- */
.panel{
  position:fixed;z-index:60;width:320px;max-width:calc(100vw - 32px);
  background:rgba(22,24,28,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;
  box-shadow:0 12px 32px rgba(0,0,0,0.5);
  max-height:calc(100vh - 110px);overflow-y:auto;
}
.panel.wide{width:380px;}
.panel.hidden{display:none;}
.panel h3{margin:0 0 14px 0;text-align:center;font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#fff;}
.panel-row{margin-bottom:14px;}
.panel-row:last-child{margin-bottom:0;}
.panel-label{font-size:13px;color:#e5e5e7;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.panel-hint{font-size:11.5px;color:#8e8e93;line-height:1.5;margin-top:10px;}
.panel-link{display:block;text-align:center;color:#0A84FF;font-size:13px;margin-top:12px;cursor:pointer;background:none;border:none;width:100%;padding:4px;}
.panel-link:active{opacity:0.6;}
.panel-section-title{text-align:center;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6e6e73;margin:16px 0 8px;}

input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:#48484a;outline:none;margin:0;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none;cursor:pointer;}

/* ---------- segmented control / material swatches / toggles ---------- */
.seg-row{display:flex;gap:6px;margin-bottom:16px;}
.seg-btn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border-lit);background:var(--panel-2);
  color:var(--text-dim);font-size:11.5px;text-align:center;cursor:pointer;}
.seg-btn.active{background:var(--amber-dim);color:#fff;border-color:var(--amber);}
.seg-btn:active{opacity:0.7;}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;}
.swatch-btn{aspect-ratio:1;border-radius:10px;border:2px solid var(--border-lit);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.85);
  text-transform:uppercase;letter-spacing:0.01em;text-align:center;padding:2px;overflow:hidden;}
.swatch-btn.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,0.35);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px;color:#e5e5e7;}
.toggle-switch{width:40px;height:24px;border-radius:12px;background:#3a3a3c;position:relative;cursor:pointer;flex-shrink:0;}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.15s ease;}
.toggle-switch.on{background:var(--violet-dim);}
.toggle-switch.on .knob{left:18px;}

/* ---------- zoom / mode buttons ---------- */
#stageControls{position:fixed;right:18px;bottom:64px;z-index:55;display:flex;flex-direction:column;gap:8px;}
.round-btn{
  width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,0.8);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.round-btn:active{opacity:0.6;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-card{
  background:rgba(22,24,28,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px;
  max-width:460px;width:100%;max-height:80vh;overflow-y:auto;
}
.modal-card h2{margin:0 0 14px 0;font-size:17px;text-align:center;}
.modal-card p{font-size:13.5px;line-height:1.6;color:#d1d1d6;margin:0 0 10px 0;}
.modal-card .close-link{display:block;text-align:center;color:#0A84FF;margin-top:16px;cursor:pointer;background:none;border:none;font-size:14px;width:100%;padding:6px;}

/* ---------- lab table ---------- */
#labTable{width:100%;border-collapse:collapse;font-size:10.5px;font-family:'JetBrains Mono',monospace;}
#labTable th,#labTable td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
#labTable th{color:var(--text-dim);font-weight:500;font-size:9px;text-transform:uppercase;letter-spacing:0.03em;}
#labTable td{color:var(--text);}
#labTable tr:last-child td{border-bottom:none;}
.lab-empty{text-align:center;color:var(--text-dimmer);font-size:12px;padding:14px 0;}
.lab-row-del{color:#ff6b6b;cursor:pointer;}
canvas.lab-graph{width:100%;height:140px;display:block;border-radius:10px;background:rgba(0,0,0,0.25);margin-top:8px;}
#eqStrip{position:fixed;top:198px;left:50%;transform:translateX(-50%);z-index:44;background:rgba(15,18,22,0.78);backdrop-filter:blur(14px);border:1px solid var(--border-lit);border-radius:12px;padding:7px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan);text-align:center;max-width:94vw;pointer-events:none;line-height:1.6;}
.feedback{font-size:12.5px;line-height:1.55;min-height:20px;margin-top:8px;}
.feedback.good{color:#57d38c;}.feedback.bad{color:#ff7a7a;}
input[type="number"].num-input{background:var(--panel-2);border:1px solid var(--border-lit);color:var(--text);border-radius:8px;padding:9px;width:100%;font-size:13px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border-lit);background:var(--panel-2);color:var(--text);font-size:11.5px;cursor:pointer;}
@media(max-width:520px){#eqStrip{top:248px;font-size:10px;}}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="bar bar-top">
  <div class="bar-left">
    <button id="studyBackBtn" class="study-back-btn" type="button" data-study-back aria-label="Back to Study library"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="back-label">Back</span></button>
    <button id="controlsBtn">Controls</button>
  </div>
  <button id="pauseBtn" class="bar-center">Pause</button>
  <button id="resetBtn">Reset</button>
</div>
<div class="bar bar-bottom">
  <button id="tutorialBtn">Tutorial</button>
  <button id="guidedBtn" class="bar-center">Challenges</button>
  <button id="labBtn">Lab</button>
</div>

<div id="statusBanner">
  <div class="status-type" id="statusType">&mdash;</div>
  <div class="status-reason" id="statusReason">&mdash;</div>
</div>

<div id="motionHud">
  <div class="motion-tile">
    <div class="motion-label">Velocity</div>
    <div><span class="motion-value" id="hudVelocity">0.0</span><span class="motion-unit">m/s</span></div>
  </div>
  <div class="motion-tile" id="hudAccelTile" title="Tap to zero the applied force">
    <div class="motion-label">Acceleration</div>
    <div><span class="motion-value" id="hudAccel">0.0</span><span class="motion-unit">m/s&sup2;</span></div>
  </div>
</div>

<div id="eqStrip" class="mono">—</div>
<div id="stageControls">
  <div class="round-btn" id="muteBtn" title="Mute/unmute sound">&#128266;</div>
  <div class="round-btn" id="stepBtn" title="Step">&#9654;&#124;</div>
</div>

<div id="controlsPanel" class="panel hidden" style="top:56px;left:18px;"></div>
<div id="labPanel" class="panel wide hidden" style="top:56px;right:18px;"></div>
<div id="guidedPanel" class="panel wide hidden" style="top:56px;right:18px;"></div>

<div id="tutorialModal" class="modal-overlay hidden"></div>

<script type="module">
"use strict";
/* ============================================================
   FRICTION LAB -- an interactive friction sandbox + virtual lab
   (hand-rolled 2D canvas). Original implementation; no shared code
   with the other study modules or app.js (each module in the
   library is fully self-contained).
   ============================================================ */

/* ============================================================
   Pure physics -- no DOM/canvas references, so it can be (and was)
   unit tested in isolation before any rendering code was written
   (see scratchpad/verify_friction_physics.js). Kept verbatim from
   that validated scratchpad copy.
   ============================================================ */
var G = 9.81;

var OBJECT_MATERIALS = ["wood", "cardboard", "leather", "rubber", "glass", "stone", "steel", "castiron"];
var SURFACE_MATERIALS = ["wood", "rubber", "leather", "glass", "ice", "concrete", "steel", "castiron"];

// Display labels for materials whose key isn't already the label (keys
// stay single-word/no-space so they work as plain object-literal keys
// and in "object|surface" lookup strings).
var MATERIAL_LABELS = { castiron: "Cast Iron" };
function materialLabel(mat) { return MATERIAL_LABELS[mat] || mat; }

// Per-material acoustic fingerprint for the scrape/thud sound design
// (see the Sound design section near the bottom): freqHz/q shape a
// bandpass filter on noise -- low freq + low Q reads as a broad rumble
// (soft/rough materials), high freq + high Q reads as a glassy/metallic
// ring (hard/smooth materials). hardness (0-1) shapes the stop "thud":
// higher = a brighter, shorter clunk; lower = a duller, longer bump.
// Every object/surface material pair combines its two fingerprints
// (see combinedSoundProfile) rather than needing all 64 pairs tuned
// by hand.
var MATERIAL_SOUND = {
  wood: { freqHz: 300, q: 1.0, hardness: 0.35 },
  cardboard: { freqHz: 240, q: 0.6, hardness: 0.15 },
  leather: { freqHz: 220, q: 0.8, hardness: 0.25 },
  rubber: { freqHz: 160, q: 0.6, hardness: 0.20 },
  glass: { freqHz: 900, q: 2.6, hardness: 0.85 },
  stone: { freqHz: 380, q: 1.1, hardness: 0.75 },
  steel: { freqHz: 700, q: 2.2, hardness: 0.90 },
  castiron: { freqHz: 500, q: 1.7, hardness: 0.95 },
  ice: { freqHz: 950, q: 3.2, hardness: 0.15 },
  concrete: { freqHz: 340, q: 0.9, hardness: 0.70 }
};

function combinedSoundProfile(objectMat, surfaceMat) {
  var o = MATERIAL_SOUND[objectMat], s = MATERIAL_SOUND[surfaceMat];
  return {
    freqHz: Math.sqrt(o.freqHz * s.freqHz),
    q: (o.q + s.q) / 2,
    hardness: (o.hardness + s.hardness) / 2
  };
}

// Representative introductory-model coefficients per (object, surface)
// pair. Real friction also depends on surface condition, lubrication,
// and temperature -- these are curated teaching values, not a materials
// database.
var FRICTION_TABLE = {
  "wood|wood": { mus: 0.50, muk: 0.30 },
  "wood|steel": { mus: 0.40, muk: 0.25 },
  "wood|rubber": { mus: 0.55, muk: 0.40 },
  "wood|ice": { mus: 0.06, muk: 0.04 },
  "wood|concrete": { mus: 0.55, muk: 0.35 },
  "wood|glass": { mus: 0.35, muk: 0.22 },
  "wood|castiron": { mus: 0.42, muk: 0.28 },
  "wood|leather": { mus: 0.40, muk: 0.28 },

  "steel|wood": { mus: 0.40, muk: 0.25 },
  "steel|steel": { mus: 0.35, muk: 0.25 },
  "steel|rubber": { mus: 0.60, muk: 0.45 },
  "steel|ice": { mus: 0.03, muk: 0.02 },
  "steel|concrete": { mus: 0.50, muk: 0.40 },
  "steel|glass": { mus: 0.25, muk: 0.18 },
  "steel|castiron": { mus: 0.40, muk: 0.29 },
  "steel|leather": { mus: 0.35, muk: 0.24 },

  "cardboard|wood": { mus: 0.45, muk: 0.30 },
  "cardboard|steel": { mus: 0.35, muk: 0.22 },
  "cardboard|rubber": { mus: 0.50, muk: 0.35 },
  "cardboard|ice": { mus: 0.05, muk: 0.03 },
  "cardboard|concrete": { mus: 0.45, muk: 0.30 },
  "cardboard|glass": { mus: 0.30, muk: 0.20 },
  "cardboard|castiron": { mus: 0.38, muk: 0.25 },
  "cardboard|leather": { mus: 0.42, muk: 0.28 },

  "rubber|wood": { mus: 0.55, muk: 0.40 },
  "rubber|steel": { mus: 0.60, muk: 0.45 },
  "rubber|rubber": { mus: 0.95, muk: 0.80 },
  "rubber|ice": { mus: 0.15, muk: 0.08 },
  "rubber|concrete": { mus: 0.90, muk: 0.70 },
  "rubber|glass": { mus: 0.70, muk: 0.55 },
  "rubber|castiron": { mus: 0.68, muk: 0.52 },
  "rubber|leather": { mus: 0.75, muk: 0.58 },

  "stone|wood": { mus: 0.45, muk: 0.30 },
  "stone|steel": { mus: 0.40, muk: 0.28 },
  "stone|rubber": { mus: 0.70, muk: 0.55 },
  "stone|ice": { mus: 0.04, muk: 0.025 },
  "stone|concrete": { mus: 0.60, muk: 0.45 },
  "stone|glass": { mus: 0.30, muk: 0.20 },
  "stone|castiron": { mus: 0.45, muk: 0.32 },
  "stone|leather": { mus: 0.42, muk: 0.29 },

  "glass|wood": { mus: 0.35, muk: 0.22 },
  "glass|steel": { mus: 0.25, muk: 0.18 },
  "glass|rubber": { mus: 0.70, muk: 0.55 },
  "glass|ice": { mus: 0.02, muk: 0.015 },
  "glass|concrete": { mus: 0.40, muk: 0.28 },
  "glass|glass": { mus: 0.30, muk: 0.20 },
  "glass|castiron": { mus: 0.32, muk: 0.22 },
  "glass|leather": { mus: 0.30, muk: 0.20 },

  "castiron|wood": { mus: 0.42, muk: 0.28 },
  "castiron|steel": { mus: 0.40, muk: 0.29 },
  "castiron|rubber": { mus: 0.68, muk: 0.52 },
  "castiron|ice": { mus: 0.025, muk: 0.018 },
  "castiron|concrete": { mus: 0.52, muk: 0.40 },
  "castiron|glass": { mus: 0.32, muk: 0.22 },
  "castiron|castiron": { mus: 0.45, muk: 0.35 },
  "castiron|leather": { mus: 0.40, muk: 0.28 },

  "leather|wood": { mus: 0.40, muk: 0.28 },
  "leather|steel": { mus: 0.35, muk: 0.24 },
  "leather|rubber": { mus: 0.75, muk: 0.58 },
  "leather|ice": { mus: 0.05, muk: 0.03 },
  "leather|concrete": { mus: 0.55, muk: 0.40 },
  "leather|glass": { mus: 0.30, muk: 0.20 },
  "leather|castiron": { mus: 0.40, muk: 0.28 },
  "leather|leather": { mus: 0.50, muk: 0.38 }
};

function getFriction(objectMat, surfaceMat) {
  var entry = FRICTION_TABLE[objectMat + "|" + surfaceMat];
  if (!entry) { throw new Error("No friction entry for " + objectMat + "|" + surfaceMat); }
  return entry;
}

function normalForceFlat(mass) { return mass * G; }
function normalForceIncline(mass, angleRad) { return mass * G * Math.cos(angleRad); }
// Positive = pulls the object DOWN the ramp.
function gravityAlongIncline(mass, angleRad) { return mass * G * Math.sin(angleRad); }

/* ---------- core static/kinetic resolver ----------
   Operates in a 1D coordinate system along the "motion axis" -- horizontal
   for a flat surface, along-the-ramp for an incline. `biasForce` is
   whatever non-friction, non-applied force already acts along that axis
   (0 on the flat; gravityAlongIncline on a ramp, positive = down-ramp).
   `appliedForce` is whatever the student dials in. Their sum is the
   "drive force": everything pushing the object along the axis except
   friction itself.

   While static, friction exactly cancels the drive force up to its
   maximum (mus*N); crossing that threshold flips the regime to sliding.
   While sliding, kinetic friction (muk*N) opposes velocity -- except at
   the instant velocity is ~0 (just started, or just decelerated back to
   a stop), where it opposes the drive force instead, and re-captures to
   the static regime if the drive force no longer exceeds mus*N. This is
   what lets a sliding object come to a natural, non-jittering stop, and
   is also exactly what makes the incline's critical angle fall out for
   free: at zero applied force, raising the angle past atan(mus) is the
   same transition as pushing an object on the flat past its static
   threshold -- no special-cased "critical angle" logic anywhere. */
var REST_VELOCITY_EPS = 0.005; // m/s

function resolveFriction(p) {
  var driveForce = p.appliedForce + p.biasForce;
  var maxStatic = p.mus * p.normalForce;

  if (p.regime === "static" && Math.abs(driveForce) <= maxStatic) {
    return { regime: "static", frictionForce: -driveForce, netForce: 0, acceleration: 0 };
  }

  if (Math.abs(p.velocity) < REST_VELOCITY_EPS) {
    if (Math.abs(driveForce) <= maxStatic) {
      return { regime: "static", frictionForce: -driveForce, netForce: 0, acceleration: 0 };
    }
    var dir = driveForce > 0 ? 1 : -1;
    var frictionAtRest = -dir * p.muk * p.normalForce;
    var netAtRest = driveForce + frictionAtRest;
    return { regime: "sliding", frictionForce: frictionAtRest, netForce: netAtRest, acceleration: netAtRest / p.mass };
  }

  var vDir = p.velocity > 0 ? 1 : -1;
  var frictionForce = -vDir * p.muk * p.normalForce;
  var netForce = driveForce + frictionForce;
  return { regime: "sliding", frictionForce: frictionForce, netForce: netForce, acceleration: netForce / p.mass };
}

/* ---------- single integration step (semi-implicit Euler) ----------
   Pure: takes the current {regime, velocity, position} plus the physical
   parameters for this instant, returns the next state. The render loop
   sub-steps a frame's dt into several calls of this, matching Space
   Sandbox's stepPhysics/MAX_SUBSTEP_DT pattern. */
function stepFriction(state, phys, dt) {
  var resolved = resolveFriction({
    regime: state.regime, velocity: state.velocity,
    appliedForce: phys.appliedForce, biasForce: phys.biasForce,
    normalForce: phys.normalForce, mus: phys.mus, muk: phys.muk, mass: phys.mass
  });
  var velocity = resolved.regime === "static" ? 0 : state.velocity + resolved.acceleration * dt;
  var position = state.position + velocity * dt;
  return {
    regime: resolved.regime, velocity: velocity, position: position,
    frictionForce: resolved.frictionForce, netForce: resolved.netForce, acceleration: resolved.acceleration
  };
}

/* ---------- least-squares fit through the origin ----------
   f = mu*N is a line through the origin, so the lab's "measured mu"
   fits a single-parameter slope (not a general y=mx+b) -- the standard
   regression-through-origin estimator, slope = sum(x*y) / sum(x*x).
   Returns null if there isn't enough information (all x == 0). */
function fitSlopeThroughOrigin(points) {
  var sumXY = 0, sumXX = 0;
  for (var i = 0; i < points.length; i++) {
    sumXY += points[i].x * points[i].y;
    sumXX += points[i].x * points[i].x;
  }
  if (sumXX === 0) { return null; }
  return sumXY / sumXX;
}

/* ---------- motion-HUD state classification ----------
   "Speeding up" vs "slowing down" is acceleration's sign RELATIVE TO
   velocity's sign, not acceleration's sign alone (e.g. a=-3 is slowing
   down while moving forward, but speeding up while moving backward).
   "starting" covers the near-rest instant right as motion begins (too
   little velocity yet to compare signs against); "steady" covers
   near-zero acceleration (constant velocity, including being fully at
   rest in the static regime). */
var MOTION_ACCEL_EPS = 0.05; // m/s^2
var MOTION_VEL_EPS = 0.02; // m/s
function classifyMotionState(velocity, acceleration) {
  if (Math.abs(acceleration) < MOTION_ACCEL_EPS) { return "steady"; }
  if (Math.abs(velocity) < MOTION_VEL_EPS) { return "starting"; }
  var sameSign = (acceleration > 0) === (velocity > 0);
  return sameSign ? "speeding" : "slowing";
}

/* ============================================================
   Scene / rendering state
   ============================================================ */
var canvas = document.getElementById("stage");
var ctx = canvas.getContext("2d");
var dpr = 1;

function resizeCanvas() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

var MASS_RANGE = { min: 0.5, max: 60 };
var FORCE_RANGE = { min: -400, max: 400 };
// Symmetric around 0 so the slider's center is a flat ramp and either
// side tilts the incline the opposite direction -- same physics either
// way, since resolveFriction already works off signed drive forces.
var ANGLE_RANGE = { min: -55, max: 55 }; // degrees

var params = {
  objectMaterial: "wood",
  surfaceMaterial: "wood",
  mass: 10,
  appliedForce: 0,
  scenario: "flat", // "flat" | "incline"
  angleDeg: 20,
  pullAngleDeg: 0
};

var state = { regime: "static", velocity: 0, position: 0 };
var paused = false;
var lastResult = { regime: "static", frictionForce: 0, netForce: 0, acceleration: 0, velocity: 0 };
var hasBrokenAway = false;
var breakawayDriveForce = 0;
var autoRampOn = false;
var AUTO_RAMP_RATE = 25; // N/s
var labMessage = "", labMessageGood = false;
var frictionAppliedCanvasEl = null, frictionAppliedCtx = null;
var lastFrameTime = null;
var cameraOffsetM = 0;
var MAX_SUBSTEP_DT = 1 / 120;

// Tracks the live Applied Force slider row (if the controls panel is
// currently showing one) so other ways of changing the force --
// dragging the crate, the zero-force button, clicking the accel HUD --
// can keep it in sync instead of only mutating params directly.
var forceSliderRow = null;
function setAppliedForce(value) {
  params.appliedForce = Math.max(FORCE_RANGE.min, Math.min(FORCE_RANGE.max, value));
  if (forceSliderRow) {
    forceSliderRow.slider.value = String(params.appliedForce);
    forceSliderRow.label.textContent = forceLabelPrefix() + fmtForceLabel(params.appliedForce);
  }
}

var vectorsOn = { gravity: true, normal: true, applied: true, friction: true, net: true, gravComp: false };

var PX_PER_M = 70;

function currentPhys() {
  var f = getFriction(params.objectMaterial, params.surfaceMaterial);
  var thetaRad = params.scenario === "incline" ? (params.angleDeg * Math.PI / 180) : 0;
  var biasForce = params.scenario === "incline" ? gravityAlongIncline(params.mass, thetaRad) : 0;
  var pullRad = params.scenario === "flat" ? (params.pullAngleDeg * Math.PI / 180) : 0;
  var alongForce, liftForce, normalForce;
  if (params.scenario === "flat") {
    // Rope-pull at angle theta above horizontal: F*cos(theta) drives along
    // the surface, F*sin(theta) lifts and so reduces FN = mg - F*sin(theta).
    alongForce = params.appliedForce * Math.cos(pullRad);
    liftForce = Math.abs(params.appliedForce) * Math.sin(pullRad);
    normalForce = Math.max(0, normalForceFlat(params.mass) - liftForce);
  } else {
    // On an incline the applied force acts along the ramp; pull angle ignored.
    alongForce = params.appliedForce; liftForce = 0;
    normalForce = normalForceIncline(params.mass, thetaRad);
  }
  return { mus: f.mus, muk: f.muk, mass: params.mass, normalForce: normalForce, biasForce: biasForce, appliedForce: alongForce, rawAppliedForce: params.appliedForce, pullAngleRad: pullRad, liftForce: liftForce, thetaRad: thetaRad };
}
function forceLabelPrefix() { return params.scenario === "incline" ? "Applied Force (along ramp): " : "Applied Force: "; }

function resetState() {
  state = { regime: "static", velocity: 0, position: 0 };
  cameraOffsetM = 0;
}

/* ============================================================
   World <-> screen mapping. Physics stays in simple 1D "along-axis"
   coordinates (position, in meters) for both flat and incline; only
   rendering rotates that axis into screen space by the current ramp
   angle (0 for flat). Gravity is the one vector that does NOT rotate
   with the ramp -- it always points straight down on screen, exactly
   as it does in reality.
   ============================================================ */
function stageCenter() { return { x: canvas.width / dpr * 0.46, y: canvas.height / dpr * 0.56 }; }
function alongDir(theta) { return { x: Math.cos(theta), y: -Math.sin(theta) }; } // world frame, +y = up
function normalDir(theta) { return { x: Math.sin(theta), y: Math.cos(theta) }; }

function worldToScreen(worldX, worldY) {
  var c = stageCenter();
  return { x: c.x + worldX * PX_PER_M, y: c.y - worldY * PX_PER_M };
}

// Contact point (where the object touches the surface) for the current
// state.position, camera-relative.
function contactPointWorld() {
  var theta = currentPhys().thetaRad;
  var a = alongDir(theta);
  var s = state.position - cameraOffsetM;
  return { x: a.x * s, y: a.y * s };
}

function crateHalfThickness() {
  return 0.22 + Math.min(0.18, params.mass / 300); // meters, mild size-with-mass cue
}

/* ============================================================
   Material rendering: surfaces and the crate are drawn with procedural
   canvas gradients (no texture images), color-coded consistently
   between the ground strip and the crate's own material accent.
   ============================================================ */
var SURFACE_COLORS = {
  wood: { base: "#5a3d22", light: "#8a6338", accent: "#C9924B" },
  steel: { base: "#4a525c", light: "#9aa6b2", accent: "#AEB8C2" },
  rubber: { base: "#201a1a", light: "#3a2426", accent: "#B5463D" },
  ice: { base: "#9fd9e8", light: "#eafcff", accent: "#BFF3FF" },
  concrete: { base: "#5c6168", light: "#7d838b", accent: "#9AA3AC" },
  glass: { base: "#39474c", light: "#dff3f5", accent: "#AEE9EE" },
  castiron: { base: "#2b2d30", light: "#6d7278", accent: "#9AA0A6" },
  leather: { base: "#3c2415", light: "#7a4a2e", accent: "#B97A46" }
};
var OBJECT_COLORS = {
  wood: "#C9924B", steel: "#AEB8C2", cardboard: "#C2A878", rubber: "#B5463D", stone: "#8C93A0",
  glass: "#CFEFF5", castiron: "#4A4D52", leather: "#8B5A2B"
};

function drawGroundStrip(theta) {
  var c = stageCenter();
  var a = alongDir(theta), n = normalDir(theta);
  var diag = Math.hypot(canvas.width / dpr, canvas.height / dpr);
  var p0 = { x: c.x - a.x * diag, y: c.y + a.y * diag };
  var p1 = { x: c.x + a.x * diag, y: c.y - a.y * diag };
  var thickness = 22;
  var nx = n.x, ny = -n.y; // screen-space normal (already accounts for y flip)

  var colors = SURFACE_COLORS[params.surfaceMaterial];
  var grad = ctx.createLinearGradient(p0.x - nx * thickness, p0.y - ny * thickness, p0.x + nx * thickness, p0.y + ny * thickness);
  grad.addColorStop(0, colors.light);
  grad.addColorStop(0.45, colors.base);
  grad.addColorStop(1, "#05060a");

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p0.x - nx * thickness, p0.y - ny * thickness);
  ctx.lineTo(p1.x - nx * thickness, p1.y - ny * thickness);
  ctx.lineTo(p1.x + nx * thickness * 2.4, p1.y + ny * thickness * 2.4);
  ctx.lineTo(p0.x + nx * thickness * 2.4, p0.y + ny * thickness * 2.4);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // glowing top edge -- the actual contact line
  ctx.beginPath();
  ctx.moveTo(p0.x - nx * thickness, p0.y - ny * thickness);
  ctx.lineTo(p1.x - nx * thickness, p1.y - ny * thickness);
  ctx.strokeStyle = colors.accent;
  ctx.lineWidth = 2;
  ctx.shadowColor = colors.accent;
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();
}

// Distance markers scrolling past along the ground/ramp -- with the
// crate locked dead-center (see frame()), this is the thing that
// actually carries "am I moving, and how fast" now that the crate
// itself never visibly drifts. Minor ticks every 1m, a brighter major
// tick + distance label every 5m, anchored to world position 0 (where
// the sim starts/resets), so it doubles as a literal odometer.
function drawGroundMarkers(theta) {
  var a = alongDir(theta), n = normalDir(theta);
  var nx = n.x, ny = -n.y;
  var halfRangeM = (canvas.width / dpr) / PX_PER_M / 2 + 3;
  var startM = Math.floor(cameraOffsetM - halfRangeM);
  var endM = Math.ceil(cameraOffsetM + halfRangeM);
  var colors = SURFACE_COLORS[params.surfaceMaterial];

  ctx.save();
  for (var m = startM; m <= endM; m++) {
    var s = m - cameraOffsetM;
    var worldPt = { x: a.x * s, y: a.y * s };
    var p = worldToScreen(worldPt.x, worldPt.y);
    var isMajor = m % 5 === 0;
    var tickLen = isMajor ? 18 : 8;

    ctx.beginPath();
    ctx.moveTo(p.x - nx * tickLen * 0.5, p.y - ny * tickLen * 0.5);
    ctx.lineTo(p.x + nx * tickLen * 0.5, p.y + ny * tickLen * 0.5);
    ctx.strokeStyle = isMajor ? colors.accent : "rgba(255,255,255,0.22)";
    ctx.lineWidth = isMajor ? 2 : 1;
    if (isMajor) { ctx.shadowColor = colors.accent; ctx.shadowBlur = 6; } else { ctx.shadowBlur = 0; }
    ctx.stroke();

    if (isMajor) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = "10px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(m + "m", p.x + nx * (tickLen + 12), p.y + ny * (tickLen + 12));
    }
  }
  ctx.restore();
}

// Updated by drawCrate every frame so the drag-to-set-applied-force
// pointer handlers can hit-test against the crate's current screen
// position/size without redoing the world->screen math themselves.
var lastCrateScreenPos = { x: 0, y: 0 };
var lastCrateSizePx = 60;

function drawCrate(theta) {
  var contact = contactPointWorld();
  var n = normalDir(theta);
  var halfT = crateHalfThickness();
  var centerWorld = { x: contact.x + n.x * halfT, y: contact.y + n.y * halfT };
  var s = worldToScreen(centerWorld.x, centerWorld.y);

  var sizePx = 46 + Math.min(26, params.mass * 0.9);
  var color = OBJECT_COLORS[params.objectMaterial];
  lastCrateScreenPos = s;
  lastCrateSizePx = sizePx;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(-theta);

  // soft glow halo behind the crate
  var halo = ctx.createRadialGradient(0, 0, sizePx * 0.2, 0, 0, sizePx * 1.1);
  halo.addColorStop(0, color + "55");
  halo.addColorStop(1, color + "00");
  ctx.fillStyle = halo;
  ctx.fillRect(-sizePx * 1.1, -sizePx * 1.1, sizePx * 2.2, sizePx * 2.2);

  // body with a subtle top-highlight gradient
  var bodyGrad = ctx.createLinearGradient(0, -sizePx / 2, 0, sizePx / 2);
  bodyGrad.addColorStop(0, shadeColor(color, 0.35));
  bodyGrad.addColorStop(0.5, color);
  bodyGrad.addColorStop(1, shadeColor(color, -0.35));
  roundRectPath(-sizePx / 2, -sizePx / 2, sizePx, sizePx, 8);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2;
  ctx.strokeStyle = color;
  roundRectPath(-sizePx / 2, -sizePx / 2, sizePx, sizePx, 8);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
  return s;
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shadeColor(hex, amt) {
  var c = hex.replace("#", "");
  var r = parseInt(c.substring(0, 2), 16), g = parseInt(c.substring(2, 4), 16), b = parseInt(c.substring(4, 6), 16);
  function adj(v) { return Math.max(0, Math.min(255, Math.round(v + (amt > 0 ? (255 - v) * amt : v * amt)))); }
  return "rgb(" + adj(r) + "," + adj(g) + "," + adj(b) + ")";
}

/* ---------- force vectors ----------
   Each vector is a scalar magnitude along a known world direction
   (gravity: fixed straight down; normal/applied/friction/net: along the
   current ramp basis). Drawn with a glow, color-coded, individually
   toggleable. */
var VEC_SCALE = 0.55; // screen px per newton
var VEC_COLORS = { gravity: "#FFB300", normal: "#5FD3C4", applied: "#FFFFFF", friction: "#B07CFF", net: "#FF5FAE" };

function drawVector(originScreen, worldDx, worldDy, color, label) {
  var mag = Math.hypot(worldDx, worldDy);
  if (mag < 0.5) { return; }
  var endX = originScreen.x + worldDx * VEC_SCALE;
  var endY = originScreen.y - worldDy * VEC_SCALE;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(originScreen.x, originScreen.y);
  ctx.lineTo(endX, endY);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  var angle = Math.atan2(endY - originScreen.y, endX - originScreen.x);
  var headLen = 9;
  ctx.beginPath();
  ctx.moveTo(endX, endY);
  ctx.lineTo(endX - headLen * Math.cos(angle - 0.4), endY - headLen * Math.sin(angle - 0.4));
  ctx.lineTo(endX - headLen * Math.cos(angle + 0.4), endY - headLen * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (label) {
    var len = Math.max(1, Math.hypot(endX - originScreen.x, endY - originScreen.y));
    var lx = endX + (endX - originScreen.x) / len * 10, ly = endY + (endY - originScreen.y) / len * 10;
    ctx.shadowBlur = 0; ctx.font = "700 10px 'JetBrains Mono', monospace"; ctx.textAlign = "center";
    ctx.fillStyle = color; ctx.fillText(label, lx, ly);
  }
  ctx.restore();
}
function drawDashedVector(originScreen, worldDx, worldDy, color, label) {
  var mag = Math.hypot(worldDx, worldDy);
  if (mag < 0.5) { return; }
  var endX = originScreen.x + worldDx * VEC_SCALE, endY = originScreen.y - worldDy * VEC_SCALE;
  ctx.save(); ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(originScreen.x, originScreen.y); ctx.lineTo(endX, endY);
  ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
  if (label) { ctx.font = "10px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.fillStyle = color; ctx.fillText(label, endX + 6, endY - 6); }
  ctx.restore();
}

function drawAllVectors(origin, phys, result, theta) {
  var a = alongDir(theta), n = normalDir(theta);
  var weight = phys.mass * G;
  if (vectorsOn.gravity) { drawVector(origin, 0, -weight, VEC_COLORS.gravity, "Fg = " + fmtN(weight)); }
  if (params.scenario === "incline" && vectorsOn.gravComp) {
    drawDashedVector(origin, a.x * phys.biasForce, a.y * phys.biasForce, "#FFD54A", "mg·sinθ = " + fmtN(Math.abs(phys.biasForce)));
    drawDashedVector(origin, -n.x * phys.normalForce, -n.y * phys.normalForce, "#FFE082", "mg·cosθ = " + fmtN(phys.normalForce));
    // small angle arc between horizontal and the ramp direction
    ctx.save(); ctx.strokeStyle = "rgba(255,213,74,0.8)"; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(origin.x + 58, origin.y); ctx.stroke(); ctx.setLineDash([]);
    var rampAng = Math.atan2(-a.y, a.x);
    ctx.beginPath(); ctx.arc(origin.x, origin.y, 40, 0, rampAng, rampAng < 0); ctx.stroke();
    ctx.fillStyle = "#FFD54A"; ctx.font = "10px 'JetBrains Mono', monospace"; ctx.textAlign = "left";
    ctx.fillText(Math.abs(params.angleDeg).toFixed(0) + "°", origin.x + 46, origin.y - 6); ctx.restore();
  }
  if (vectorsOn.normal) { drawVector(origin, n.x * phys.normalForce, n.y * phys.normalForce, VEC_COLORS.normal, "FN = " + fmtN(phys.normalForce)); }
  if (vectorsOn.applied && Math.abs(params.appliedForce) > 0.5) {
    if (params.scenario === "flat" && params.pullAngleDeg > 0.5) {
      drawVector(origin, phys.appliedForce, phys.liftForce, VEC_COLORS.applied, "Fapp = " + fmtN(Math.abs(params.appliedForce)) + " @ " + params.pullAngleDeg.toFixed(0) + "°");
      drawDashedVector(origin, phys.appliedForce, 0, "rgba(255,255,255,0.65)", "F·cosθ");
      drawDashedVector(origin, 0, phys.liftForce, "rgba(255,255,255,0.65)", "F·sinθ");
    } else {
      drawVector(origin, a.x * phys.appliedForce, a.y * phys.appliedForce, VEC_COLORS.applied, "Fapp = " + fmtN(Math.abs(phys.rawAppliedForce)));
    }
  }
  if (vectorsOn.friction && Math.abs(result.frictionForce) > 0.5) { drawVector(origin, a.x * result.frictionForce, a.y * result.frictionForce, VEC_COLORS.friction, "Ff = " + fmtN(Math.abs(result.frictionForce)) + (result.regime === "static" ? " static" : " kinetic")); }
  if (vectorsOn.net && Math.abs(result.netForce) > 0.5) { drawVector(origin, a.x * result.netForce, a.y * result.netForce, VEC_COLORS.net, "Fnet = " + fmtN(Math.abs(result.netForce))); }
}

/* ============================================================
   Status banner + HUD text
   ============================================================ */
var statusType = document.getElementById("statusType");
var statusReason = document.getElementById("statusReason");
var statusBanner = document.getElementById("statusBanner");

function fmtN(v) { return v.toFixed(1) + " N"; }

function updateStatusBanner(phys, result) {
  var maxStatic = phys.mus * phys.normalForce;
  statusBanner.classList.toggle("sliding", result.regime === "sliding");
  if (result.regime === "static") {
    statusType.textContent = "Holding Static";
    statusReason.textContent = "Friction " + fmtN(Math.abs(result.frictionForce)) + " of a max " + fmtN(maxStatic) + " available (μs·N)";
  } else {
    statusType.textContent = "Sliding -- Kinetic Friction";
    statusReason.textContent = "f_k = " + fmtN(Math.abs(result.frictionForce)) + " · net " + fmtN(result.netForce) + " · a = " + result.acceleration.toFixed(2) + " m/s²";
  }
}

/* ---------- motion HUD: big digital velocity/acceleration readout ---------- */
var hudVelocityEl = document.getElementById("hudVelocity");
var hudAccelEl = document.getElementById("hudAccel");
var MOTION_COLORS = { speeding: "#4CD96A", slowing: "#FF6B5B", starting: "#FFE066", steady: "#E9E6DE" };
var MOTION_WORDS = { speeding: "Speeding up", slowing: "Slowing down", starting: "Starting", steady: "Steady" };
function updateEqStrip(phys, result) {
  var el = document.getElementById("eqStrip"); if (!el) { return; }
  var fsMax = phys.mus * phys.normalForce, fk = phys.muk * phys.normalForce;
  var fricTerm = result.regime === "sliding" ? ("fk = μk·FN = " + fmtN(fk)) : ("fs,max = μs·FN = " + fmtN(fsMax));
  var word = result.regime === "static" ? "Steady (holding still)" : (MOTION_WORDS[classifyMotionState(result.velocity, result.acceleration)] || "Steady");
  el.textContent = "FN = " + fmtN(phys.normalForce) + " · " + fricTerm + " · Fnet = " + fmtN(result.netForce) + " · a = " + result.acceleration.toFixed(2) + " m/s² · " + word;
}
function updateMotionHud(result) {
  hudVelocityEl.textContent = result.velocity.toFixed(1);
  hudAccelEl.textContent = result.acceleration.toFixed(2);
  hudAccelEl.style.color = MOTION_COLORS[classifyMotionState(result.velocity, result.acceleration)];
}

/* ============================================================
   Main loop
   ============================================================ */
function frame(now) {
  if (lastFrameTime === null) { lastFrameTime = now; }
  var dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  var phys = currentPhys();
  var result = { regime: state.regime, frictionForce: 0, netForce: 0, acceleration: 0 };
  var prevRegime = state.regime;
  if (autoRampOn && !paused) {
    setAppliedForce(params.appliedForce + AUTO_RAMP_RATE * dt);
    phys = currentPhys();
  }

  if (!paused) {
    var steps = Math.max(1, Math.ceil(dt / MAX_SUBSTEP_DT));
    var subDt = dt / steps;
    for (var i = 0; i < steps; i++) {
      result = stepFriction(state, phys, subDt);
      state.regime = result.regime; state.velocity = result.velocity; state.position = result.position;
    }
  } else {
    result = resolveFriction({ regime: state.regime, velocity: state.velocity, appliedForce: phys.appliedForce, biasForce: phys.biasForce, normalForce: phys.normalForce, mus: phys.mus, muk: phys.muk, mass: phys.mass });
  }

  // The crate stays locked dead-center; all motion reads through the
  // scrolling ground markers instead of the crate drifting on screen.
  cameraOffsetM = state.position;
  result.velocity = state.velocity;
  lastResult = result;
  if (prevRegime === "static" && result.regime === "sliding") {
    // Breakaway: the total drive (applied along axis + gravity along ramp)
    // at this instant is the measured maximum static friction force.
    hasBrokenAway = true;
    breakawayDriveForce = Math.abs(phys.appliedForce + phys.biasForce);
    lastStaticPeakForce = Math.max(lastStaticPeakForce, breakawayDriveForce);
    autoRampOn = false; // freeze the ramp at the slip point
  }
  if (result.regime === "static") {
    lastStaticPeakForce = Math.max(lastStaticPeakForce, Math.abs(phys.appliedForce + phys.biasForce));
  }

  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  drawGroundStrip(phys.thetaRad);
  drawGroundMarkers(phys.thetaRad);
  var crateScreen = drawCrate(phys.thetaRad);
  drawAllVectors(crateScreen, phys, result, phys.thetaRad);
  updateStatusBanner(phys, result);
  updateMotionHud(result);
  updateEqStrip(phys, result);
  updateMotionSound(phys, result);
  updateLabLiveReadout(phys, result);

  if (!labPanel.classList.contains("hidden") && forceTimeCanvasEl) {
    var nowT = (now - labClockStart) / 1000;
    forceTimeHistory.push({ t: nowT, applied: params.appliedForce, friction: result.frictionForce });
    var cutoff = nowT - FORCE_TIME_WINDOW - 1;
    while (forceTimeHistory.length && forceTimeHistory[0].t < cutoff) { forceTimeHistory.shift(); }
    drawForceTimeGraph(forceTimeCtx, forceTimeCanvasEl.width, forceTimeCanvasEl.height);
    if (frictionAppliedCtx && frictionAppliedCanvasEl) { drawFrictionAppliedGraph(frictionAppliedCtx, frictionAppliedCanvasEl.width, frictionAppliedCanvasEl.height); }
  }

  requestAnimationFrame(frame);
}

/* ============================================================
   Exponential slider mapping (mass spans a wide range) -- same
   technique as Space Sandbox's Properties panel / Eclipses' Controls.
   ============================================================ */
function sliderToValue(sliderPct, min, max) {
  var t = Math.max(0, Math.min(100, sliderPct)) / 100;
  return min * Math.pow(max / min, t);
}
function valueToSlider(value, min, max) {
  var v = Math.max(min, Math.min(max, value));
  var t = Math.log(v / min) / Math.log(max / min);
  return Math.max(0, Math.min(100, t * 100));
}

// mid-drag (same lesson learned building Space Sandbox's Properties
// panel), so live-dragged rows return {row, slider, label} and the
// caller patches labels directly instead of calling refreshControlsPanel()
// on every input event. A full rebuild only happens on discrete actions
// (material pick, scenario toggle, vector toggle, Reset).
function makeExpSliderRow(labelFn, value, min, max, onInput) {
  var row = document.createElement("div");
  row.className = "panel-row";
  var label = document.createElement("div");
  label.className = "panel-label";
  label.textContent = labelFn(value);
  row.appendChild(label);
  var slider = document.createElement("input");
  slider.type = "range"; slider.min = "0"; slider.max = "100"; slider.step = "0.1";
  slider.value = String(valueToSlider(value, min, max));
  slider.addEventListener("input", function() {
    var v = sliderToValue(parseFloat(slider.value), min, max);
    label.textContent = labelFn(v);
    onInput(v);
  });
  row.appendChild(slider);
  return { row: row, slider: slider, label: label };
}
function makeLinearSliderRow(labelFn, value, min, max, step, onInput) {

/* ---------- graphs ----------
   Plain canvas line/scatter charts, extending the padding+scale
   technique app.js already uses for the student-dashboard's monthly
   charts -- but with axis lines and gridlines added (the dashboard
   charts have neither), since reading a slope off these actually
   matters here. */
function graphAxes(ctx, w, h, pad, yMin, yMax, yLabelFn) {
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1;
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.textAlign = "right";
  var gridLines = 4;
  for (var i = 0; i <= gridLines; i++) {
    var y = pad + (h - 2 * pad) * (i / gridLines);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
    var val = yMax - (yMax - yMin) * (i / gridLines);
    ctx.fillText(yLabelFn(val), pad - 6, y + 3);
  }
  // zero line, brighter, if in range
  if (yMin < 0 && yMax > 0) {
    var zeroY = pad + (h - 2 * pad) * (yMax / (yMax - yMin));
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.moveTo(pad, zeroY); ctx.lineTo(w - pad, zeroY); ctx.stroke();
  }
}

function drawForceTimeGraph(ctx, w, h) {
  var pad = 36;
  var nowT = (performance.now() - labClockStart) / 1000;
  var windowStart = nowT - FORCE_TIME_WINDOW;
  var visible = forceTimeHistory.filter(function(s) { return s.t >= windowStart; });
  var maxAbs = 10;
  visible.forEach(function(s) { maxAbs = Math.max(maxAbs, Math.abs(s.applied), Math.abs(s.friction)); });
  maxAbs *= 1.15;

  graphAxes(ctx, w, h, pad, -maxAbs, maxAbs, function(v) { return v.toFixed(0); });

  function X(t) { return pad + (w - 2 * pad) * ((t - windowStart) / FORCE_TIME_WINDOW); }
  function Y(f) { return pad + (h - 2 * pad) * ((maxAbs - f) / (2 * maxAbs)); }

  function plotSeries(key, color) {
    if (visible.length < 2) { return; }
    ctx.beginPath();
    visible.forEach(function(s, i) {
      var x = X(s.t), y = Y(s[key]);
      if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    });
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  }
  plotSeries("applied", VEC_COLORS.applied);
  plotSeries("friction", VEC_COLORS.friction);

  ctx.textAlign = "left";
  ctx.fillStyle = VEC_COLORS.applied; ctx.fillText("— Applied", pad, h - 8);
  ctx.fillStyle = VEC_COLORS.friction; ctx.fillText("— Friction", pad + 80, h - 8);
}

function drawFrictionNormalGraph(ctx, w, h) {
  var pad = 36;
  var staticPts = [], kineticPts = [];
  labTrials.forEach(function(t) {
    if (t.fsMax !== null) { staticPts.push({ x: t.normalForce, y: t.fsMax }); }
    if (t.fk !== null) { kineticPts.push({ x: t.normalForce, y: t.fk }); }
  });
  var allPts = staticPts.concat(kineticPts);
  var maxX = 50, maxY = 50;
  allPts.forEach(function(p) { maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
  maxX *= 1.15; maxY *= 1.15;

  graphAxes(ctx, w, h, pad, 0, maxY, function(v) { return v.toFixed(0); });

  function X(x) { return pad + (w - 2 * pad) * (x / maxX); }
  function Y(y) { return pad + (h - 2 * pad) * (1 - y / maxY); }

  function plotScatterAndFit(pts, color) {
    pts.forEach(function(p) {
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 4, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
    });
    var slope = fitSlopeThroughOrigin(pts);
    if (slope !== null) {
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(maxX), Y(slope * maxX));
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
    return slope;
  }
  var musFit = plotScatterAndFit(staticPts, VEC_COLORS.net);
  var mukFit = plotScatterAndFit(kineticPts, VEC_COLORS.friction);

  ctx.textAlign = "left"; ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillStyle = VEC_COLORS.net;
  ctx.fillText("• f_s,max  (slope ≈ μs = " + (musFit !== null ? musFit.toFixed(3) : "—") + ")", pad, h - 22);
  ctx.fillStyle = VEC_COLORS.friction;
  ctx.fillText("• f_k  (slope ≈ μk = " + (mukFit !== null ? mukFit.toFixed(3) : "—") + ")", pad, h - 8);
}

function drawFrictionAppliedGraph(ctx, w, h) {
  var phys = currentPhys();
  var fsMax = phys.mus * phys.normalForce, fk = phys.muk * phys.normalForce;
  var drive = phys.appliedForce + phys.biasForce;
  var pad = 38, padB = 30;
  var maxX = Math.max(60, fsMax * 1.5, Math.abs(drive) * 1.2);
  var maxY = Math.max(40, fsMax * 1.25);
  ctx.clearRect(0, 0, w, h);
  function X(x){ return pad + (w - pad - 12) * (x / maxX); }
  function Y(y){ return 12 + (h - 12 - padB) * (1 - y / maxY); }
  // shaded regions
  ctx.fillStyle = "rgba(176,124,255,0.13)"; ctx.fillRect(X(0), 12, Math.max(0, X(fsMax)-X(0)), h-12-padB);
  ctx.fillStyle = "rgba(255,179,0,0.10)"; ctx.fillRect(X(fsMax), 12, Math.max(0, X(maxX)-X(fsMax)), h-12-padB);
  ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.moveTo(pad,12); ctx.lineTo(pad,h-padB); ctx.lineTo(w-12,h-padB); ctx.stroke();
  // classic curve: 45-degree static line, drop at fs,max, kinetic plateau
  ctx.strokeStyle = "#B07CFF"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(fsMax),Y(fsMax)); ctx.lineTo(X(fsMax),Y(fk)); ctx.lineTo(X(maxX),Y(fk)); ctx.stroke(); ctx.lineWidth = 1;
  ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.moveTo(X(fsMax),Y(0)); ctx.lineTo(X(fsMax),Y(fsMax)); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = "10px 'JetBrains Mono', monospace"; ctx.textAlign = "center";
  ctx.fillStyle = "#B07CFF"; ctx.fillText("STATIC", Math.max(pad+28,(X(0)+X(fsMax))/2), h-padB-10);
  ctx.fillStyle = "#FFB300"; ctx.fillText("KINETIC", (X(fsMax)+X(maxX))/2, h-padB-10);
  ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillText("fs,max = " + fsMax.toFixed(1) + " N", X(fsMax), Y(fsMax)-8);
  ctx.fillText("fk = " + fk.toFixed(1) + " N", Math.min(w-50, X(maxX)-30), Y(fk)-8);
  ctx.fillText(params.scenario === "incline" ? "total drive force (applied + mg·sinθ) →" : "applied force →", (pad+w)/2, h-8);
  ctx.save(); ctx.translate(11,h/2); ctx.rotate(-Math.PI/2); ctx.fillText("friction force",0,0); ctx.restore();
  // live marker
  var lx = X(Math.min(maxX, Math.abs(drive))), ly = Y(Math.min(maxY, Math.abs(lastResult.frictionForce)));
  ctx.fillStyle = "#FF5FAE"; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#FF5FAE"; ctx.fillText("you: " + Math.abs(lastResult.frictionForce).toFixed(1) + " N", lx, Math.max(36, ly-12));
}

/* ============================================================
   Drag-the-crate as an alternative to the Applied Force slider.
   The crate itself never moves on screen (locked dead-center), so its
   hit box is static between frames -- press near it and drag along the
   ramp's screen direction to push the applied force up or down, exactly
   like dragging the slider but directly on the object.
   ============================================================ */
var crateDrag = null;
var DRAG_FORCE_PER_PX = 3;

function canvasPointerPos(e) {
  var rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function isNearCrate(pos) {
  var dx = pos.x - lastCrateScreenPos.x, dy = pos.y - lastCrateScreenPos.y;
  return Math.hypot(dx, dy) < lastCrateSizePx * 0.85;
}

canvas.addEventListener("pointerdown", function(e) {
  var pos = canvasPointerPos(e);
  if (!isNearCrate(pos)) { return; }
  crateDrag = { startX: pos.x, startY: pos.y, startForce: params.appliedForce, pointerId: e.pointerId };
  canvas.style.cursor = "grabbing";
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* unsupported, ignore */ }
});
canvas.addEventListener("pointermove", function(e) {
  var pos = canvasPointerPos(e);
  if (crateDrag) {
    var theta = currentPhys().thetaRad;
    var alongScreen = { x: Math.cos(theta), y: Math.sin(theta) };
    var dx = pos.x - crateDrag.startX, dy = pos.y - crateDrag.startY;
    var alongPx = dx * alongScreen.x + dy * alongScreen.y;
    setAppliedForce(crateDrag.startForce + alongPx * DRAG_FORCE_PER_PX);
    e.preventDefault();
  } else {
    canvas.style.cursor = isNearCrate(pos) ? "grab" : "default";
  }
});
function endCrateDrag(e) {
  if (crateDrag) {
    try { canvas.releasePointerCapture(crateDrag.pointerId); } catch (err) { /* ignore */ }
  }
  crateDrag = null;
  canvas.style.cursor = "default";
}
canvas.addEventListener("pointerup", endCrateDrag);
canvas.addEventListener("pointercancel", endCrateDrag);

// Tapping the acceleration readout is a quick way to ask "what if there
// were no net push" -- zero the applied force, same as the controls-
// panel button, achieving zero acceleration (modulo friction already

document.getElementById("hudAccelTile").addEventListener("click", function(e) {
  e.stopPropagation();
  setAppliedForce(0);
});

/* ============================================================
   Sound design -- procedural Web Audio, no external audio assets
   (same zero-asset spirit as Eclipses' canvas-generated corona
   texture). A filtered-noise loop reads as a scrape/slide sound while
   kinetic friction is active, with its pitch and volume tied to
   speed; a short percussive "thud" fires once on the sliding-to-
   static transition. Lazily created on first user gesture (autoplay
   policy) and fully guarded -- if Web Audio isn't available, sound is
   silently a no-op rather than breaking anything else.
   ============================================================ */
var audioCtx = null;
var masterGain = null;
var scrapeSource = null, scrapeFilter = null, scrapeGain = null;
var soundMuted = false;
var soundSupported = !!(window.AudioContext || window.webkitAudioContext);
var lastRegimeForSound = "static";
var muteBtn = document.getElementById("muteBtn");

function ensureAudioContext() {
  if (audioCtx || !soundSupported) { return; }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctor();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = soundMuted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
  } catch (e) {
    soundSupported = false;
  }
}

function makeNoiseBuffer(ctxForBuffer) {
  var length = ctxForBuffer.sampleRate * 2;
  var buffer = ctxForBuffer.createBuffer(1, length, ctxForBuffer.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i = 0; i < length; i++) { data[i] = Math.random() * 2 - 1; }
  return buffer;
}

function startScrapeLoop(profile) {
  if (!soundSupported) { return; }
  ensureAudioContext();
  if (!audioCtx || scrapeSource) { return; }
  try {
    if (audioCtx.state === "suspended") { audioCtx.resume(); }
    scrapeSource = audioCtx.createBufferSource();
    scrapeSource.buffer = makeNoiseBuffer(audioCtx);
    scrapeSource.loop = true;
    scrapeFilter = audioCtx.createBiquadFilter();
    scrapeFilter.type = "bandpass";
    scrapeFilter.frequency.value = profile.freqHz;
    scrapeFilter.Q.value = profile.q;
    scrapeGain = audioCtx.createGain();
    scrapeGain.gain.value = 0;
    scrapeSource.connect(scrapeFilter);
    scrapeFilter.connect(scrapeGain);
    scrapeGain.connect(masterGain);
    scrapeSource.start();
  } catch (e) { scrapeSource = null; scrapeFilter = null; scrapeGain = null; }
}

function stopScrapeLoop() {
  if (!scrapeSource) { return; }
  try {
    scrapeGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
    var src = scrapeSource;
    setTimeout(function() { try { src.stop(); } catch (e) { /* already stopped */ } }, 80);
  } catch (e) { /* ignore */ }
  scrapeSource = null; scrapeFilter = null; scrapeGain = null;
}

// volumeScale (0-1) comes from the pair's kinetic friction coefficient --
// a slicker pair (lower muk, e.g. anything on ice) drags with less force
// and so should sound quieter, not just differently pitched.
function updateScrapeSound(speed, profile, volumeScale) {
  if (!scrapeSource || !audioCtx) { return; }
  var clampedSpeed = Math.min(speed, 12);
  var targetGain = Math.min(0.32, (0.05 + clampedSpeed * 0.022) * volumeScale);
  var targetFreq = profile.freqHz + clampedSpeed * (40 + profile.q * 20);
  scrapeGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.05);
  scrapeFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
  scrapeFilter.Q.setTargetAtTime(profile.q, audioCtx.currentTime, 0.05);
}

// hardness (0-1) shapes the stop "thud": a harder pair (glass, steel,
// cast iron) rings brighter and shorter, a softer pair (cardboard,
// leather, ice) lands duller and a touch longer.
function playThud(profile) {
  if (!soundSupported) { return; }
  ensureAudioContext();
  if (!audioCtx) { return; }
  try {
    if (audioCtx.state === "suspended") { audioCtx.resume(); }
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    var now = audioCtx.currentTime;
    var startFreq = 90 + profile.hardness * 110;
    var endFreq = 40 + profile.hardness * 50;
    var decay = 0.28 - profile.hardness * 0.12;
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(endFreq, now + decay * 0.7);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + decay + 0.03);
  } catch (e) { /* ignore */ }
}

muteBtn.addEventListener("click", function(e) {
  e.stopPropagation();
  ensureAudioContext();
  soundMuted = !soundMuted;
  muteBtn.innerHTML = soundMuted ? "&#128263;" : "&#128266;";
  if (masterGain) { masterGain.gain.setTargetAtTime(soundMuted ? 0 : 1, audioCtx.currentTime, 0.05); }
});

var SOUND_MUK_REF = 0.5; // muk roughly at/above this scales to full volume
function volumeScaleForMuk(muk) {
  return 0.15 + 0.85 * Math.min(1, muk / SOUND_MUK_REF);
}

/* Called once per frame with the latest physics result: starts/stops the
   scrape loop based on the current regime, keeps its pitch/volume tracking
   speed and the current object/surface material pair while sliding, and
   fires a material-matched thud exactly once on the sliding->static
   transition. */
function updateMotionSound(phys, result) {
  var profile = combinedSoundProfile(params.objectMaterial, params.surfaceMaterial);
  if (result.regime === "sliding") {
    startScrapeLoop(profile);
    updateScrapeSound(Math.abs(result.velocity), profile, volumeScaleForMuk(phys.muk));
  } else {
    stopScrapeLoop();
  }
  if (lastRegimeForSound === "sliding" && result.regime === "static") {
    playThud(profile);
  }
  lastRegimeForSound = result.regime;
}


/* ============================================================
   Guided Challenges -- house style (cf. Harmonics Guided Lab):
   predict first, then test in the live sim; scored with feedback
   and worked steps. Uses the exact same engine/params.
   ============================================================ */
var guidedPanel = document.getElementById("guidedPanel");
var guidedOpen = false;
var guidedScore = { ok: 0, total: 0 };
var guidedSlip = null; // {drive, willSlip, fsMax}
function guidedPhysSnapshot() { return currentPhys(); }
function scoreGuided(good) { guidedScore.total++; if (good) { guidedScore.ok++; } }
function refreshGuidedPanel() {
  guidedPanel.innerHTML = "";
  var phys = guidedPhysSnapshot();
  var fsMax = phys.mus * phys.normalForce, fk = phys.muk * phys.normalForce;
  var driveNow = phys.appliedForce + phys.biasForce;
  if (!guidedSlip) { var over = Math.random() < 0.5; var d = fsMax * (over ? 1.25 : 0.7); guidedSlip = { drive: Math.round(d), willSlip: Math.abs(d) > fsMax, fsMax: fsMax }; }
  var h3 = document.createElement("h3"); h3.textContent = "Guided Challenges"; guidedPanel.appendChild(h3);
  var score = document.createElement("p"); score.className = "panel-hint mono"; score.id = "guidedScore";
  score.textContent = "Score: " + guidedScore.ok + " / " + guidedScore.total + " · Setup: " + materialLabel(params.objectMaterial) + " on " + materialLabel(params.surfaceMaterial) + ", " + fmtKg(params.mass) + ", " + params.scenario + (params.scenario==="incline" ? " " + params.angleDeg + "°" : "") + " · FN = " + phys.normalForce.toFixed(1) + " N";
  guidedPanel.appendChild(score);
  function section(title) { var t=document.createElement("div"); t.className="panel-section-title"; t.textContent=title; guidedPanel.appendChild(t); }
  function hint(txt) { var d=document.createElement("p"); d.className="panel-hint"; d.textContent=txt; guidedPanel.appendChild(d); return d; }
  function feedbackEl() { var d=document.createElement("p"); d.className="feedback"; d.setAttribute("aria-live","polite"); guidedPanel.appendChild(d); return d; }
  function numInput(ph) { var i=document.createElement("input"); i.type="number"; i.step="any"; i.className="num-input"; i.placeholder=ph; guidedPanel.appendChild(i); return i; }
  function btnRow(labels, cb) { var r=document.createElement("div"); r.className="chip-row"; labels.forEach(function(L){ var b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=L; b.addEventListener("click",function(e){ e.stopPropagation(); cb(L); }); r.appendChild(b); }); guidedPanel.appendChild(r); }

  section("1 · Predict the breakaway force");
  hint("Predict fs,max = μs·FN for the current setup, check it, then test it in the sim.");
  var in1 = numInput("Your predicted breakaway force (N)");
  var fb1 = feedbackEl();
  btnRow(["Check prediction","Test my prediction in the sim"], function(L){
    var guess = parseFloat(in1.value);
    if (L.indexOf("Test")===0) {
      if (!isFinite(guess)) { fb1.textContent="Enter a prediction first, then test it."; fb1.className="feedback bad"; return; }
      // Set the raw applied force so total drive = guess.
      var needAlong = guess - phys.biasForce;
      var raw = params.scenario==="flat" && phys.pullAngleRad ? needAlong/Math.cos(phys.pullAngleRad) : needAlong;
      setAppliedForce(raw); resetState();
      fb1.textContent="Applied set so total drive = " + guess.toFixed(1) + " N (fs,max = " + fsMax.toFixed(1) + " N). Watch: slips only if your drive beats fs,max."; fb1.className="feedback";
      return;
    }
    if (!isFinite(guess)) { fb1.textContent="Enter a number first — fs,max = μs·FN."; fb1.className="feedback bad"; return; }
    var err = Math.abs(guess-fsMax)/Math.max(1,fsMax)*100; var good = err<=5; scoreGuided(good);
    fb1.textContent=(good?"Correct (within 5%). ":"Not yet ("+err.toFixed(0)+"% off). ")+"Steps: FN = "+phys.normalForce.toFixed(1)+" N · fs,max = μs·FN = "+phys.mus.toFixed(2)+" × "+phys.normalForce.toFixed(1)+" = "+fsMax.toFixed(1)+" N. Score "+guidedScore.ok+"/"+guidedScore.total+".";
    fb1.className="feedback "+(good?"good":"bad"); score.textContent="Score: "+guidedScore.ok+" / "+guidedScore.total;
  });

  section("2 · Will it slip?");
  hint("Total drive is " + guidedSlip.drive.toFixed(0) + " N (fs,max = " + guidedSlip.fsMax.toFixed(1) + " N). Will the block slip?");
  var fb2 = feedbackEl();
  btnRow(["Yes — it slips","No — static holds"], function(L){
    var yes = L.indexOf("Yes")===0; var good = yes===guidedSlip.willSlip; scoreGuided(good);
    fb2.textContent=good?("Correct — drive "+guidedSlip.drive.toFixed(0)+" N "+(guidedSlip.willSlip?">":"≤")+" fs,max "+guidedSlip.fsMax.toFixed(1)+" N.") : ("Not quite — compare: drive "+guidedSlip.drive.toFixed(0)+" N vs fs,max "+guidedSlip.fsMax.toFixed(1)+" N, so it "+(guidedSlip.willSlip?"does slip.":"stays put."))+" Score "+guidedScore.ok+"/"+guidedScore.total+".";
    fb2.className="feedback "+(good?"good":"bad"); score.textContent="Score: "+guidedScore.ok+" / "+guidedScore.total;
  });
  var newSlip=document.createElement("button"); newSlip.className="panel-link"; newSlip.textContent="New will-it-slip force";
  newSlip.addEventListener("click",function(e){ e.stopPropagation(); guidedSlip=null; refreshGuidedPanel(); }); guidedPanel.appendChild(newSlip);

  section("3 · Hold constant velocity while sliding");
  hint("It is sliding steadily. What total drive keeps a ≈ 0? On the flat that means applied ≈ fk; on a ramp, gravity along the ramp helps or fights you.");
  var in3 = numInput("Applied force needed (N, as the slider reads)");
  var fb3 = feedbackEl();
  var needRaw3 = params.scenario==="flat" && phys.pullAngleRad ? (fk-phys.biasForce)/Math.cos(phys.pullAngleRad) : (fk - phys.biasForce);
  // drive must equal fk in the direction of motion (assume + direction); applied = drive - bias
  needRaw3 = params.scenario==="flat" && phys.pullAngleRad ? (fk)/Math.cos(phys.pullAngleRad) : fk - phys.biasForce;
  btnRow(["Check steady-force"], function(){
    var guess=parseFloat(in3.value); if(!isFinite(guess)){ fb3.textContent="Enter a number first."; fb3.className="feedback bad"; return; }
    var err=Math.abs(guess-needRaw3)/Math.max(1,Math.abs(needRaw3))*100; var good=err<=7; scoreGuided(good);
    fb3.textContent=(good?"Correct (within 7%). ":"Not yet ("+err.toFixed(0)+"% off). ")+"Steps: steady ⇒ Fnet = 0 ⇒ drive = fk = μk·FN = "+phys.muk.toFixed(2)+" × "+phys.normalForce.toFixed(1)+" = "+fk.toFixed(1)+" N. Applied (slider) = drive − gravity-along-ramp ("+phys.biasForce.toFixed(1)+" N) = "+needRaw3.toFixed(1)+" N. Score "+guidedScore.ok+"/"+guidedScore.total+".";
    fb3.className="feedback "+(good?"good":"bad"); score.textContent="Score: "+guidedScore.ok+" / "+guidedScore.total;
  });

  section("4 · Which way does friction point? (flat)");
  hint("The block is moving RIGHT, but the push points LEFT (slowing it). Which way does kinetic friction point?");
  var fb4 = feedbackEl();
  btnRow(["Friction points left","Friction points right"], function(L){
    var good = L.indexOf("left")!==-1; scoreGuided(good);
    fb4.textContent=good?("Correct — kinetic friction opposes the velocity. The block moves right, so friction points left (the same way as the leftward push here — both slow the block). Score "+guidedScore.ok+"/"+guidedScore.total+"."):("Not quite — friction opposes velocity, not the applied force. Moving right ⇒ friction points left. Score "+guidedScore.ok+"/"+guidedScore.total+".");
    fb4.className="feedback "+(good?"good":"bad"); score.textContent="Score: "+guidedScore.ok+" / "+guidedScore.total;
  });

  section("5 · Which way on an incline?");
  hint("A block on a ramp is sliding (or about to slide) DOWN the ramp. Which way does friction point?");
  var fb5 = feedbackEl();
  btnRow(["Up the ramp","Down the ramp"], function(L){
    var good = L.indexOf("Up")===0; scoreGuided(good);
    fb5.textContent=good?("Correct — friction opposes the (impending) motion down the ramp, so it points up the ramp. Score "+guidedScore.ok+"/"+guidedScore.total+"."):("Not quite — motion/impending motion is down the ramp, so friction points up the ramp. Score "+guidedScore.ok+"/"+guidedScore.total+".");
    fb5.className="feedback "+(good?"good":"bad"); score.textContent="Score: "+guidedScore.ok+" / "+guidedScore.total;
  });
  hint("Tip: change materials, mass, scenario or pull angle in Controls, then reopen Challenges — the numbers regenerate from the live setup.");
}
document.getElementById("guidedBtn").addEventListener("click", function(e) {
  e.stopPropagation(); guidedOpen = !guidedOpen;
  if (guidedOpen) { refreshGuidedPanel(); }
  guidedPanel.classList.toggle("hidden", !guidedOpen);
  if (guidedOpen) { labOpen = false; labPanel.classList.add("hidden"); }
});

});

var tutorialModal = document.getElementById("tutorialModal");
document.getElementById("tutorialBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  tutorialModal.innerHTML = "";
  var card = document.createElement("div");
  card.className = "modal-card";
  card.innerHTML =
    "<h2>How Friction Lab Works</h2>" +
    "<p>Pick an object and a surface in <strong>Controls</strong>, add mass, then slide <strong>Applied Force</strong> up. Watch <strong>static friction</strong> rise to match it, right up until it hits its maximum -- μs·N -- at which point the object breaks free and <strong>kinetic friction</strong> takes over at a steady μk·N. The status banner at the top always says exactly which regime you're in and why.</p>" +
    "<p>Toggle <strong>Flat Surface / Incline</strong> to try a ramp instead. With zero applied force, raise the angle slider past arctan(μs) and the object starts sliding on its own -- that's the same physics as pushing past the static threshold, just gravity doing the pushing instead of you.</p>" +
    "<p>Every vector (gravity, normal, applied, friction, net) can be toggled on or off in Controls so you can isolate exactly what you're studying.</p>" +
    "<p>Open the <strong>Lab</strong> to turn exploration into measurement: raise the force until it slides and click <strong>Record Max Static</strong>; while it's sliding, ease the force down until acceleration reads ~0 and click <strong>Record Steady Kinetic</strong>. The lab computes μs and μk from your own numbers and plots them against the live force-vs-time trace and a friction-vs-normal-force graph -- the slope of that graph <em>is</em> the coefficient of friction. Export your trial table as a CSV any time.</p>" +
    "<p>In this introductory model, kinetic friction is treated as speed-independent (its size does not change with sliding speed, only with μk·N) and friction does not depend on contact area — notice the crate grows visually as you add mass, yet only the normal force changes the friction, not how big the contact patch looks.</p>" +
    "<p>The friction coefficients here are representative introductory-model values for each object/surface pairing -- real friction also depends on surface condition, lubrication, and temperature.</p>";
  var closeBtn = document.createElement("button");
  closeBtn.className = "close-link";
  closeBtn.textContent = "Got it";
  closeBtn.onclick = function() { tutorialModal.classList.add("hidden"); };
  card.appendChild(closeBtn);
  tutorialModal.appendChild(card);
  tutorialModal.classList.remove("hidden");
});
tutorialModal.addEventListener("click", function(e) { if (e.target === tutorialModal) { tutorialModal.classList.add("hidden"); } });
</script>
